          nGain.connect(warmFilter);
          src.start(startTime);
          src.stop(startTime + 0.1);

          [4186, 5588].forEach((f, i) => {
            const o = starAudioCtx.createOscillator();
            const g = starAudioCtx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(f, startTime);
            g.gain.setValueAtTime(0.0001, startTime);
            g.gain.exponentialRampToValueAtTime(vol * (i === 0 ? 0.26 : 0.18), startTime + 0.005);
            g.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.12);
            o.connect(g);
            g.connect(warmFilter);
            o.start(startTime);
            o.stop(startTime + 0.13);

        // Partitura 2D: Noite Feliz (Silent Night) + Jingle Bells suave em caixinha de música

        // Partitura 3D pós-formação: We Wish You a Merry Christmas + Deck the Halls
        const SEQ_3D_LOOP = [

        function clearFormationTimers() {
          formationTimers.forEach((id) => clearTimeout(id));
          formationTimers = [];
        }

        function stopLoop() {
          if (loopTimer) {
            clearInterval(loopTimer);
            loopTimer = null;
          }
          activeTrack = 'none';
        }

        function startSequenceLoop(trackName, seq, targetMaster) {
          stopLoop();
          clearFormationTimers();
          if (!audioEnabled) return;
          const ctx = ensureCtx();
          if (!ctx) return;

          activeTrack = trackName;
          loopStep = 0;
          nextNoteTime = ctx.currentTime + 0.08;
          setMasterLevel(targetMaster, 0.55);

          loopTimer = setInterval(() => {
            if (!audioEnabled || activeTrack !== trackName || !starAudioCtx) return;
            if (starAudioCtx.state === 'suspended') return;
            while (nextNoteTime < starAudioCtx.currentTime + 0.25) {
              const ev = seq[loopStep];
              if (ev.f) playMusicBoxNote(ev.f, nextNoteTime, Math.max(0.45, ev.d * 1.15), 0.24);
              if (ev.pad) playWarmPad(ev.pad, nextNoteTime, Math.max(0.85, ev.d * 1.6), 0.085);
              if (ev.bell) playSleighBell(nextNoteTime, 0.055);
              nextNoteTime += ev.d;
              loopStep = (loopStep + 1) % seq.length;
            }
          }, 60);
        }

        function start2DMusic() {
          if (!gestureUnlocked || !audioEnabled) return;
          startSequenceLoop('2d', SEQ_2D, 0.15);
        }

        function start3DMusicLoop() {
          if (!gestureUnlocked || !audioEnabled) return;
          startSequenceLoop('3d-loop', SEQ_3D_LOOP, 0.16);
        }

        // Efeito musical natalino sincronizado com as 7 fases da formação da Árvore 3D (~14s)
        function play3DFormationMusic() {
          stopLoop();
          clearFormationTimers();
          if (!audioEnabled) return;
          const ctx = ensureCtx();
          if (!ctx) return;
          gestureUnlocked = true;

          setMasterLevel(0.20, 0.15);
          const t0 = ctx.currentTime + 0.05;

          // Fase 1 (0.0s - 2.2s): Clarão estelar e chão azul — harpa/celesta cintilante ascendente
          [N.C5, N.E5, N.G5, N.B5, N.D6, N.E6].forEach((f, idx) => {
            playMusicBoxNote(f, t0 + idx * 0.24, 0.85, 0.22);
          });
          playWarmPad([N.C3, N.G3, N.E4, N.B4], t0 + 0.05, 2.2, 0.11);
          playSleighBell(t0 + 0.1, 0.08);
          playSleighBell(t0 + 1.1, 0.07);

          // Fase 2 (1.8s - 3.2s): Tronco emerge — acorde quente de preparação
          playWarmPad([N.G3, N.B3, N.D4, N.F4], t0 + 1.85, 1.4, 0.12);
          playMusicBoxNote(N.G4, t0 + 1.9, 0.6, 0.22);
          playMusicBoxNote(N.D5, t0 + 2.35, 0.65, 0.23);
          playMusicBoxNote(N.G5, t0 + 2.75, 0.6, 0.24);

          // Fase 3 (3.0s - 7.4s): Espiral da árvore subindo ("We Wish You a Merry Christmas")
          const phase3Notes = [
            { t: 3.05, f: N.D5, d: 0.35, bell: true },
            { t: 3.40, f: N.G5, d: 0.35 },
            { t: 3.75, f: N.G5, d: 0.20 },
            { t: 3.95, f: N.A5, d: 0.20 },
            { t: 4.15, f: N.G5, d: 0.20 },
            { t: 4.35, f: N.Fs5, d: 0.20 },
            { t: 4.55, f: N.E5, d: 0.38, bell: true },
            { t: 4.93, f: N.E5, d: 0.38 },
            { t: 5.31, f: N.E5, d: 0.35 },
            { t: 5.66, f: N.A5, d: 0.35, bell: true },
            { t: 6.01, f: N.A5, d: 0.20 },
            { t: N.B5 ? 6.21 : 6.21, f: N.B5, d: 0.20 },
            { t: 6.41, f: N.A5, d: 0.20 },
            { t: 6.61, f: N.G5, d: 0.20 },
            { t: 6.81, f: N.Fs5, d: 0.45, bell: true },
          ];
          playWarmPad([N.G3, N.B3, N.D4], t0 + 3.05, 1.5, 0.11);
          playWarmPad([N.C3, N.E3, N.G3], t0 + 4.55, 1.1, 0.11);
          playWarmPad([N.D3, N.A3, N.D4], t0 + 5.66, 1.5, 0.11);
          phase3Notes.forEach((n) => {
            playMusicBoxNote(n.f, t0 + n.t, Math.max(0.42, n.d * 1.3), 0.26);
            if (n.bell) playSleighBell(t0 + n.t, 0.08);
          });

          // Fase 4 (7.2s - 10.5s): Fita dourada e bolas (Jingle Bells cintilante + sininhos nos enfeites)
          const phase4Notes = [
            { t: 7.25, f: N.E5, d: 0.28, bell: true },
            { t: 7.53, f: N.E5, d: 0.28 },
            { t: 7.81, f: N.E5, d: 0.54, bell: true },
            { t: 8.35, f: N.E5, d: 0.28 },
            { t: 8.63, f: N.E5, d: 0.28 },
            { t: 8.91, f: N.E5, d: 0.54, bell: true },
            { t: 9.45, f: N.E5, d: 0.26 },
            { t: 9.71, f: N.G5, d: 0.26 },
            { t: 9.97, f: N.C5, d: 0.34, bell: true },
            { t: 10.28, f: N.D5, d: 0.22 },
          ];
          playWarmPad([N.C3, N.E3, N.G3, N.C4], t0 + 7.25, 3.1, 0.11);
          phase4Notes.forEach((n) => {
            playMusicBoxNote(n.f, t0 + n.t, Math.max(0.4, n.d * 1.35), 0.26);
            if (n.bell) playSleighBell(t0 + n.t, 0.075);
          });
          // Brilhos aleatórios dos enfeites surgindo
          [N.C6, N.G5, N.E6, N.D6, N.G6].forEach((f, idx) => {
            playMusicBoxNote(f, t0 + 8.6 + idx * 0.36, 0.45, 0.13);
          });

          // Fase 5 (10.5s - 11.8s): Estrela 3D no topo + feixe de luz triunfante
          playWarmPad([N.G3, N.B3, N.D4, N.G4], t0 + 10.5, 1.5, 0.14);
          [N.G5, N.B5, N.D6, N.G6].forEach((f, idx) => {
            playMusicBoxNote(f, t0 + 10.5 + idx * 0.11, 1.15, 0.28);
          });
          playSleighBell(t0 + 10.55, 0.10);
          playSleighBell(t0 + 11.0, 0.08);

          // Fase 6 (11.6s - 13.8s): Presentes 3D quicando embaixo da árvore
          [
            { t: 11.65, f: N.C5 },
            { t: 12.02, f: N.E5 },
            { t: 12.38, f: N.G5 },
            { t: 12.74, f: N.A5 },
            { t: 13.10, f: N.B5 },
          ].forEach((g) => {
            playMusicBoxNote(g.f, t0 + g.t, 0.48, 0.24);
            playSleighBell(t0 + g.t, 0.065);
          });

          // Fase 7 (13.6s+): Acorde final "FELIZ NATAL 2026" e transição para loop natalino
          playWarmPad([N.C3, N.E3, N.G3, N.C4, N.E4], t0 + 13.55, 2.2, 0.14);
          playMusicBoxNote(N.C6, t0 + 13.6, 1.8, 0.30);
          playMusicBoxNote(N.E6, t0 + 13.72, 1.6, 0.20);
          playSleighBell(t0 + 13.6, 0.09);

          const loopStartDelay = setTimeout(() => {
            if (currentMode === '3d' && audioEnabled) {
              start3DMusicLoop();
            }
          }, 15600);
          formationTimers.push(loopStartDelay);
        }

        function stopAllMusic() {
          stopLoop();
          clearFormationTimers();
          if (starAudioCtx && masterGain) {
            setMasterLevel(0.0001, 0.25);
          }
        }

        function syncAudioButtonUI() {
          const btn = document.getElementById('btn-natal-audio');
          const iconOn = document.getElementById('natal-audio-icon-on');
          const iconOff = document.getElementById('natal-audio-icon-off');
          const lbl = document.getElementById('natal-audio-label');
          if (btn) {
            btn.setAttribute('aria-pressed', String(audioEnabled));
            btn.classList.toggle('is-active', audioEnabled);
          }
          if (iconOn) iconOn.style.display = audioEnabled ? 'inline-flex' : 'none';
          if (iconOff) iconOff.style.display = audioEnabled ? 'none' : 'inline-flex';
          if (lbl) lbl.textContent = audioEnabled ? 'Som' : 'Mudo';
        }

        function setAudioEnabled(next) {
          audioEnabled = Boolean(next);
          syncAudioButtonUI();
          if (!audioEnabled) {
            stopAllMusic();
            return;
          }
          gestureUnlocked = true;
          ensureCtx();
          if (currentMode === '3d') {
            start3DMusicLoop();
          } else {
            start2DMusic();
          }
        }

        function unlockOnFirstGesture() {
          if (gestureUnlocked) return;
          gestureUnlocked = true;
          if (!audioEnabled) return;
          ensureCtx();
          if (currentMode === '3d') {
            play3DFormationMusic();
          } else {
            start2DMusic();
          }
        }

        function handleVisibilityChange() {
          if (document.hidden) {
            stopAllMusic();
          } else if (gestureUnlocked && audioEnabled) {
            if (currentMode === '3d') {
              start3DMusicLoop();
            } else {
              start2DMusic();
            }
          }
        }

        return {
          isEnabled: () => audioEnabled,
          setAudioEnabled,
          start2DMusic,
          play3DFormationMusic,
          stopAllMusic,
          unlockOnFirstGesture,
          handleVisibilityChange,
          syncAudioButtonUI
        };
      })();

      // =========================================================================
      // ÁUDIO, PARTÍCULAS E TRANSIÇÃO CINEMATOGRÁFICA DA ESTRELA
      // =========================================================================
      function playStarTapChime(step) {
        try {
          if (!NatalAudio.isEnabled()) return;
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return;
          if (!starAudioCtx) starAudioCtx = new AudioCtx();
          if (starAudioCtx.state === 'suspended') starAudioCtx.resume();

          const notes = [523.25, 587.33, 659.25, 783.99, 1046.5];
          const freq = notes[Math.min(notes.length - 1, Math.max(0, step - 1))];
          const now = starAudioCtx.currentTime;
          const osc = starAudioCtx.createOscillator();
          const gain = starAudioCtx.createGain();
          osc.type = step >= 5 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, now);
          if (step >= 5) {
            osc.frequency.exponentialRampToValueAtTime(freq * 1.5, now + 0.28);
          }
          gain.gain.setValueAtTime(0.001, now);
          gain.gain.exponentialRampToValueAtTime(step >= 5 ? 0.14 : 0.08, now + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + (step >= 5 ? 0.45 : 0.22));
          osc.connect(gain);
          gain.connect(starAudioCtx.destination);
          osc.start(now);
          osc.stop(now + (step >= 5 ? 0.48 : 0.25));
        } catch (e) { }
      }

      function showStarFeedback(text) {
        if (!starTapFeedback) return;
        starTapFeedback.textContent = text;
        starTapFeedback.classList.add('is-shown');
        clearTimeout(starFeedbackTimer);
        starFeedbackTimer = setTimeout(() => {
          starTapFeedback.classList.remove('is-shown');
        }, 1600);
      }

      function emitStarBurst(step) {
        const count = 16 + step * 5;
        const burstChars = ['✦', '★', '*', '+', '·'];
        const burstColors = ['#fef9c3', '#facc15', '#fde047'];
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 5 + Math.random() * (12 + step * 2.5);
          starBurstParticles.push({
            x: starHitBox.col + (Math.random() - 0.5) * 1.2,
            y: starHitBox.row + (Math.random() - 0.5) * 0.8,
            vx: Math.cos(angle) * speed * 1.4,
            vy: Math.sin(angle) * speed * 0.75 - 2,
            age: 0,
            maxAge: 0.45 + Math.random() * 0.45,
            char: burstChars[Math.floor(Math.random() * burstChars.length)],
            color: burstColors[Math.floor(Math.random() * burstColors.length)]
          });
        }
        starBoostTimer = 0.5;
      }

      function activate3DMode() {
        if (currentMode === '3d' || isTransitioning) return;
        isTransitioning = true;
        currentMode = '3d';
        document.body.style.cursor = '';

        flashOverlay.style.setProperty('--flash-x', `${starHitBox.x || width * 0.5}px`);
        flashOverlay.style.setProperty('--flash-y', `${starHitBox.y || height * 0.35}px`);
        flashOverlay.classList.add('is-flashing');

        // Inicia o motor 3D e dispara crossfade suave de 700ms + efeito musical natalino
        tree3dEngine.start();
        NatalAudio.play3DFormationMusic();
        canvas.classList.add('is-hidden-mode');
        canvas3d.classList.add('is-visible');

        if (badgeTextEl) badgeTextEl.textContent = 'Árvore 3D ASCII • Feliz Natal 2026';
        if (windHintEl) {
          windHintEl.textContent = '• Arraste para girar';
          windHintEl.classList.remove('is-hidden');
        }
        controls2dEl.classList.add('hidden');
        controls2dEl.classList.remove('inline-flex');
        controls3dEl.classList.remove('hidden');
        controls3dEl.classList.add('inline-flex');

        clearTimeout(transitionTimer);
        setTimeout(() => flashOverlay.classList.remove('is-flashing'), 260);
        transitionTimer = setTimeout(() => {
          if (rafId) {
            cancelAnimationFrame(rafId);
            rafId = null;
          }
          isTransitioning = false;
        }, 700);
      }

      function activate2DMode() {
        if (currentMode === '2d' || isTransitioning) return;
        isTransitioning = true;
        currentMode = '2d';
        starTapCount = 0;

        canvas3d.classList.remove('is-visible');
        canvas.classList.remove('is-hidden-mode');

        if (badgeTextEl) badgeTextEl.textContent = 'Noite Natalina • Arte ASCII';
        if (windHintEl) {
          windHintEl.textContent = '• Há algo suspeito com a estrela...';
          windHintEl.classList.remove('is-hidden');
        }
        NatalAudio.start2DMusic();
        controls3dEl.classList.add('hidden');
        controls3dEl.classList.remove('inline-flex');
        controls2dEl.classList.remove('hidden');
        controls2dEl.classList.add('inline-flex');

        if (!isPaused) {
          lastTimestamp = 0;
          if (!rafId) rafId = requestAnimationFrame(animate);
        } else {
          drawSceneFrame(sceneTime, 0);
        }

        clearTimeout(transitionTimer);
        transitionTimer = setTimeout(() => {
          tree3dEngine.stop();
          isTransitioning = false;
        }, 700);
      }

      function isInsideStarHitBox(clientX, clientY) {
        return Math.hypot(clientX - starHitBox.x, clientY - starHitBox.y) <= starHitBox.radius;
      }

      function handlePointerMove(clientX, clientY) {
        if (width <= 0) return;
        if (currentMode === '2d' && clientY !== undefined) {
          document.body.style.cursor = isInsideStarHitBox(clientX, clientY) ? 'pointer' : '';
        }
        mouseNormalizedX = (clientX / width) * 2 - 1;
        targetWind = mouseNormalizedX * 1.35;
        if (!hasInteracted && currentMode === '2d') {
          hasInteracted = true;
        }
      }

      const PLAY_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 4 20 12 6 20 6 4"/></svg>';
      const PAUSE_SVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>';

      function setPaused(paused) {
        isPaused = paused;
        const btnPlay = document.getElementById('btn-natal-play');
        const iconPlay = document.getElementById('natal-play-icon');
        const labelPlay = document.getElementById('natal-play-label');
        if (btnPlay) {
          btnPlay.setAttribute('aria-pressed', String(paused));
          btnPlay.classList.toggle('is-active', paused);
        }
        if (iconPlay) iconPlay.innerHTML = paused ? PLAY_SVG : PAUSE_SVG;
        if (labelPlay) labelPlay.textContent = paused ? 'Retomar' : 'Pausar';

        if (!paused && currentMode === '2d') {
          lastTimestamp = 0;
          if (!rafId) rafId = requestAnimationFrame(animate);
        }
      }

      function bindControls() {
        const btnPlay = document.getElementById('btn-natal-play');
        const btnSleigh = document.getElementById('btn-natal-sleigh');
        const btnSnow = document.getElementById('btn-natal-snow');
        const btnBack2d = document.getElementById('btn-natal-back-2d');
        const btnReplay3d = document.getElementById('btn-natal-replay-3d');
        const btnAudio = document.getElementById('btn-natal-audio');

        if (btnPlay) {
          btnPlay.addEventListener('click', () => setPaused(!isPaused));
        }

        if (btnSleigh) {
          btnSleigh.addEventListener('click', () => {
            if (!santaState.active) {
              santaState.cooldown = 0;
              santaState.active = true;
              santaState.x = -48;
              santaState.y = Math.max(3, Math.min(8, Math.floor(rows * 0.16)));
              santaState.speed = Math.max(14, cols * 0.16);
            }
            if (isPaused) setPaused(false);
          });
        }

        if (btnSnow) {
          btnSnow.addEventListener('click', () => {
            isBlizzard = !isBlizzard;
            btnSnow.setAttribute('aria-pressed', String(isBlizzard));
            btnSnow.classList.toggle('is-active', isBlizzard);
            const lbl = document.getElementById('natal-snow-label');
            if (lbl) lbl.textContent = isBlizzard ? 'Brisa Suave' : 'Nevasca';
            if (isBlizzard && Math.abs(targetWind) < 0.4) {
              targetWind = 0.85;
            }
          });
        }

        if (btnBack2d) {
          btnBack2d.addEventListener('click', activate2DMode);
        }

        if (btnReplay3d) {
          btnReplay3d.addEventListener('click', () => {
            tree3dEngine.replay();
            NatalAudio.play3DFormationMusic();
          });
        }

        if (btnAudio) {
          NatalAudio.syncAudioButtonUI();
          btnAudio.addEventListener('click', () => {
            NatalAudio.setAudioEnabled(!NatalAudio.isEnabled());
          });
        }

        // Easter Egg secreto na estrela da árvore 2D
        window.addEventListener('pointerdown', (e) => {
          NatalAudio.unlockOnFirstGesture();
          if (currentMode !== '2d' || isTransitioning) return;
          if (e.button !== undefined && e.button !== 0 && e.pointerType === 'mouse') return;
          if (e.target && e.target.closest && e.target.closest('.natal-controls, biotec-ecosystem-nav, button, a')) {
            return;
          }
          if (!isInsideStarHitBox(e.clientX, e.clientY)) return;

          const now = performance.now();
          if (now - lastStarTapTime > STAR_TAP_WINDOW_MS) {
            starTapCount = 0;
          }
          starTapCount += 1;
          lastStarTapTime = now;

          emitStarBurst(starTapCount);
          playStarTapChime(starTapCount);

          if (starTapCount >= 5) {
            starTapCount = 0;
            showStarFeedback('★ A ESTRELA DESPERTOU • FELIZ NATAL 2026');
            activate3DMode();
          } else {
            showStarFeedback('✦ '.repeat(starTapCount).trim());
            if (isPaused) {
              drawSceneFrame(sceneTime, 0.016);
            }
          }
        });

        window.addEventListener('keydown', (e) => {
          NatalAudio.unlockOnFirstGesture();
          if (e.code === 'Space' && !e.altKey && !e.ctrlKey && !e.metaKey && currentMode === '2d') {
            const tag = (e.target && e.target.tagName) || '';
            if (tag !== 'BUTTON' && tag !== 'INPUT' && tag !== 'TEXTAREA' && tag !== 'A') {
              e.preventDefault();
              setPaused(!isPaused);
            }
          } else if ((e.key === 'm' || e.key === 'M') && !e.altKey && !e.ctrlKey && !e.metaKey) {
            const tag = (e.target && e.target.tagName) || '';
            if (tag !== 'INPUT' && tag !== 'TEXTAREA') {
              NatalAudio.setAudioEnabled(!NatalAudio.isEnabled());
            }
          } else if (e.key === 'Escape' && currentMode === '3d') {
            activate2DMode();
          }
        });

        document.addEventListener('visibilitychange', NatalAudio.handleVisibilityChange);
      }

      window.addEventListener('mousemove', (e) => {
        handlePointerMove(e.clientX, e.clientY);
      }, { passive: true });

      window.addEventListener('touchstart', (e) => {
        if (e.touches && e.touches.length > 0) {
          handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches && e.touches.length > 0) {
          handlePointerMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('mouseleave', () => {
        targetWind = 0.15;
        document.body.style.cursor = '';
      }, { passive: true });

      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('orientationchange', () => setTimeout(resize, 120), { passive: true });

      function start() {
        bindControls();
        resize();
        drawSceneFrame(0, 0);

        const params = new URLSearchParams(window.location.search || '');
        if (params.get('mode') === '3d') {
          activate3DMode();
          return;
        }

        if (prefersReducedMotion) {
          setPaused(true);
        } else {
          rafId = requestAnimationFrame(animate);
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', start);
      } else {
        start();
      }
    })();
  </script>
  <script src="./ecosystem-nav.js" defer data-page="natal.html" data-theme="dark" data-idle-dim="true"></script>
