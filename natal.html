<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#060b14" />
  <title>Noite Natalina &amp; Árvore 3D em Arte ASCII — Ecossistema Interativo</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23060b14'/><polygon points='16,4 19.5,12 28,12.8 21.5,18.4 23.5,27 16,22.3 8.5,27 10.5,18.4 4,12.8 12.5,12' fill='%23facc15'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      color-scheme: dark;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    ::selection {
      background: #facc15;
      color: #060b14;
    }

    :focus-visible {
      outline: 2px solid #38bdf8;
      outline-offset: 2px;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      font-family: 'JetBrains Mono', 'Courier New', ui-monospace, monospace;
      user-select: none;
      -webkit-user-select: none;
    }

    html {
      background-color: #060b14;
    }

    body {
      background-color: transparent;
    }

    /* Canvas 2D da Vila Natalina */
    #ascii-christmas-bg {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 0;
      pointer-events: none;
      display: block;
      background-color: #060b14;
      opacity: 1;
      transform: scale(1);
      visibility: visible;
      transition: opacity 700ms var(--ease-out), transform 700ms var(--ease-out), visibility 0s;
    }

    #ascii-christmas-bg.is-hidden-mode {
      opacity: 0;
      transform: scale(1.03);
      visibility: hidden;
      transition: opacity 700ms var(--ease-out), transform 700ms var(--ease-out), visibility 0s linear 700ms;
    }

    /* Canvas 3D da Árvore Volumétrica 2026 (Easter Egg de 5 toques na estrela) */
    #ascii-tree-3d {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 2;
      display: block;
      background-color: #04070d;
      cursor: grab;
      touch-action: none;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: scale(0.96);
      transition: opacity 700ms var(--ease-out), transform 700ms var(--ease-out), visibility 0s linear 700ms;
    }

    #ascii-tree-3d:active {
      cursor: grabbing;
    }

    #ascii-tree-3d.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: scale(1);
      transition: opacity 700ms var(--ease-out), transform 700ms var(--ease-out), visibility 0s;
    }

    /* Clarão estelar dourado na transição 2D -> 3D */
    #star-transition-flash {
      position: fixed;
      inset: 0;
      z-index: 15;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(
        circle at var(--flash-x, 50%) var(--flash-y, 35%),
        rgba(254, 249, 195, 0.94),
        rgba(250, 204, 21, 0.42) 34%,
        transparent 72%
      );
      transition: opacity 700ms var(--ease-out);
    }

    #star-transition-flash.is-flashing {
      opacity: 1;
    }

    .natal-vignette {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      background: radial-gradient(circle at 50% 45%, transparent 58%, rgba(2, 6, 15, 0.52) 100%);
    }

    .natal-badge {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      left: calc(14px + env(safe-area-inset-left, 0px));
      z-index: 10;
      pointer-events: none;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(6, 11, 20, 0.66);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.28);
      color: #e2e8f0;
      font-size: 11px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      max-width: calc(100vw - 28px);
    }

    .natal-hint {
      color: #94a3b8;
      transition: opacity 0.45s var(--ease-out);
    }

    .natal-hint.is-hidden {
      display: none;
    }

    #star-tap-feedback {
      position: fixed;
      top: calc(14px + env(safe-area-inset-top, 0px));
      left: 50%;
      transform: translateX(-50%) translateY(-6px);
      z-index: 25;
      pointer-events: none;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(6, 11, 20, 0.84);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(250, 204, 21, 0.65);
      color: #fef08a;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55), 0 0 18px rgba(250, 204, 21, 0.22);
      opacity: 0;
      transition: opacity 0.22s var(--ease-out), transform 0.22s var(--ease-out);
      white-space: nowrap;
    }

    #star-tap-feedback.is-shown {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Barra de controles à esquerda (sem colisão com o .eco-dock fixo no canto inferior direito) */
    .natal-controls {
      position: fixed;
      bottom: calc(16px + env(safe-area-inset-bottom, 0px));
      left: calc(16px + env(safe-area-inset-left, 0px));
      z-index: 20;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      max-width: calc(100vw - 304px);
      border-radius: 999px;
      background: rgba(6, 11, 20, 0.78);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(56, 189, 248, 0.30);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.52), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      opacity: 0.84;
      transition: opacity 0.22s var(--ease-out), border-color 0.22s var(--ease-out);
    }

    .natal-controls:hover,
    .natal-controls:focus-within {
      opacity: 1;
      border-color: rgba(250, 204, 21, 0.58);
    }

    .natal-btn {
      appearance: none;
      border: 1px solid transparent;
      background: transparent;
      color: #e2e8f0;
      font-family: inherit;
      font-size: 11.5px;
      font-weight: 600;
      min-height: 38px;
      padding: 7px 11px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color 0.16s var(--ease-out), color 0.16s var(--ease-out), border-color 0.16s var(--ease-out), transform 0.12s var(--ease-out);
    }

    .natal-btn:active {
      transform: scale(0.97);
    }

    @media (hover: hover) and (pointer: fine) {
      .natal-btn:hover {
        background: rgba(56, 189, 248, 0.14);
        color: #ffffff;
      }
    }

    .natal-btn.is-active {
      background: rgba(250, 204, 21, 0.18);
      border-color: rgba(250, 204, 21, 0.52);
      color: #fde047;
    }

    .natal-btn.is-sky {
      background: rgba(56, 189, 248, 0.14);
      border-color: rgba(56, 189, 248, 0.36);
      color: #bae6fd;
    }

    .natal-btn.is-gold {
      background: rgba(250, 204, 21, 0.14);
      border-color: rgba(250, 204, 21, 0.42);
      color: #fde047;
    }

    @media (max-width: 640px) {
      .natal-badge {
        top: calc(10px + env(safe-area-inset-top, 0px));
        left: calc(10px + env(safe-area-inset-left, 0px));
        font-size: 10px;
        padding: 6px 10px;
        flex-wrap: wrap;
        gap: 4px 6px;
      }

      .natal-hint {
        font-size: 9.5px;
      }

      #star-tap-feedback {
        top: calc(48px + env(safe-area-inset-top, 0px));
        font-size: 10px;
      }

      .natal-controls {
        bottom: calc(78px + env(safe-area-inset-bottom, 0px));
        left: 50%;
        transform: translateX(-50%);
        width: max-content;
        max-width: calc(100vw - 24px);
      }

      .natal-btn {
        min-height: 44px;
        padding: 0 10px;
      }
    }

    @media (max-width: 480px) {
      .natal-btn-label {
        display: none;
      }
    }

    @media (max-width: 780px) {
      .natal-btn-short {
        display: inline;
      }

      .natal-btn-full {
        display: none;
      }
    }

    @media (min-width: 781px) {
      .natal-btn-short {
        display: none;
      }

      .natal-btn-full {
        display: inline;
      }
    }

    @media (pointer: coarse) {
      .natal-btn {
        min-height: 44px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body class="bg-transparent m-0 p-0 overflow-hidden select-none">
  <!-- Canvas 2D da Vila Natalina -->
  <canvas
    id="ascii-christmas-bg"
    class="fixed inset-0 w-screen h-screen pointer-events-none block bg-[#060b14]"
    aria-hidden="true"
  ></canvas>

  <!-- Canvas 3D Volumétrico (Ativado após 5 toques consecutivos na estrela) -->
  <canvas id="ascii-tree-3d" aria-label="Árvore de Natal 3D Volumétrica em Arte ASCII"></canvas>

  <!-- Clarão Estelar da Transição Cinematográfica -->
  <div id="star-transition-flash" aria-hidden="true"></div>
  <div class="natal-vignette" aria-hidden="true"></div>

  <aside class="natal-badge" aria-label="Cena natalina interativa">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="#facc15" aria-hidden="true">
      <polygon points="12 2 15.1 8.8 22.5 9.5 16.9 14.4 18.6 21.7 12 17.8 5.4 21.7 7.1 14.4 1.5 9.5 8.9 8.8" />
    </svg>
    <span id="natal-badge-text">Noite Natalina • Arte ASCII</span>
    <span id="natal-wind-hint" class="natal-hint">• Há algo suspeito com a estrela...</span>
  </aside>

  <div id="star-tap-feedback" role="status" aria-live="polite"></div>

  <div class="natal-controls" role="region" aria-label="Controles da cena natalina">
    <!-- Controles do Modo 2D -->
    <div id="natal-controls-2d" class="inline-flex flex-wrap justify-center items-center gap-1">
      <button type="button" id="btn-natal-play" class="natal-btn" aria-pressed="false" title="Pausar ou retomar animação (Espaço)">
        <span id="natal-play-icon" style="display:inline-flex;align-items:center;" aria-hidden="true">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="6" y="4" width="4" height="16" />
            <rect x="14" y="4" width="4" height="16" />
          </svg>
        </span>
        <span id="natal-play-label" class="natal-btn-label">Pausar</span>
      </button>

      <button type="button" id="btn-natal-sleigh" class="natal-btn" title="Chamar trenó no céu noturno">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polygon points="12 2 15.1 8.8 22.5 9.5 16.9 14.4 18.6 21.7 12 17.8 5.4 21.7 7.1 14.4 1.5 9.5 8.9 8.8" />
        </svg>
        <span class="natal-btn-label">Trenó</span>
      </button>

      <button type="button" id="btn-natal-snow" class="natal-btn" aria-pressed="false" title="Alternar entre brisa suave e nevasca">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 2v20M2 12h20M4.9 4.9l14.2 14.2M19.1 4.9 4.9 19.1" />
        </svg>
        <span id="natal-snow-label" class="natal-btn-label">Nevasca</span>
      </button>
    </div>

    <!-- Controles do Modo 3D (Visíveis após o Easter Egg de 5 toques na estrela) -->
    <div id="natal-controls-3d" class="hidden flex-wrap justify-center items-center gap-1.5">
      <button type="button" id="btn-natal-back-2d" class="natal-btn is-sky" title="Voltar à Vila Natalina 2D (Esc)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19 12H5" /><path d="m12 19-7-7 7-7" />
        </svg>
        <span class="natal-btn-full">Voltar à Cena Inicial</span>
        <span class="natal-btn-short">Cena 2D</span>
      </button>

      <button type="button" id="btn-natal-replay-3d" class="natal-btn is-gold" title="Reiniciar as 7 fases da Árvore 3D">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
          <path d="M3 3v5h5" />
        </svg>
        <span class="natal-btn-full">Repetir Animação 3D</span>
        <span class="natal-btn-short">Repetir 3D</span>
      </button>
    </div>

    <button type="button" id="btn-natal-audio" class="natal-btn is-active" aria-pressed="true" title="Ativar ou silenciar música natalina (M)">
      <span id="natal-audio-icon-on" style="display:inline-flex;align-items:center;" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
        </svg>
      </span>
      <span id="natal-audio-icon-off" style="display:none;align-items:center;" aria-hidden="true">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
          <line x1="23" y1="9" x2="17" y2="15" />
          <line x1="17" y1="9" x2="23" y2="15" />
        </svg>
      </span>
      <span id="natal-audio-label" class="natal-btn-label">Som</span>
    </button>
  </div>

  <script>
    (function () {
      'use strict';

      const canvas = document.getElementById('ascii-christmas-bg');
      const ctx = canvas.getContext('2d', { alpha: false });
      const canvas3d = document.getElementById('ascii-tree-3d');
      const flashOverlay = document.getElementById('star-transition-flash');
      const starTapFeedback = document.getElementById('star-tap-feedback');
      const badgeTextEl = document.getElementById('natal-badge-text');
      const windHintEl = document.getElementById('natal-wind-hint');
      const controls2dEl = document.getElementById('natal-controls-2d');
      const controls3dEl = document.getElementById('natal-controls-3d');

      // Paleta de cores natalinas e noturnas
      const PALETTE = {
        bg: '#060b14',
        moon: '#fef08a',
        moonGlow: '#fde047',
        starBright: '#f8fafc',
        starBlue: '#bae6fd',
        starGold: '#fef08a',
        starDim: '#64748b',
        snowBright: '#f8fafc',
        snowMid: '#cbd5e1',
        snowShadow: '#94a3b8',
        snowIce: '#bae6fd',
        treeDark: '#15803d',
        treeMid: '#16a34a',
        treeLight: '#22c55e',
        treeTip: '#4ade80',
        trunk: '#92400e',
        trunkHighlight: '#b45309',
        starTopper: '#facc15',
        starTopperCore: '#fef9c3',
        garland: '#fde047',
        ornaments: [
          '#ef4444',
          '#facc15',
          '#22d3ee',
          '#f472b6'
        ],
        cabinWood: '#b45309',
        cabinWoodDark: '#78350f',
        cabinRoofSnow: '#e2e8f0',
        cabinWindow: '#fbbf24',
        cabinWindowBright: '#fef08a',
        cabinChimney: '#94a3b8',
        smoke: ['#cbd5e1', '#94a3b8', '#64748b', '#475569'],
        santaRed: '#ef4444',
        santaTrim: '#f8fafc',
        sleighGold: '#facc15',
        reindeerBrown: '#d97706',
        rudolphNose: '#ff2e2e'
      };

      // Estado global da experiência integrada (2D <-> 3D)
      let currentMode = '2d'; // '2d' | '3d'
      let isTransitioning = false;
      let transitionTimer = null;

      // Estado da grade ASCII 2D e dimensões da viewport
      let width = 0;
      let height = 0;
      let dpr = 1;
      let fontSize = 14;
      let charW = 8.4;
      let charH = 15;
      let cols = 0;
      let rows = 0;

      let charGrid = [];
      let colorGrid = [];
      let glowGrid = [];

      // Estado interativo do vento e ambiente controlado pelo usuário
      let mouseNormalizedX = 0;
      let currentWind = 0.15;
      let targetWind = 0.15;
      let skyGradient = null;
      let moonGlowGradient = null;
      let isPaused = false;
      let isBlizzard = false;
      let hasInteracted = false;
      const prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let rafId = null;
      let sceneTime = 0;

      // Coleções dinâmicas da cena 2D
      let stars = [];
      let snowflakes = [];
      let smokeParticles = [];
      let trailParticles = [];
      let starBurstParticles = [];
      let groundHeights = [];

      // Estado do Easter Egg de 5 toques na estrela da árvore
      const STAR_TAP_WINDOW_MS = 1800;
      let starTapCount = 0;
      let lastStarTapTime = 0;
      let starBoostTimer = 0;
      let starFeedbackTimer = null;
      let starAudioCtx = null;
      const starHitBox = { x: 0, y: 0, radius: 34, col: 0, row: 0 };

      // Estado do trenó do Papai Noel
      const santaState = {
        active: false,
        x: -60,
        y: 6,
        speed: 14,
        cooldown: 2.2
      };

      function seededHash(x, y) {
        const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123;
        return n - Math.floor(n);
      }

      function setCell(c, r, ch, color, glow = false) {
        const col = Math.round(c);
        const row = Math.round(r);
        if (col < 0 || col >= cols || row < 0 || row >= rows) return;
        const idx = row * cols + col;
        charGrid[idx] = ch;
        colorGrid[idx] = color;
        glowGrid[idx] = glow;
      }

      function drawText(startCol, row, text, color, glow = false, skipSpaces = true) {
        for (let i = 0; i < text.length; i++) {
          const ch = text[i];
          if (skipSpaces && ch === ' ') continue;
          setCell(startCol + i, row, ch, color, glow);
        }
      }

      function clearGrid() {
        const total = cols * rows;
        for (let i = 0; i < total; i++) {
          charGrid[i] = ' ';
          colorGrid[i] = PALETTE.bg;
          glowGrid[i] = false;
        }
      }

      function updateStarHitMetrics() {
        const centerX = Math.floor(cols / 2);
        const groundY = rows - (groundHeights[centerX] || 3);
        const treeHeight = Math.max(14, Math.min(28, Math.floor(rows * 0.56)));
        const treeTopY = groundY - treeHeight;
        const starY = treeTopY - 2;
        starHitBox.col = centerX;
        starHitBox.row = starY;
        starHitBox.x = (centerX + 0.5) * charW;
        starHitBox.y = (starY + 0.5) * charH;
        // Raio mínimo de 32px -> caixa >= 64x64px (acima dos 56x56px mínimos)
        starHitBox.radius = Math.max(32, Math.ceil(charW * 4));
      }

      function resize() {
        try {
          width = window.innerWidth;
          height = window.innerHeight;
          dpr = Math.min(window.devicePixelRatio || 1, 2);

          if (width < 390) {
            fontSize = 10;
          } else if (width < 480) {
            fontSize = 11;
          } else if (width < 900) {
            fontSize = 13;
          } else {
            fontSize = 14;
          }

          canvas.width = Math.floor(width * dpr);
          canvas.height = Math.floor(height * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          ctx.font = `600 ${fontSize}px "JetBrains Mono", "Courier New", Courier, monospace`;
          const metrics = ctx.measureText('M');
          charW = Math.max(metrics.width, fontSize * 0.6);
          charH = Math.ceil(fontSize * 1.12);

          cols = Math.max(20, Math.ceil(width / charW));
          rows = Math.max(15, Math.ceil(height / charH));

          skyGradient = ctx.createLinearGradient(0, 0, 0, Math.max(1, height));
          skyGradient.addColorStop(0, '#030711');
          skyGradient.addColorStop(0.58, '#071224');
          skyGradient.addColorStop(1, '#0d1c33');

          const moonCol = cols < 50 ? 7 : 10;
          const moonPxX = moonCol * charW;
          const moonPxY = 5 * charH;
          const haloRadius = Math.max(110, Math.min(width, height) * 0.28);
          moonGlowGradient = ctx.createRadialGradient(moonPxX, moonPxY, 4, moonPxX, moonPxY, haloRadius);
          moonGlowGradient.addColorStop(0, 'rgba(254, 240, 138, 0.12)');
          moonGlowGradient.addColorStop(0.45, 'rgba(186, 230, 253, 0.04)');
          moonGlowGradient.addColorStop(1, 'rgba(6, 11, 20, 0)');

          const total = cols * rows;
          charGrid = new Array(total).fill(' ');
          colorGrid = new Array(total).fill(PALETTE.bg);
          glowGrid = new Array(total).fill(false);

          initSceneEntities();
          updateStarHitMetrics();
          if (isPaused && currentMode === '2d') {
            drawSceneFrame(sceneTime, 0);
          }
        } catch (err) {
          console.error('Erro ao redimensionar grade ASCII:', err);
        }
        if (tree3dEngine && currentMode === '3d') {
          tree3dEngine.resize();
        }
      }

      function initSceneEntities() {
        groundHeights = new Array(cols);
        const baseSnowDepth = Math.max(2, Math.min(4, Math.floor(rows * 0.06)));
        for (let c = 0; c < cols; c++) {
          const wave = Math.sin(c * 0.07) * 0.9 + Math.cos(c * 0.03 + 1.2) * 0.7;
          groundHeights[c] = Math.max(2, Math.round(baseSnowDepth + wave));
        }

        const skyRows = Math.floor(rows * 0.72);
        const starCount = Math.floor((cols * skyRows) * 0.022);
        const starChars = ['.', '+', '*', '.', '✦'];
        const starColors = [PALETTE.starBright, PALETTE.starBlue, PALETTE.starGold, PALETTE.starDim];

        stars = [];
        for (let i = 0; i < starCount; i++) {
          stars.push({
            c: Math.floor(Math.random() * cols),
            r: Math.floor(Math.random() * skyRows),
            char: starChars[Math.floor(Math.random() * starChars.length)],
            color: starColors[Math.floor(Math.random() * starColors.length)],
            phase: Math.random() * Math.PI * 2,
            speed: 1.2 + Math.random() * 2.8
          });
        }

        const flakeCount = Math.min(260, Math.max(45, Math.floor((cols * rows) * 0.018)));
        const layers = [
          { chars: ['·', '.'], speedMin: 2.2, speedMax: 4.0, swayAmp: 0.8, windFactor: 0.45, color: PALETTE.snowShadow },
          { chars: ['+', '•'], speedMin: 4.2, speedMax: 6.8, swayAmp: 1.5, windFactor: 0.85, color: PALETTE.snowMid },
          { chars: ['*', '❄'], speedMin: 6.5, speedMax: 9.8, swayAmp: 2.3, windFactor: 1.35, color: PALETTE.snowBright }
        ];

        snowflakes = [];
        for (let i = 0; i < flakeCount; i++) {
          const layerIdx = i % 3;
          const layer = layers[layerIdx];
          snowflakes.push({
            x: Math.random() * cols,
            y: Math.random() * rows,
            char: layer.chars[Math.floor(Math.random() * layer.chars.length)],
            speed: layer.speedMin + Math.random() * (layer.speedMax - layer.speedMin),
            swayAmp: layer.swayAmp * (0.7 + Math.random() * 0.6),
            swayFreq: 0.8 + Math.random() * 1.4,
            phase: Math.random() * Math.PI * 2,
            windFactor: layer.windFactor,
            color: layer.color,
            glow: layerIdx === 2 && Math.random() > 0.65
          });
        }
      }

      function drawSkyAndMoon(time) {
        for (let i = 0; i < stars.length; i++) {
          const s = stars[i];
          const twinkle = Math.sin(time * s.speed + s.phase);
          if (twinkle < -0.55) continue;

          let displayChar = s.char;
          let displayColor = s.color;
          let glow = false;

          if (twinkle > 0.78) {
            displayChar = s.char === '.' ? '+' : '*';
            displayColor = PALETTE.starBright;
            glow = true;
          } else if (twinkle < -0.15) {
            displayChar = '.';
            displayColor = PALETTE.starDim;
          }

          setCell(s.c, s.r, displayChar, displayColor, glow);
        }

        const moonX = cols < 50 ? 3 : 6;
        const moonY = 2;
        const moonArt = [
          "   _.._   ",
          " .' .-'`  ",
          "/  /      ",
          "|  |      ",
          "\\  \\      ",
          " '._'-._  ",
          "    ```   "
        ];

        for (let r = 0; r < moonArt.length; r++) {
          drawText(moonX, moonY + r, moonArt[r], PALETTE.moon, true);
        }
      }

      function drawSnowGround() {
        for (let c = 0; c < cols; c++) {
          const h = groundHeights[c] || 3;
          const topRow = rows - h;

          const topChar = (c % 5 === 0) ? '~' : (c % 3 === 0 ? '.' : '_');
          setCell(c, topRow, topChar, PALETTE.snowBright, false);

          for (let r = topRow + 1; r < rows; r++) {
            const hash = seededHash(c, r);
            const ch = hash > 0.86 ? '*' : (hash > 0.65 ? '·' : (hash > 0.35 ? '~' : ' '));
            const colr = hash > 0.7 ? PALETTE.snowIce : PALETTE.snowMid;
            setCell(c, r, ch, colr, false);
          }
        }
      }

      function drawChristmasTree(time) {
        const centerX = Math.floor(cols / 2);
        const groundY = rows - (groundHeights[centerX] || 3);

        const treeHeight = Math.max(14, Math.min(28, Math.floor(rows * 0.56)));
        const trunkHeight = treeHeight >= 20 ? 3 : 2;
        const foliageHeight = treeHeight - trunkHeight;
        const treeTopY = groundY - treeHeight;

        // 1. Estrela dourada brilhante e animada no topo (alvo do Easter Egg de 5 toques)
        const starPulse = Math.sin(time * 4.5);
        const starY = treeTopY - 2;
        starHitBox.col = centerX;
        starHitBox.row = starY;
        starHitBox.x = (centerX + 0.5) * charW;
        starHitBox.y = (starY + 0.5) * charH;
        starHitBox.radius = Math.max(32, Math.ceil(charW * 4));

        if (starBoostTimer > 0) {
          drawText(centerX - 2, starY - 1, '✦\\|/✦', PALETTE.starTopperCore, true);
          drawText(centerX - 3, starY, '«-★-»', PALETTE.starTopperCore, true);
          drawText(centerX - 2, starY + 1, '✦/|\\✦', PALETTE.starTopper, true);
        } else if (starPulse > 0) {
          drawText(centerX - 1, starY - 1, '\\|/', PALETTE.starTopper, true);
          drawText(centerX - 2, starY, '--★--', PALETTE.starTopperCore, true);
          drawText(centerX - 1, starY + 1, '/|\\', PALETTE.starTopper, true);
        } else {
          drawText(centerX - 1, starY - 1, ' * ', PALETTE.starTopperCore, true);
          drawText(centerX - 2, starY, '-=★=-', PALETTE.starTopper, true);
          drawText(centerX - 1, starY + 1, ' * ', PALETTE.starTopperCore, true);
        }

        // 2. Copa do pinheiro em camadas cônicas sobrepostas
        const numTiers = 4;
        const ornamentChars = ['o', '@', '*', '♦'];
        const foliageChars = ['^', '~', '*', '^', 'v'];
        let maxHalfWidth = 4;

        for (let rowOffset = 0; rowOffset < foliageHeight; rowOffset++) {
          const y = treeTopY + rowOffset;
          const progress = rowOffset / foliageHeight;

          const tierFloat = progress * numTiers;
          const tierIndex = Math.floor(tierFloat);
          const tierProgress = tierFloat - tierIndex;

          const baseWidth = tierIndex * (cols < 55 ? 2.1 : 3.2);
          const tierSpread = tierProgress * (cols < 55 ? 3.8 : 5.6);
          const halfWidth = Math.max(1, Math.round(baseWidth + tierSpread));
          if (halfWidth > maxHalfWidth) maxHalfWidth = halfWidth;

          for (let dx = -halfWidth; dx <= halfWidth; dx++) {
            const x = centerX + dx;
            const hash = seededHash(x, y);

            if (dx === -halfWidth) {
              setCell(x, y, '/', PALETTE.treeTip, false);
              continue;
            }
            if (dx === halfWidth) {
              setCell(x, y, '\\', PALETTE.treeTip, false);
              continue;
            }

            const garlandWave = Math.sin(dx * 0.45 + rowOffset * 0.75);
            if (Math.abs(garlandWave) > 0.93 && rowOffset > 2) {
              const gChar = (dx + rowOffset) % 2 === 0 ? '~' : '•';
              setCell(x, y, gChar, PALETTE.garland, true);
              continue;
            }

            if (hash > 0.83 && rowOffset > 1) {
              const colorIdx = Math.floor(hash * 100) % PALETTE.ornaments.length;
              const ornChar = ornamentChars[Math.floor(hash * 47) % ornamentChars.length];
              const blinkPhase = hash * Math.PI * 6;
              const isLit = Math.sin(time * 3.4 + blinkPhase) > -0.25;

              if (isLit) {
                setCell(x, y, ornChar, PALETTE.ornaments[colorIdx], true);
              } else {
                setCell(x, y, 'o', PALETTE.treeDark, false);
              }
              continue;
            }

            const fChar = foliageChars[Math.floor(hash * 29) % foliageChars.length];
            const fColor = hash > 0.55
              ? PALETTE.treeLight
              : (hash > 0.25 ? PALETTE.treeMid : PALETTE.treeDark);
            setCell(x, y, fChar, fColor, false);
          }
        }

        // 3. Tronco da árvore
        const trunkTopY = treeTopY + foliageHeight;
        for (let r = 0; r < trunkHeight; r++) {
          drawText(centerX - 2, trunkTopY + r, '|###|', PALETTE.trunkHighlight, false);
        }

        // 4. Presentes embrulhados em ASCII na base da árvore
        const giftBaseY = groundY;
        if (cols >= 44) {
          drawText(centerX - 10, giftBaseY - 2, '.---.', '#ef4444');
          drawText(centerX - 10, giftBaseY - 1, '| + |', '#facc15', true);
          drawText(centerX - 10, giftBaseY,     "'---'", '#ef4444');

          drawText(centerX - 16, giftBaseY - 1, '[_|_]', '#22d3ee', true);
          drawText(centerX - 16, giftBaseY,     '[===]', '#22d3ee');

          drawText(centerX + 5, giftBaseY - 2, '.----.', '#f472b6');
          drawText(centerX + 5, giftBaseY - 1, '| ++ |', '#fde047', true);
          drawText(centerX + 5, giftBaseY,     "'----'", '#f472b6');

          drawText(centerX + 12, giftBaseY - 1, '{*}', '#facc15', true);
          drawText(centerX + 12, giftBaseY,     '[#]', '#ef4444');
        } else {
          drawText(centerX - 8, giftBaseY - 1, '[+]', '#ef4444', true);
          drawText(centerX + 5, giftBaseY - 1, '[*]', '#22d3ee', true);
        }

        return { centerX, maxHalfWidth };
      }

      function drawCozyCabin(time, dt, treeInfo) {
        if (cols < 84) {
          smokeParticles = [];
          return;
        }

        const cabinWidth = 18;
        const rightSpace = cols - (treeInfo.centerX + treeInfo.maxHalfWidth);
        let cabinX;

        if (rightSpace >= cabinWidth + 8) {
          cabinX = treeInfo.centerX + treeInfo.maxHalfWidth + Math.floor((rightSpace - cabinWidth) * 0.45);
        } else {
          cabinX = cols - cabinWidth - 4;
        }

        const groundY = rows - (groundHeights[cabinX + 8] || 3);
        const cabinTopY = groundY - 8;

        const cabinRows = [
          "          ||      ",
          "         _||_     ",
          "       ./    \\.   ",
          "     ./  *  *  \\. ",
          "   ./____________\\.",
          "   |   _      _   |",
          "   |  | |    |##| |",
          "   |  |.|    |##| |",
          "   |__|_|____|__|_|"
        ];

        for (let r = 0; r < cabinRows.length; r++) {
          const line = cabinRows[r];
          const y = cabinTopY + r;
          for (let c = 0; c < line.length; c++) {
            const ch = line[c];
            if (ch === ' ') continue;

            let color = PALETTE.cabinWood;
            let glow = false;

            if (r <= 1) {
              color = PALETTE.cabinChimney;
            } else if (r >= 2 && r <= 4) {
              color = ch === '*' ? PALETTE.snowIce : PALETTE.cabinRoofSnow;
            } else if ((r === 6 || r === 7) && c >= 13 && c <= 16) {
              const flicker = Math.sin(time * 7.5) > 0.2;
              color = (ch === '#' && flicker) ? PALETTE.cabinWindowBright : PALETTE.cabinWindow;
              glow = ch === '#';
            } else if ((r >= 6 && r <= 8) && c >= 6 && c <= 8) {
              color = ch === '.' ? PALETTE.starTopper : PALETTE.cabinWoodDark;
              glow = ch === '.';
            }

            setCell(cabinX + c, y, ch, color, glow);
          }
        }

        const chimneyX = cabinX + 10.5;
        const chimneyTopY = cabinTopY - 1;

        if (Math.random() < dt * 4.2) {
          smokeParticles.push({
            x: chimneyX + (Math.random() - 0.5) * 0.8,
            y: chimneyTopY,
            age: 0,
            maxAge: 3.2 + Math.random() * 1.4,
            driftPhase: Math.random() * Math.PI * 2
          });
        }

        for (let i = smokeParticles.length - 1; i >= 0; i--) {
          const p = smokeParticles[i];
          p.age += dt;
          if (p.age >= p.maxAge) {
            smokeParticles.splice(i, 1);
            continue;
          }

          const lifeRatio = p.age / p.maxAge;
          p.y -= dt * (2.1 - lifeRatio * 0.6);
          p.x += dt * (currentWind * 1.4 + Math.sin(time * 2.5 + p.driftPhase) * 0.9);

          let smokeChar = '.';
          if (lifeRatio < 0.25) smokeChar = 'o';
          else if (lifeRatio < 0.55) smokeChar = (Math.floor(p.age * 4) % 2 === 0) ? '(' : ')';
          else if (lifeRatio < 0.82) smokeChar = '~';

          const colorIdx = Math.min(
            PALETTE.smoke.length - 1,
            Math.floor(lifeRatio * PALETTE.smoke.length)
          );

          setCell(p.x, p.y, smokeChar, PALETTE.smoke[colorIdx], false);
        }
      }

      function drawSantaSleigh(time, dt) {
        const sleighArtWidth = 46;

        if (!santaState.active) {
          santaState.cooldown -= dt;
          if (santaState.cooldown <= 0) {
            santaState.active = true;
            santaState.x = -sleighArtWidth - 2;
            santaState.y = Math.max(3, Math.min(8, Math.floor(rows * 0.16)));
            santaState.speed = Math.max(12, cols * 0.14);
          }
        } else {
          santaState.x += santaState.speed * dt;
          const bobY = Math.round(Math.sin(time * 3.5) * 0.8);
          const baseY = santaState.y + bobY;
          const baseX = Math.floor(santaState.x);

          const gallop = Math.floor(time * 8) % 2 === 0;
          const legsLine = gallop
            ? " '--------'==============='-/ | \\---/ | \\-'o"
            : " '--------'==============='-\\ | /---\\ | /-'o";

          const sleighLines = [
            "    _.-.                    \\ /     \\ /     ",
            "  .'____'.     _.-~-._     -(*)-   -(*)-    ",
            " |  [__]  |.-'         '-._/ | \\___/ | \\_.  ",
            legsLine
          ];

          for (let r = 0; r < sleighLines.length; r++) {
            const line = sleighLines[r];
            for (let c = 0; c < line.length; c++) {
              const ch = line[c];
              if (ch === ' ') continue;

              let color = PALETTE.reindeerBrown;
              let glow = false;

              if (c <= 10) {
                color = (r === 0 || ch === '_') ? PALETTE.santaTrim : PALETTE.santaRed;
                glow = r === 0;
              } else if (c <= 26) {
                color = ch === '=' ? PALETTE.sleighGold : PALETTE.santaRed;
                glow = ch === '=';
              } else if (c === line.length - 1 && r === 3) {
                color = PALETTE.rudolphNose;
                glow = true;
              } else if (r === 0 && (ch === '\\' || ch === '/')) {
                color = PALETTE.sleighGold;
              }

              setCell(baseX + c, baseY + r, ch, color, glow);
            }
          }

          for (let k = 0; k < 2; k++) {
            if (Math.random() < 0.75) {
              trailParticles.push({
                x: baseX + 2 + Math.random() * 6,
                y: baseY + 1 + Math.random() * 2.5,
                vy: 0.4 + Math.random() * 0.9,
                vx: -1.5 - Math.random() * 2,
                age: 0,
                maxAge: 0.9 + Math.random() * 0.8,
                char: ['*', '+', '·', '✦'][Math.floor(Math.random() * 4)],
                color: Math.random() > 0.4 ? PALETTE.starTopperCore : PALETTE.starBlue
              });
            }
          }

          if (baseX > cols + 6) {
            santaState.active = false;
            santaState.cooldown = 12 + Math.random() * 8;
          }
        }

        for (let i = trailParticles.length - 1; i >= 0; i--) {
          const tp = trailParticles[i];
          tp.age += dt;
          if (tp.age >= tp.maxAge) {
            trailParticles.splice(i, 1);
            continue;
          }
          tp.x += tp.vx * dt;
          tp.y += tp.vy * dt;

          const ratio = tp.age / tp.maxAge;
          const ch = ratio > 0.65 ? '.' : tp.char;
          setCell(tp.x, tp.y, ch, tp.color, ratio < 0.5);
        }
      }

      function drawSnowflakes(time, dt) {
        currentWind += (targetWind - currentWind) * Math.min(1, dt * 3.5);
        const speedMult = isBlizzard ? 1.85 : (prefersReducedMotion ? 0.5 : 1.0);
        const windMult = isBlizzard ? 1.9 : 1.0;

        for (let i = 0; i < snowflakes.length; i++) {
          const f = snowflakes[i];
          f.y += f.speed * speedMult * dt;
          const sway = Math.cos(time * f.swayFreq + f.phase) * f.swayAmp * dt;
          f.x += sway + currentWind * windMult * f.windFactor * 6.5 * dt;

          if (f.y >= rows) {
            f.y = -1;
            f.x = Math.random() * cols;
          }
          if (f.x < 0) f.x += cols;
          if (f.x >= cols) f.x -= cols;

          setCell(f.x, f.y, f.char, f.color, f.glow);
        }
      }

      function drawStarBurstParticles(dt) {
        if (starBoostTimer > 0) {
          starBoostTimer = Math.max(0, starBoostTimer - dt);
        }
        for (let i = starBurstParticles.length - 1; i >= 0; i--) {
          const sp = starBurstParticles[i];
          sp.age += dt;
          if (sp.age >= sp.maxAge) {
            starBurstParticles.splice(i, 1);
            continue;
          }
          sp.x += sp.vx * dt;
          sp.y += sp.vy * dt;
          sp.vy += 4.5 * dt; // leve gravidade estelar
          const ratio = sp.age / sp.maxAge;
          const ch = ratio > 0.72 ? '·' : sp.char;
          setCell(sp.x, sp.y, ch, sp.color, ratio < 0.8);
        }
      }

      function renderCanvas() {
        ctx.fillStyle = skyGradient || PALETTE.bg;
        ctx.fillRect(0, 0, width, height);
        if (moonGlowGradient) {
          ctx.fillStyle = moonGlowGradient;
          ctx.fillRect(0, 0, width, height);
        }

        ctx.font = `600 ${fontSize}px "JetBrains Mono", "Courier New", Courier, monospace`;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'top';

        const normalBatches = new Map();
        const glowBatches = new Map();

        for (let r = 0; r < rows; r++) {
          const rowOffset = r * cols;
          const py = r * charH;

          for (let c = 0; c < cols; c++) {
            const idx = rowOffset + c;
            const ch = charGrid[idx];
            if (ch === ' ') continue;

            const color = colorGrid[idx];
            const isGlow = glowGrid[idx];
            const targetMap = isGlow ? glowBatches : normalBatches;

            let batch = targetMap.get(color);
            if (!batch) {
              batch = [];
              targetMap.set(color, batch);
            }
            batch.push(ch, c * charW, py);
          }
        }

        ctx.shadowBlur = 0;
        for (const [color, items] of normalBatches.entries()) {
          ctx.fillStyle = color;
          for (let i = 0; i < items.length; i += 3) {
            ctx.fillText(items[i], items[i + 1], items[i + 2]);
          }
        }

        ctx.shadowBlur = Math.max(6, Math.floor(fontSize * 0.65));
        for (const [color, items] of glowBatches.entries()) {
          ctx.fillStyle = color;
          ctx.shadowColor = color;
          for (let i = 0; i < items.length; i += 3) {
            ctx.fillText(items[i], items[i + 1], items[i + 2]);
          }
        }
        ctx.shadowBlur = 0;
      }

      function drawSceneFrame(time, dt) {
        clearGrid();
        drawSkyAndMoon(time);
        drawSnowGround();
        const treeInfo = drawChristmasTree(time);
        drawCozyCabin(time, dt, treeInfo);
        drawSantaSleigh(time, dt);
        drawSnowflakes(time, dt);
        drawStarBurstParticles(dt);
        renderCanvas();
      }

      let lastTimestamp = 0;
      function animate(timestamp) {
        if (isPaused || currentMode !== '2d') {
          rafId = null;
          return;
        }
        if (!lastTimestamp) lastTimestamp = timestamp;
        const dt = Math.min(0.05, (timestamp - lastTimestamp) / 1000);
        lastTimestamp = timestamp;
        sceneTime += dt;

        drawSceneFrame(sceneTime, dt);
        rafId = requestAnimationFrame(animate);
      }

      // =========================================================================
      // MOTOR GRÁFICO VOLUMÉTRICO 3D ASCII — FELIZ NATAL 2026 (MODO 3D)
      // =========================================================================
      function createTree3DEngine(targetCanvas) {
        const ctx3d = targetCanvas.getContext('2d', { alpha: false });
        let w3 = 0, h3 = 0, dpr3 = 1, cellW3 = 9, cellH3 = 14, cols3 = 0, rows3 = 0;
        let zBuffer = new Float32Array(0);
        let charBuffer = [];
        let colorBuffer = [];
        let glowBuffer = new Float32Array(0);
        let weightBuffer = new Uint8Array(0);

        let rotationY = 0;
        const baseAngularSpeed = 0.42;
        let userVelocityY = 0;
        let isDragging = false;
        let lastPointerX = 0;
        let startTime3d = performance.now();
        let lastFrameTime3d = startTime3d;
        let raf3dId = null;
        let isRunning = false;

        const normalize3 = (v) => {
          const len = Math.hypot(v.x, v.y, v.z) || 1;
          return { x: v.x / len, y: v.y / len, z: v.z / len };
        };
        const dot3 = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
        const clamp = (val, min, max) => Math.max(min, Math.min(max, val));
        const lerp = (a, b, t) => a + (b - a) * t;
        const smoothstep = (e0, e1, x) => {
          const t = clamp((x - e0) / (e1 - e0), 0, 1);
          return t * t * (3 - 2 * t);
        };
        const easeOutBack = (x) => {
          const c1 = 1.70158;
          const c3 = c1 + 1;
          return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
        };
        const easeOutCubic = (x) => 1 - Math.pow(1 - x, 3);
        const rgbStr = (r, g, b, a = 1) =>
          a >= 0.999 ? `rgb(${r | 0},${g | 0},${b | 0})` : `rgba(${r | 0},${g | 0},${b | 0},${a.toFixed(3)})`;

        const lightDir = normalize3({ x: -0.68, y: 0.62, z: 0.39 });
        const TREE_PHRASE = 'FELIZNATAL';
        const FINAL_MESSAGE = 'FELIZ NATAL 2026';

        let ambientEyes = [];
        let floorPoints = [];
        let trunkPoints = [];
        let treePoints = [];
        let garlandBulbs = [];
        let ornaments = [];
        let starPoints = [];
        let giftBoxes = [];
        let snowLayers = [[], [], []];

        function buildSceneGeometry() {
          ambientEyes = [
            { nx: -0.36, ny: 0.22, phase: 0.2, isPair: true },
            { nx: 0.38, ny: 0.14, phase: 1.9, isPair: true },
            { nx: -0.28, ny: -0.18, phase: 3.4, isPair: true },
            { nx: 0.31, ny: -0.25, phase: 4.7, isPair: true },
            { nx: -0.44, ny: -0.02, phase: 2.5, isPair: false },
            { nx: 0.43, ny: 0.30, phase: 5.3, isPair: false }
          ];

          floorPoints = [];
          const floorY = -1.25;
          const maxFloorR = 1.48;
          const rings = 22;
          const floorChars = ['~', '.', '*', 'o', '+', '·'];
          for (let rIdx = 1; rIdx <= rings; rIdx++) {
            const rNorm = rIdx / rings;
            const radius = rNorm * maxFloorR;
            const count = Math.max(12, Math.floor(2 * Math.PI * radius * 26));
            for (let i = 0; i < count; i++) {
              const angle = (i / count) * Math.PI * 2 + (rIdx % 2) * 0.12;
              floorPoints.push({
                x: Math.cos(angle) * radius,
                y: floorY,
                z: Math.sin(angle) * radius,
                rNorm,
                angle,
                ch: floorChars[(rIdx + i) % floorChars.length]
              });
            }
          }

          trunkPoints = [];
          const trunkChars = ['#', '|', 'H', 'M', 'I', '@'];
          for (let iy = 0; iy < 14; iy++) {
            const t = iy / 13;
            const y = lerp(-1.25, -0.76, t);
            const r = 0.165 * (1 + Math.pow(1 - t, 2.5) * 0.22);
            for (let ia = 0; ia < 24; ia++) {
              const theta = (ia / 24) * Math.PI * 2;
              const nx = Math.cos(theta);
              const nz = Math.sin(theta);
              trunkPoints.push({ x: nx * r, y, z: nz * r, nx, ny: 0.05, nz, t, ch: trunkChars[(iy + ia) % trunkChars.length] });
            }
          }

          treePoints = [];
          const tiers = [
            { yMin: -0.82, yMax: -0.10, rBottom: 1.04, rTop: 0.44, snowBand: 0.16, slopeNy: 0.55 },
            { yMin: -0.20, yMax: 0.46, rBottom: 0.78, rTop: 0.27, snowBand: 0.17, slopeNy: 0.58 },
            { yMin: 0.36, yMax: 1.18, rBottom: 0.52, rTop: 0.015, snowBand: 0.18, slopeNy: 0.62 }
          ];
          let globalCharCursor = 0;
          tiers.forEach((tier, tierIdx) => {
            const verticalSteps = tierIdx === 2 ? 25 : 22;
            for (let s = 0; s <= verticalSteps; s++) {
              const v = s / verticalSteps;
              const y = lerp(tier.yMin, tier.yMax, v);
              const baseR = lerp(tier.rTop, tier.rBottom, Math.pow(1 - v, 1.24));
              const isSnow = v >= (1 - tier.snowBand) || (v <= 0.075 && tierIdx > 0);
              const angularSteps = Math.max(8, Math.round(Math.max(0.12, 2 * Math.PI * baseR) * 25));
              for (let a = 0; a < angularSteps; a++) {
                const theta = (a / angularSteps) * Math.PI * 2 + tierIdx * 0.45 + s * 0.08;
                const branchWave = 1 + 0.045 * Math.sin(theta * 7 + v * 5) + 0.025 * Math.cos(theta * 13);
                const r = baseR * branchWave;
                const nx = Math.cos(theta);
                const nz = Math.sin(theta);
                const normal = normalize3({ x: nx, y: tier.slopeNy, z: nz });
                const letter = TREE_PHRASE[globalCharCursor % TREE_PHRASE.length];
                globalCharCursor++;
                treePoints.push({
                  x: nx * r, y, z: nz * r,
                  nx: normal.x, ny: normal.y, nz: normal.z,
                  isSnow, tierIdx,
                  heightProgress: clamp((y - (-0.82)) / (1.18 - (-0.82)), 0, 1),
                  letter,
                  seed: (s * 31 + a * 17 + tierIdx * 13) % 100
                });
              }
            }
          });

          const radiusAtY = (y) => {
            if (y < -0.14) return lerp(0.44, 1.04, Math.pow(1 - clamp((y + 0.82) / 0.72, 0, 1), 1.24));
            if (y < 0.42) return lerp(0.27, 0.78, Math.pow(1 - clamp((y + 0.20) / 0.66, 0, 1), 1.24));
            return lerp(0.02, 0.52, Math.pow(1 - clamp((y - 0.36) / 0.82, 0, 1), 1.24));
          };

          garlandBulbs = [];
          for (let i = 0; i < 176; i++) {
            const t = i / 175;
            const y = lerp(-0.79, 1.12, t);
            const theta = t * 6.2 * Math.PI * 2;
            const r = radiusAtY(y) + 0.045;
            garlandBulbs.push({ index: i, x: Math.cos(theta) * r, y, z: Math.sin(theta) * r, phase: i * 0.35 });
          }

          ornaments = [];
          const ornamentSpecs = [
            { y: -0.66, theta: 0.3, color: 'red' }, { y: -0.52, theta: 1.5, color: 'gold' },
            { y: -0.68, theta: 2.7, color: 'gold' }, { y: -0.45, theta: 3.9, color: 'red' },
            { y: -0.62, theta: 5.1, color: 'red' }, { y: -0.32, theta: 0.9, color: 'gold' },
            { y: -0.28, theta: 2.3, color: 'red' }, { y: -0.34, theta: 4.5, color: 'gold' },
            { y: -0.05, theta: 0.6, color: 'red' }, { y: 0.04, theta: 2.0, color: 'gold' },
            { y: -0.02, theta: 3.4, color: 'red' }, { y: 0.12, theta: 4.8, color: 'gold' },
            { y: 0.25, theta: 1.3, color: 'red' }, { y: 0.28, theta: 3.8, color: 'gold' },
            { y: 0.50, theta: 0.4, color: 'gold' }, { y: 0.56, theta: 2.4, color: 'red' },
            { y: 0.64, theta: 4.4, color: 'gold' }, { y: 0.78, theta: 1.6, color: 'red' }
          ];
          ornamentSpecs.forEach((spec, idx) => {
            const r = radiusAtY(spec.y) + 0.055;
            ornaments.push({ index: idx, x: Math.cos(spec.theta) * r, y: spec.y, z: Math.sin(spec.theta) * r, color: spec.color });
          });

          starPoints = [];
          const starCenterY = 1.29;
          for (const zOff of [-0.025, 0, 0.025]) {
            const scaleZ = zOff === 0 ? 1 : 0.65;
            starPoints.push({ x: 0, y: starCenterY, z: zOff, ch: '@', core: true });
            for (let i = 0; i < 10; i++) {
              const angle = (i * Math.PI) / 5 + Math.PI / 2;
              const rad = (i % 2 === 0 ? 0.19 : 0.078) * scaleZ;
              for (let st = 1; st <= 5; st++) {
                const frac = st / 5;
                starPoints.push({
                  x: Math.cos(angle) * rad * frac,
                  y: starCenterY + Math.sin(angle) * rad * frac,
                  z: zOff * (1 - frac * 0.5),
                  ch: st === 5 ? '*' : (zOff === 0 ? '#' : '+'),
                  core: frac < 0.5
                });
              }
            }
          }

          giftBoxes = [];
          const boxConfigs = [
            { angle: 0.55, dist: 0.62, w: 0.27, h: 0.22, d: 0.27, rotY: 0.3, boxPalette: ['#ef4444', '#dc2626', '#991b1b'], ribbonColor: '#fde047', bowColor: '#fef08a' },
            { angle: 2.15, dist: 0.66, w: 0.25, h: 0.26, d: 0.25, rotY: -0.4, boxPalette: ['#3b82f6', '#2563eb', '#1e40af'], ribbonColor: '#f8fafc', bowColor: '#ffffff' },
            { angle: 3.75, dist: 0.60, w: 0.28, h: 0.20, d: 0.24, rotY: 0.5, boxPalette: ['#f8fafc', '#e2e8f0', '#94a3b8'], ribbonColor: '#f43f5e', bowColor: '#fda4af' },
            { angle: 5.25, dist: 0.65, w: 0.24, h: 0.24, d: 0.24, rotY: -0.25, boxPalette: ['#e11d48', '#be123c', '#881337'], ribbonColor: '#facc15', bowColor: '#fef9c3' }
          ];
          boxConfigs.forEach((cfg, idx) => {
            const voxels = [];
            for (let ix = 0; ix < 7; ix++) {
              for (let iy = 0; iy < 6; iy++) {
                for (let iz = 0; iz < 7; iz++) {
                  if (!(ix === 0 || ix === 6 || iy === 0 || iy === 5 || iz === 0 || iz === 6)) continue;
                  const isRibbon = (ix === 3 || iz === 3);
                  voxels.push({
                    lx: ((ix / 6) - 0.5) * cfg.w,
                    ly: (iy / 5) * cfg.h,
                    lz: ((iz / 6) - 0.5) * cfg.d,
                    fnx: ix === 0 ? -1 : (ix === 6 ? 1 : 0),
                    fny: iy === 5 ? 1 : 0,
                    fnz: iz === 0 ? -1 : (iz === 6 ? 1 : 0),
                    isRibbon,
                    isBow: false,
                    ch: isRibbon ? '#' : '@'
                  });
                }
              }
            }
            const bowY = cfg.h + 0.035;
            [
              { dx: 0, dy: 0, dz: 0, ch: '*' },
              { dx: -0.045, dy: 0.025, dz: 0, ch: '(' },
              { dx: 0.045, dy: 0.025, dz: 0, ch: ')' },
              { dx: 0, dy: 0.025, dz: -0.045, ch: '~' },
              { dx: 0, dy: 0.025, dz: 0.045, ch: '~' },
              { dx: -0.035, dy: -0.01, dz: 0.035, ch: '/' },
              { dx: 0.035, dy: -0.01, dz: -0.035, ch: '\\' }
            ].forEach((b) => {
              voxels.push({ lx: b.dx, ly: bowY + b.dy, lz: b.dz, fnx: 0, fny: 1, fnz: 0, isRibbon: true, isBow: true, ch: b.ch });
            });
            giftBoxes.push({
              index: idx,
              orbitAngle: cfg.angle,
              orbitDist: cfg.dist,
              localRotY: cfg.rotY,
              boxPalette: cfg.boxPalette,
              ribbonColor: cfg.ribbonColor,
              bowColor: cfg.bowColor,
              voxels
            });
          });
        }

        function initSnow() {
          const counts = [95, 55, 30];
          const charsByLayer = [['.', '·', '`'], ['*', '+', '•'], ['❄', '*', '#', '✦']];
          const speeds = [18, 42, 88];
          for (let l = 0; l < 3; l++) {
            snowLayers[l] = [];
            for (let i = 0; i < counts[l]; i++) {
              snowLayers[l].push({
                x: Math.random() * (w3 || window.innerWidth),
                y: Math.random() * (h3 || window.innerHeight),
                vy: speeds[l] * (0.8 + Math.random() * 0.45),
                vx: (Math.random() - 0.5) * (10 + l * 14),
                swayPhase: Math.random() * Math.PI * 2,
                swayFreq: 0.8 + Math.random() * 1.4,
                ch: charsByLayer[l][i % charsByLayer[l].length]
              });
            }
          }
        }

        function resize3d() {
          dpr3 = Math.min(window.devicePixelRatio || 1, 2);
          w3 = window.innerWidth;
          h3 = window.innerHeight;
          targetCanvas.width = Math.floor(w3 * dpr3);
          targetCanvas.height = Math.floor(h3 * dpr3);
          ctx3d.setTransform(dpr3, 0, 0, dpr3, 0, 0);

          const minDim = Math.min(w3, h3);
          if (minDim < 520) {
            cellW3 = 7.5;
            cellH3 = 11.5;
          } else if (minDim < 900) {
            cellW3 = 8.5;
            cellH3 = 13;
          } else {
            cellW3 = 9.5;
            cellH3 = 14.5;
          }

          cols3 = Math.ceil(w3 / cellW3);
          rows3 = Math.ceil(h3 / cellH3);
          const totalCells = cols3 * rows3;

          zBuffer = new Float32Array(totalCells);
          glowBuffer = new Float32Array(totalCells);
          weightBuffer = new Uint8Array(totalCells);
          charBuffer = new Array(totalCells);
          colorBuffer = new Array(totalCells);

          if (snowLayers[0].length === 0) initSnow();
        }

        function projectPoint(x, y, z, rotY, cx, cy, scale) {
          const cosR = Math.cos(rotY);
          const sinR = Math.sin(rotY);
          const rx = x * cosR - z * sinR;
          const rz = x * sinR + z * cosR;
          const cosT = Math.cos(0.14);
          const sinT = Math.sin(0.14);
          const ty = y * cosT - rz * sinT;
          const tz = y * sinT + rz * cosT;
          const depth = 3.55 - tz;
          if (depth <= 0.25) return null;
          const persp = scale / depth;
          return {
            col: Math.floor((cx + rx * persp) / cellW3),
            row: Math.floor((cy - (ty - 0.04) * persp) / cellH3),
            depth, rx, ry: ty, rz
          };
        }

        function plotCell(col, row, depth, ch, color, weight = 1, glow = 0) {
          if (col < 0 || col >= cols3 || row < 0 || row >= rows3) return;
          const idx = row * cols3 + col;
          if (depth < zBuffer[idx]) {
            zBuffer[idx] = depth;
            charBuffer[idx] = ch;
            colorBuffer[idx] = color;
            weightBuffer[idx] = weight;
            glowBuffer[idx] = glow;
          }
        }

        function updateAndDrawSnowLayer(layerIdx, dt, elapsed, treeCx, treeCy, treeRadiusPx, opacityMult) {
          const particles = snowLayers[layerIdx];
          const baseSize = layerIdx === 0 ? 10 : (layerIdx === 1 ? 14 : 20);
          ctx3d.font = `${layerIdx === 2 ? '700' : '500'} ${baseSize}px "JetBrains Mono", monospace`;
          ctx3d.textAlign = 'center';
          ctx3d.textBaseline = 'middle';

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];
            p.y += p.vy * dt;
            p.x += (p.vx + Math.sin(elapsed * p.swayFreq + p.swayPhase) * (8 + layerIdx * 10)) * dt;
            if (p.y > h3 + 20) { p.y = -15; p.x = Math.random() * w3; }
            if (p.x < -20) p.x = w3 + 20;
            if (p.x > w3 + 20) p.x = -20;

            const dist = Math.hypot(p.x - treeCx, p.y - treeCy);
            const nearTree = clamp(1 - dist / (treeRadiusPx * 1.25), 0, 1);

            let alpha;
            if (layerIdx === 0) {
              alpha = (0.22 + nearTree * 0.15) * opacityMult;
              ctx3d.shadowBlur = 0;
              ctx3d.fillStyle = `rgba(165, 205, 255, ${alpha.toFixed(3)})`;
            } else if (layerIdx === 1) {
              alpha = 0.45 + nearTree * 0.35;
              ctx3d.shadowBlur = nearTree > 0.3 ? 6 : 0;
              ctx3d.shadowColor = '#bae6fd';
              ctx3d.fillStyle = `rgba(215, 238, 255, ${alpha.toFixed(3)})`;
            } else {
              const glint = nearTree > 0.15 ? (0.5 + 0.5 * Math.sin(elapsed * 18 + i * 3.1)) * nearTree : 0;
              alpha = 0.62 + glint * 0.38;
              ctx3d.shadowBlur = 6 + glint * 14;
              ctx3d.shadowColor = glint > 0.35 ? '#fef08a' : '#e0f2fe';
              ctx3d.fillStyle = glint > 0.45 ? `rgba(255, 252, 220, ${alpha.toFixed(3)})` : `rgba(235, 246, 255, ${alpha.toFixed(3)})`;
            }
            ctx3d.fillText(p.ch, p.x, p.y);
          }
          ctx3d.shadowBlur = 0;
        }

        function drawTypedBanner(timeSinceStart, elapsed, centerX, screenH) {
          const charsPerSec = 9.5;
          const count = Math.min(FINAL_MESSAGE.length, Math.floor(timeSinceStart * charsPerSec) + 1);
          const visibleStr = FINAL_MESSAGE.slice(0, count);
          const isTyping = count < FINAL_MESSAGE.length;
          const cursorBlink = Math.floor(elapsed * 3) % 2 === 0;
          const bannerY = Math.max(54, screenH * 0.095);
          const fontSize3d = clamp(Math.floor(w3 / 22), 16, 34);

          ctx3d.save();
          ctx3d.font = `800 ${fontSize3d}px "JetBrains Mono", monospace`;
          ctx3d.textAlign = 'center';
          ctx3d.textBaseline = 'middle';
          const glowPulse = 0.85 + 0.15 * Math.sin(elapsed * 3.2);
          ctx3d.shadowColor = 'rgba(250, 204, 21, 0.85)';
          ctx3d.shadowBlur = 16 * glowPulse;
          ctx3d.fillStyle = '#fde047';
          const displayStr = isTyping && cursorBlink ? `${visibleStr}_` : visibleStr;
          ctx3d.fillText(displayStr.split('').join(' '), centerX, bannerY);

          if (!isTyping) {
            const lineAlpha = clamp((timeSinceStart - FINAL_MESSAGE.length / charsPerSec) * 1.5, 0, 0.55);
            ctx3d.shadowBlur = 0;
            ctx3d.font = `500 ${Math.max(10, Math.floor(fontSize3d * 0.42))}px "JetBrains Mono", monospace`;
            ctx3d.fillStyle = `rgba(253, 224, 71, ${lineAlpha.toFixed(3)})`;
            ctx3d.fillText('· · ✦ · ·', centerX, bannerY + fontSize3d * 0.95);
          }
          ctx3d.restore();
        }

        function render3d(now) {
          if (!isRunning) {
            raf3dId = null;
            return;
          }
          const dt = Math.min((now - lastFrameTime3d) / 1000, 0.05);
          lastFrameTime3d = now;
          const elapsed = (now - startTime3d) / 1000;

          if (!isDragging) {
            rotationY += (baseAngularSpeed + userVelocityY) * dt;
            userVelocityY *= Math.pow(0.06, dt);
          }

          zBuffer.fill(9999);
          glowBuffer.fill(0);
          weightBuffer.fill(0);
          charBuffer.fill('');
          colorBuffer.fill('');

          const bgGrad = ctx3d.createRadialGradient(w3 * 0.5, h3 * 0.48, h3 * 0.05, w3 * 0.5, h3 * 0.5, Math.max(w3, h3) * 0.75);
          bgGrad.addColorStop(0, '#091222');
          bgGrad.addColorStop(0.55, '#050a14');
          bgGrad.addColorStop(1, '#020409');
          ctx3d.fillStyle = bgGrad;
          ctx3d.fillRect(0, 0, w3, h3);

          const cx = w3 * 0.5;
          const cy = h3 * 0.51;
          const scale = Math.min(w3 * 0.92, h3 * 0.84) * 1.16;

          const p1Eyes = smoothstep(0.1, 1.4, elapsed);
          const p1Floor = smoothstep(0.5, 2.2, elapsed);
          const p2Trunk = smoothstep(1.8, 3.3, elapsed);
          const p3Tree = clamp((elapsed - 3.0) / 4.4, 0, 1);
          const p4Garland = clamp((elapsed - 7.2) / 2.2, 0, 1);
          const p4Ornaments = clamp((elapsed - 8.6) / 2.2, 0, 1);
          const p5Star = smoothstep(10.5, 11.8, elapsed);
          const p6Gifts = clamp((elapsed - 11.6) / 2.2, 0, 1);
          const p7TextProgress = Math.max(0, elapsed - 13.6);

          updateAndDrawSnowLayer(0, dt, elapsed, cx, cy, scale * 0.34, p1Eyes);

          if (p1Eyes > 0) {
            ambientEyes.forEach((eye) => {
              const alpha = p1Eyes * (0.45 + 0.55 * Math.sin(elapsed * 1.9 + eye.phase)) * 0.72;
              const c = Math.floor((0.5 + eye.nx) * cols3);
              const r = Math.floor((0.5 + eye.ny) * rows3);
              const colStr = rgbStr(135, 195, 255, alpha);
              plotCell(c, r, 900, '•', colStr, 1, alpha * 0.6);
              if (eye.isPair) plotCell(c + 2, r, 900, '•', colStr, 1, alpha * 0.6);
            });
          }

          if (p1Floor > 0) {
            floorPoints.forEach((pt) => {
              if (pt.rNorm > p1Floor * 1.08) return;
              const localFade = clamp((p1Floor * 1.08 - pt.rNorm) * 6, 0, 1);
              const proj = projectPoint(pt.x, pt.y, pt.z, rotationY * 0.65, cx, cy, scale);
              if (!proj) return;
              const intensity = localFade * (0.75 + 0.25 * Math.sin(pt.rNorm * 10 - elapsed * 2.4 + pt.angle * 2)) * (1 - Math.pow(pt.rNorm, 2.2) * 0.65);
              plotCell(proj.col, proj.row, proj.depth, pt.ch, rgbStr(lerp(22, 85, intensity), lerp(65, 175, intensity), lerp(140, 255, intensity), intensity * 0.92), pt.rNorm < 0.55 ? 1 : 0, intensity * 0.35);
            });
          }

          if (p2Trunk > 0) {
            const trunkEase = easeOutCubic(p2Trunk);
            const breath = 0.5 + 0.5 * Math.sin(elapsed * 2.8);
            const auraCenter = projectPoint(0, -1.02, 0, rotationY, cx, cy, scale);
            if (auraCenter) {
              const auraGrad = ctx3d.createRadialGradient(auraCenter.col * cellW3, auraCenter.row * cellH3, 2, auraCenter.col * cellW3, auraCenter.row * cellH3, scale * (0.14 + breath * 0.035));
              auraGrad.addColorStop(0, `rgba(217, 138, 60, ${(0.22 + breath * 0.12) * trunkEase})`);
              auraGrad.addColorStop(1, 'rgba(217, 138, 60, 0)');
              ctx3d.fillStyle = auraGrad;
              ctx3d.fillRect(0, 0, w3, h3);
            }
            const cosR = Math.cos(rotationY);
            const sinR = Math.sin(rotationY);
            const yOffset = (1 - trunkEase) * -0.45;
            trunkPoints.forEach((pt) => {
              if (pt.t > trunkEase * 1.05) return;
              const proj = projectPoint(pt.x, pt.y + yOffset, pt.z, rotationY, cx, cy, scale);
              if (!proj) return;
              const ndotl = clamp(dot3({ x: pt.nx * cosR - pt.nz * sinR, y: pt.ny, z: pt.nx * sinR + pt.nz * cosR }, lightDir), -1, 1);
              const shade = clamp(0.45 + ndotl * 0.55, 0.18, 1);
              plotCell(proj.col, proj.row, proj.depth, pt.ch, rgbStr(lerp(58, 158, shade) + breath * 14, lerp(32, 96, shade) + breath * 9, lerp(18, 52, shade) + breath * 4), 2, breath * 0.25);
            });
          }

          if (p3Tree > 0) {
            const cosR = Math.cos(rotationY);
            const sinR = Math.sin(rotationY);
            treePoints.forEach((pt) => {
              const trigger = pt.heightProgress * 0.88 + (pt.seed / 100) * 0.08;
              if (p3Tree < trigger) return;
              const settle = clamp((p3Tree - trigger) / 0.14, 0, 1);
              const whiteFlash = Math.pow(1 - settle, 2.2);
              const proj = projectPoint(pt.x, pt.y + (1 - easeOutCubic(settle)) * -0.14, pt.z, rotationY, cx, cy, scale);
              if (!proj) return;
              const lightFactor = clamp(0.48 + dot3({ x: pt.nx * cosR - pt.nz * sinR, y: pt.ny, z: pt.nx * sinR + pt.nz * cosR }, lightDir) * 0.56, 0.14, 1.0);
              let rCol, gCol, bCol;
              if (pt.isSnow) {
                rCol = lerp(175, 255, lightFactor); gCol = lerp(198, 255, lightFactor); bCol = lerp(228, 255, lightFactor);
              } else {
                rCol = lerp(10, 74, Math.pow(lightFactor, 1.35)); gCol = lerp(52, 224, Math.pow(lightFactor, 0.92)); bCol = lerp(28, 96, Math.pow(lightFactor, 1.25));
              }
              if (whiteFlash > 0.01) {
                rCol = lerp(rCol, 255, whiteFlash); gCol = lerp(gCol, 255, whiteFlash); bCol = lerp(bCol, 255, whiteFlash);
              }
              plotCell(proj.col, proj.row, proj.depth - 0.005, pt.letter, rgbStr(rCol, gCol, bCol), 2, whiteFlash * 0.9 + (pt.isSnow ? 0.2 : 0));
            });
          }

          if (p4Garland > 0) {
            const activeCount = Math.floor(p4Garland * garlandBulbs.length);
            for (let i = 0; i < activeCount; i++) {
              const bulb = garlandBulbs[i];
              const proj = projectPoint(bulb.x, bulb.y, bulb.z, rotationY, cx, cy, scale);
              if (!proj) continue;
              const twinkle = 0.72 + 0.28 * Math.sin(elapsed * 5.2 + bulb.phase);
              plotCell(proj.col, proj.row, proj.depth - 0.03, twinkle > 0.88 ? '✦' : '•', rgbStr(255, lerp(185, 238, twinkle), lerp(45, 145, twinkle), proj.rz >= -0.15 ? 1 : 0.45), 2, twinkle * 0.95);
            }
          }

          if (p4Ornaments > 0) {
            const visibleOrnaments = Math.floor(p4Ornaments * (ornaments.length + 0.99));
            for (let i = 0; i < Math.min(visibleOrnaments, ornaments.length); i++) {
              const orn = ornaments[i];
              const popScale = easeOutBack(clamp((p4Ornaments * ornaments.length) - i, 0, 1));
              if (popScale <= 0.05) continue;
              const proj = projectPoint(orn.x, orn.y, orn.z, rotationY, cx, cy, scale);
              if (!proj) continue;
              const shine = 0.8 + 0.2 * Math.sin(elapsed * 3.5 + i);
              const color = orn.color === 'red' ? rgbStr(255, 58 * shine, 78 * shine) : rgbStr(255, 215 * shine, 64 * shine);
              plotCell(proj.col, proj.row, proj.depth - 0.04, '@', color, 2, 0.85);
              if (popScale > 0.65) {
                plotCell(proj.col + 1, proj.row, proj.depth - 0.038, ')', color, 1, 0.5);
                plotCell(proj.col - 1, proj.row, proj.depth - 0.038, '(', color, 1, 0.5);
              }
            }
          }

          if (p5Star > 0) {
            const starProj = projectPoint(0, 1.29, 0, rotationY, cx, cy, scale);
            if (starProj) {
              const sx = starProj.col * cellW3 + cellW3 * 0.5;
              const sy = starProj.row * cellH3 + cellH3 * 0.5;
              const pulse = 0.88 + 0.12 * Math.sin(elapsed * 4.2);
              const beamRadius = scale * (0.48 + 0.06 * Math.sin(elapsed * 2.5)) * p5Star;
              ctx3d.save();
              const starGlow = ctx3d.createRadialGradient(sx, sy, 2, sx, sy, beamRadius);
              starGlow.addColorStop(0, `rgba(255, 248, 190, ${0.55 * p5Star})`);
              starGlow.addColorStop(0.28, `rgba(255, 210, 85, ${0.24 * p5Star})`);
              starGlow.addColorStop(0.65, `rgba(255, 185, 55, ${0.07 * p5Star})`);
              starGlow.addColorStop(1, 'rgba(255, 185, 55, 0)');
              ctx3d.fillStyle = starGlow;
              ctx3d.beginPath();
              ctx3d.arc(sx, sy, beamRadius, 0, Math.PI * 2);
              ctx3d.fill();
              ctx3d.translate(sx, sy);
              ctx3d.rotate(Math.sin(elapsed * 0.8) * 0.08);
              const rayLen = beamRadius * 1.25;
              const rayGrad = ctx3d.createLinearGradient(-rayLen, 0, rayLen, 0);
              rayGrad.addColorStop(0, 'rgba(255, 235, 140, 0)');
              rayGrad.addColorStop(0.5, `rgba(255, 242, 175, ${0.28 * p5Star * pulse})`);
              rayGrad.addColorStop(1, 'rgba(255, 235, 140, 0)');
              ctx3d.fillStyle = rayGrad;
              ctx3d.fillRect(-rayLen, -2.5, rayLen * 2, 5);
              ctx3d.rotate(Math.PI / 2);
              ctx3d.fillRect(-rayLen * 0.85, -2.5, rayLen * 1.7, 5);
              ctx3d.restore();
            }
            const starRot = rotationY * 1.35;
            starPoints.forEach((sp) => {
              const proj = projectPoint(sp.x, sp.y, sp.z, starRot, cx, cy, scale);
              if (!proj) return;
              plotCell(proj.col, proj.row, proj.depth - 0.06, sp.ch, sp.core ? '#fffbeb' : '#fde047', 2, 1.0);
            });
          }

          if (p6Gifts > 0) {
            const totalBoxes = giftBoxes.length;
            giftBoxes.forEach((box, idx) => {
              const boxStart = idx / totalBoxes;
              if (p6Gifts <= boxStart) return;
              const boxProgress = clamp((p6Gifts - boxStart) * totalBoxes, 0, 1);
              const bounce = easeOutBack(boxProgress);
              const dropY = (1 - clamp(boxProgress * 1.4, 0, 1)) * 0.25;
              const bx = Math.cos(box.orbitAngle) * box.orbitDist;
              const bz = Math.sin(box.orbitAngle) * box.orbitDist;
              const by = -1.24 + dropY;
              const cosLocal = Math.cos(box.localRotY);
              const sinLocal = Math.sin(box.localRotY);
              const totalRot = rotationY + box.localRotY;
              const cosTotal = Math.cos(totalRot);
              const sinTotal = Math.sin(totalRot);

              box.voxels.forEach((v) => {
                const sx = v.lx * bounce, sy = v.ly * bounce, sz = v.lz * bounce;
                const proj = projectPoint(bx + (sx * cosLocal - sz * sinLocal), by + sy, bz + (sx * sinLocal + sz * cosLocal), rotationY, cx, cy, scale);
                if (!proj) return;
                let color;
                if (v.isBow) color = box.bowColor;
                else if (v.isRibbon) color = box.ribbonColor;
                else {
                  const ndotl = dot3({ x: v.fnx * cosTotal - v.fnz * sinTotal, y: v.fny, z: v.fnx * sinTotal + v.fnz * cosTotal }, lightDir);
                  color = ndotl > 0.25 ? box.boxPalette[0] : (ndotl > -0.25 ? box.boxPalette[1] : box.boxPalette[2]);
                }
                plotCell(proj.col, proj.row, proj.depth - 0.01, v.ch, color, 2, v.isBow ? 0.7 : 0.15);
              });
            });
          }

          ctx3d.textAlign = 'center';
          ctx3d.textBaseline = 'middle';
          const fontNormal = `500 ${Math.round(cellH3 * 0.88)}px "JetBrains Mono", monospace`;
          const fontBold = `800 ${Math.round(cellH3 * 0.96)}px "JetBrains Mono", monospace`;
          let currentFont = '';
          for (let r = 0; r < rows3; r++) {
            const py = r * cellH3 + cellH3 * 0.5;
            const rowOffset = r * cols3;
            for (let c = 0; c < cols3; c++) {
              const idx = rowOffset + c;
              const ch = charBuffer[idx];
              if (!ch) continue;
              const desiredFont = weightBuffer[idx] >= 1 ? fontBold : fontNormal;
              if (currentFont !== desiredFont) {
                ctx3d.font = desiredFont;
                currentFont = desiredFont;
              }
              const glow = glowBuffer[idx];
              if (glow > 0.35) {
                ctx3d.shadowColor = colorBuffer[idx];
                ctx3d.shadowBlur = glow * 9;
              } else if (ctx3d.shadowBlur !== 0) {
                ctx3d.shadowBlur = 0;
              }
              ctx3d.fillStyle = colorBuffer[idx];
              ctx3d.fillText(ch, c * cellW3 + cellW3 * 0.5, py);
            }
          }
          ctx3d.shadowBlur = 0;

          updateAndDrawSnowLayer(1, dt, elapsed, cx, cy, scale * 0.34, 1);
          updateAndDrawSnowLayer(2, dt, elapsed, cx, cy, scale * 0.34, 1);

          if (p7TextProgress > 0) {
            drawTypedBanner(p7TextProgress, elapsed, cx, h3);
          }

          raf3dId = requestAnimationFrame(render3d);
        }

        targetCanvas.addEventListener('pointerdown', (e) => {
          if (!isRunning) return;
          isDragging = true;
          lastPointerX = e.clientX;
          userVelocityY = 0;
        });
        window.addEventListener('pointermove', (e) => {
          if (!isRunning || !isDragging) return;
          const dx = e.clientX - lastPointerX;
          lastPointerX = e.clientX;
          const deltaRot = (dx / Math.max(w3, 320)) * Math.PI * 2.2;
          rotationY += deltaRot;
          userVelocityY = deltaRot * 24;
        }, { passive: true });
        window.addEventListener('pointerup', () => { isDragging = false; });
        window.addEventListener('pointercancel', () => { isDragging = false; });

        buildSceneGeometry();

        return {
          start() {
            resize3d();
            startTime3d = performance.now();
            lastFrameTime3d = startTime3d;
            rotationY = 0;
            userVelocityY = 0;
            isRunning = true;
            if (raf3dId) cancelAnimationFrame(raf3dId);
            raf3dId = requestAnimationFrame(render3d);
          },
          stop() {
            isRunning = false;
            if (raf3dId) {
              cancelAnimationFrame(raf3dId);
              raf3dId = null;
            }
          },
          replay() {
            startTime3d = performance.now();
            lastFrameTime3d = startTime3d;
            rotationY = 0;
            userVelocityY = 0;
          },
          resize() {
            resize3d();
          }
        };
      }

      const tree3dEngine = createTree3DEngine(canvas3d);

      // =========================================================================
      // MOTOR DE ÁUDIO NATALINO PROCEDURAL (MÚSICA 2D, EFEITO 3D E ESTRELA)
      // =========================================================================
      const NatalAudio = (() => {
        let audioEnabled = true;
        let masterGain = null;
        let warmFilter = null;
        let bellNoiseBuf = null;
        let loopTimer = null;
        let loopStep = 0;
        let nextNoteTime = 0;
        let activeTrack = 'none'; // 'none' | '2d' | '3d-loop'
        let formationTimers = [];
        let gestureUnlocked = false;

        // Frequências musicais (Hz)
        const N = {
          C3: 130.81, D3: 146.83, E3: 164.81, F3: 174.61, G3: 196.0, A3: 220.0, B3: 246.94,
          C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23, Fs4: 369.99, G4: 392.0, Ab4: 415.3, A4: 440.0, Bb4: 466.16, B4: 493.88,
          C5: 523.25, D5: 587.33, E5: 659.25, F5: 698.46, Fs5: 739.99, G5: 783.99, A5: 880.0, B5: 987.77,
          C6: 1046.5, D6: 1174.66, E6: 1318.51, G6: 1567.98
        };

        function ensureCtx() {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (!AudioCtx) return null;
          if (!starAudioCtx) starAudioCtx = new AudioCtx();
          if (starAudioCtx.state === 'suspended') {
            starAudioCtx.resume().catch(() => { });
          }
          if (!masterGain) {
            masterGain = starAudioCtx.createGain();
            masterGain.gain.setValueAtTime(0.0001, starAudioCtx.currentTime);
            warmFilter = starAudioCtx.createBiquadFilter();
            warmFilter.type = 'lowpass';
            warmFilter.frequency.setValueAtTime(3400, starAudioCtx.currentTime);
            warmFilter.Q.setValueAtTime(0.6, starAudioCtx.currentTime);
            warmFilter.connect(masterGain);
            masterGain.connect(starAudioCtx.destination);
          }
          if (!bellNoiseBuf) {
            const len = Math.floor(starAudioCtx.sampleRate * 0.1);
            const buf = starAudioCtx.createBuffer(1, len, starAudioCtx.sampleRate);
            const data = buf.getChannelData(0);
            for (let i = 0; i < len; i++) {
              data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (len * 0.28));
            }
            bellNoiseBuf = buf;
          }
          return starAudioCtx;
        }

        function setMasterLevel(target, fadeSec = 0.45) {
          if (!starAudioCtx || !masterGain) return;
          const now = starAudioCtx.currentTime;
          masterGain.gain.cancelScheduledValues(now);
          masterGain.gain.setValueAtTime(Math.max(0.0001, masterGain.gain.value), now);
          masterGain.gain.linearRampToValueAtTime(Math.max(0.0001, target), now + fadeSec);
        }

        function playMusicBoxNote(freq, startTime, duration = 0.55, vol = 0.24) {
          if (!starAudioCtx || !warmFilter || !freq) return;
          const osc1 = starAudioCtx.createOscillator();
          const osc2 = starAudioCtx.createOscillator();
          const gain = starAudioCtx.createGain();

          osc1.type = 'sine';
          osc2.type = 'triangle';
          osc1.frequency.setValueAtTime(freq, startTime);
          osc2.frequency.setValueAtTime(freq * 2, startTime);

          const hGain = starAudioCtx.createGain();
          hGain.gain.setValueAtTime(0.18, startTime);

          gain.gain.setValueAtTime(0.0001, startTime);
          gain.gain.exponentialRampToValueAtTime(vol, startTime + 0.01);
          gain.gain.exponentialRampToValueAtTime(vol * 0.35, startTime + duration * 0.35);
          gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

          osc1.connect(gain);
          osc2.connect(hGain);
          hGain.connect(gain);
          gain.connect(warmFilter);

          osc1.start(startTime);
          osc2.start(startTime);
          osc1.stop(startTime + duration + 0.03);
          osc2.stop(startTime + duration + 0.03);
        }

        function playWarmPad(freqs, startTime, duration = 1.2, vol = 0.08) {
          if (!starAudioCtx || !warmFilter || !freqs || freqs.length === 0) return;
          const perVoice = vol / Math.sqrt(freqs.length);
          freqs.forEach((f) => {
            const osc = starAudioCtx.createOscillator();
            const g = starAudioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(f, startTime);
            g.gain.setValueAtTime(0.0001, startTime);
            g.gain.linearRampToValueAtTime(perVoice, startTime + Math.min(0.22, duration * 0.25));
            g.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);
            osc.connect(g);
            g.connect(warmFilter);
            osc.start(startTime);
            osc.stop(startTime + duration + 0.04);
          });
        }

        function playSleighBell(startTime, vol = 0.08) {
          if (!starAudioCtx || !warmFilter || !bellNoiseBuf) return;
          const src = starAudioCtx.createBufferSource();
          src.buffer = bellNoiseBuf;
          const hp = starAudioCtx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.setValueAtTime(4200, startTime);
          const nGain = starAudioCtx.createGain();
          nGain.gain.setValueAtTime(vol, startTime);
          nGain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.09);
          src.connect(hp);
          hp.connect(nGain);
