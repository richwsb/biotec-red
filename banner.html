<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0d080c" />
    <title>Biotecnologia Vermelha • Banner 3D Interativo (UFPA)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%237a0000'/><path d='M9 7c5 0 5 18 14 18M9 25c5 0 5-18 14-18' stroke='%23fda4af' stroke-width='2.4' fill='none' stroke-linecap='round'/></svg>" />

    <!-- Tailwind CSS para interface responsiva moderna -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonte Inter + Montserrat (usada no Canvas2D) + JetBrains Mono para telemetria -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Montserrat:wght@600;700;800;900&display=swap"
        rel="stylesheet" />

    <!-- Import Map para Three.js e OrbitControls via jsDelivr -->
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

    <style>
        :root {
            color-scheme: dark;
            --crimson: #7a0000;
            --crimson-bright: #a60d14;
            --glass-bg: rgba(15, 9, 13, 0.82);
            --glass-border: rgba(255, 210, 215, 0.16);
            --focus-ring: #fda4af;
            --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        ::selection {
            background: #a60d14;
            color: #ffffff;
        }

        :focus-visible {
            outline: 2px solid var(--focus-ring);
            outline-offset: 2px;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0d080c;
            user-select: none;
        }

        #canvas-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            height: 100dvh;
            touch-action: none;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* Glassmorphism temático da Biotecnologia Vermelha */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* Slider customizado de enrolamento */
        input[type="range"].roll-slider {
            -webkit-appearance: none;
            appearance: none;
            height: 6px;
            border-radius: 9999px;
            background: rgba(255, 255, 255, 0.22);
            outline: none;
        }

        input[type="range"].roll-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 9999px;
            background: #ffffff;
            border: 3px solid #9e0b0f;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            transition: transform 0.15s ease;
        }

        input[type="range"].roll-slider::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }

        input[type="range"].roll-slider::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 9999px;
            background: #ffffff;
            border: 3px solid #9e0b0f;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* Scrollbar discreta no menu de seções */
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }

        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }

        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.22);
            border-radius: 9999px;
        }

        .nav-btn {
            transition: background-color 0.2s var(--ease-out), border-color 0.2s var(--ease-out), transform 0.16s var(--ease-out), box-shadow 0.2s var(--ease-out);
        }

        @media (hover: hover) and (pointer: fine) {
            .nav-btn:hover:not(.active) {
                background: rgba(255, 255, 255, 0.12);
                border-color: rgba(255, 210, 215, 0.26);
                transform: translateY(-1px);
            }
        }

        .nav-btn:active {
            transform: scale(0.985);
        }

        .nav-btn.active {
            background: linear-gradient(135deg, #8b0000 0%, #b31217 100%);
            border-color: rgba(255, 200, 200, 0.5);
            color: #ffffff;
            box-shadow: 0 4px 14px rgba(139, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.16);
        }

        /* HUD Inferior do Banner adaptado para zero colisão com o .eco-dock fixo */
        #banner-bottom-bar {
            position: absolute;
            bottom: calc(16px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
            width: min(540px, calc(100vw - 560px));
        }

        #context-pill {
            bottom: calc(86px + env(safe-area-inset-bottom, 0px));
            left: 50%;
            transform: translateX(-50%);
        }

        @media (max-width: 1080px) {
            #banner-bottom-bar {
                left: calc(16px + env(safe-area-inset-left, 0px));
                right: auto;
                transform: none;
                width: calc(100vw - 285px);
                max-width: 540px;
            }
        }

        @media (max-width: 640px) {
            #banner-bottom-bar {
                bottom: calc(68px + env(safe-area-inset-bottom, 0px));
                left: 10px;
                right: 10px;
                width: auto;
                max-width: none;
                transform: none;
            }

            #context-pill {
                bottom: calc(144px + env(safe-area-inset-bottom, 0px));
                max-width: calc(100vw - 20px);
            }

            #btn-toggle-roll,
            #btn-reset-view,
            #btn-toggle-menu,
            #btn-replay-intro,
            #btn-skip-intro,
            .nav-btn {
                min-height: 40px;
            }
        }

        @media (pointer: coarse) {
            #btn-toggle-roll,
            #btn-reset-view,
            #btn-toggle-menu,
            #btn-replay-intro,
            #btn-skip-intro,
            .nav-btn {
                min-height: 44px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        @keyframes pulseSoft {

            0%,
            100% {
                opacity: 0.78;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.03);
            }
        }

        .pulse-soft {
            animation: pulseSoft 2s infinite ease-in-out;
        }
    </style>
</head>

<body>
    <!-- Container do WebGL / Three.js -->
    <div id="canvas-container"></div>

    <!-- Overlay Cinematográfico da Introdução -->
    <div id="intro-overlay"
        class="fixed inset-0 pointer-events-none z-30 flex flex-col justify-between p-3 sm:p-6 transition-opacity duration-700">
        <!-- Topo da Intro -->
        <div class="flex items-start justify-between gap-2 sm:gap-3">
            <div class="glass-panel rounded-2xl px-3 py-2 sm:px-4 sm:py-2.5 text-white max-w-[calc(100vw-130px)] sm:max-w-md min-w-0">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 sm:w-2.5 sm:h-2.5 rounded-full bg-red-500 animate-pulse shrink-0"></span>
                    <span class="text-[10px] sm:text-[11px] font-bold tracking-wider sm:tracking-widest uppercase text-red-300 truncate">UFPA • Extensão
                        Biotecnologia Vermelha</span>
                </div>
                <div id="intro-phase-title" class="text-xs sm:text-base font-bold mt-0.5 text-white truncate">
                    Pareamento Molecular de Nucleotídeos
                </div>
            </div>

            <button id="btn-skip-intro"
                class="pointer-events-auto glass-panel hover:bg-red-900/75 text-white text-xs sm:text-sm font-semibold px-3 py-2 sm:px-4 sm:py-2.5 rounded-xl transition flex items-center gap-1.5 sm:gap-2 cursor-pointer shrink-0">
                <span>Pular</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7" />
                </svg>
            </button>
        </div>

        <!-- Barra de progresso sutil da intro -->
        <div class="flex flex-col items-center mb-[72px] sm:mb-10">
            <div class="w-56 sm:w-72 h-1 bg-white/15 rounded-full overflow-hidden mt-3">
                <div id="intro-progress-bar"
                    class="h-full bg-gradient-to-r from-red-600 via-rose-400 to-white transition-all duration-75"
                    style="width: 0%;"></div>
            </div>
        </div>
    </div>

    <!-- Interface Principal Interativa (oculta suavemente durante a intro) -->
    <div id="main-ui" class="fixed inset-0 pointer-events-none z-20 opacity-0 transition-opacity duration-700">

        <!-- Barra Superior -->
        <div class="absolute top-3 left-3 right-3 sm:top-4 sm:left-4 sm:right-4 flex items-start justify-between gap-2">
            <!-- Identificação e Botão de Menu -->
            <div class="flex items-center gap-2 pointer-events-auto">
                <button id="btn-toggle-menu" title="Abrir/Recolher Menu de Seções"
                    class="glass-panel hover:bg-red-950/80 text-white p-2.5 sm:px-3.5 sm:py-2.5 rounded-xl flex items-center gap-2 transition cursor-pointer">
                    <svg id="icon-menu" class="w-5 h-5 text-red-300" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10" />
                    </svg>
                    <span class="text-xs sm:text-sm font-semibold hidden sm:inline">Seções do Banner</span>
                </button>

                <div class="glass-panel rounded-xl px-3.5 py-2 text-white hidden md:block">
                    <div class="text-xs font-extrabold tracking-wide text-white leading-tight [text-wrap:balance]">BIOTECNOLOGIA VERMELHA •
                        UFPA</div>
                    <div class="text-[11px] text-rose-100/75 leading-tight mt-0.5">Arraste para girar 360° • Scroll/Pinça
                        para aproximar</div>
                </div>
            </div>

            <!-- Ações Rápidas (Rever Intro + Upload de Imagem Própria) -->
            <div class="flex items-center gap-1.5 sm:gap-2 pointer-events-auto flex-wrap justify-end">
                <button id="btn-replay-intro"
                    class="glass-panel hover:bg-red-900/75 text-white text-xs font-semibold px-2.5 py-2 sm:px-3 sm:py-2.5 rounded-xl flex items-center gap-1.5 transition cursor-pointer"
                    title="Rever animação cinematográfica de DNA e montagem do tripé">
                    <svg class="w-4 h-4 text-rose-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    <span class="hidden sm:inline">Rever Intro</span>
                    <span class="sm:hidden">Intro</span>
                </button>

                <label for="input-custom-image"
                    class="glass-panel hover:bg-white/15 text-gray-100 text-xs font-medium px-2.5 py-2 sm:px-3 sm:py-2.5 rounded-xl flex items-center gap-1.5 transition cursor-pointer"
                    title="Carregar sua imagem original (.JPG ou .PNG) na lona do banner 3D">
                    <svg class="w-4 h-4 text-gray-300 shrink-0" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round"
                            d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
                    </svg>
                    <span class="hidden sm:inline">Usar imagem própria .JPG/.PNG</span>
                    <span class="sm:hidden">Imagem</span>
                </label>
                <input id="input-custom-image" type="file" accept="image/jpeg,image/png,image/webp" class="hidden" />

                <button id="btn-reset-texture"
                    class="hidden glass-panel hover:bg-red-900/75 text-rose-200 text-xs font-semibold px-2.5 py-2 sm:px-3 sm:py-2.5 rounded-xl transition cursor-pointer"
                    title="Restaurar textura vetorial fiel em alta definição">
                    Padrão HD
                </button>
            </div>
        </div>

        <!-- Painel Lateral Recolhível de Navegação por Seções -->
        <aside id="sections-drawer"
            class="pointer-events-auto absolute top-16 sm:top-20 left-3 sm:left-4 w-[min(17.5rem,calc(100vw-1.5rem))] max-h-[calc(100dvh-11.5rem)] glass-panel rounded-2xl p-3 text-white flex flex-col transition-all duration-300 origin-top-left">
            <div class="flex items-center justify-between px-1 pb-2 mb-2 border-b border-white/10">
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-wider text-rose-300 [text-wrap:balance]">Focar Seção</h2>
                    <p class="text-[11px] text-rose-100/75 [text-wrap:pretty]">Clique para aproximar com nitidez</p>
                </div>
                <button id="btn-close-drawer"
                    class="p-1.5 rounded-lg hover:bg-white/10 text-rose-100/80 hover:text-white transition cursor-pointer"
                    title="Recolher menu" aria-label="Recolher menu">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <div id="section-buttons" class="flex flex-col gap-1.5 overflow-y-auto custom-scroll pr-1">
                <!-- Botões preenchidos dinamicamente via JS -->
            </div>
        </aside>

        <!-- Dica Contextual (ex: atalho para o card de Aplicações quando em Diagnóstico Molecular) -->
        <div id="context-pill"
            class="pointer-events-auto hidden absolute glass-panel rounded-full px-4 py-2 text-white text-xs font-semibold flex items-center gap-2.5 border border-rose-400/40 shadow-lg">
            <span id="context-pill-text" class="text-gray-200">Continuação na coluna direita:</span>
            <button id="btn-jump-aplicacoes"
                class="bg-red-800 hover:bg-red-700 text-white px-3 py-1 rounded-full transition flex items-center gap-1 cursor-pointer">
                <span id="context-pill-btn-label">Ver Card: Aplicações ↗</span>
            </button>
        </div>

        <!-- Barra Inferior: Enrolar / Desenrolar + Slider Contínuo -->
        <div id="banner-bottom-bar"
            class="pointer-events-auto glass-panel rounded-2xl px-2.5 py-2 sm:px-4 sm:py-3 text-white flex items-center gap-2 sm:gap-3">
            <button id="btn-toggle-roll"
                class="shrink-0 bg-gradient-to-r from-[#7a0000] to-[#a60d14] hover:from-[#8f0000] hover:to-[#bd131b] text-white text-[11px] sm:text-sm font-bold px-2.5 py-2 sm:px-3.5 rounded-xl shadow-md transition flex items-center gap-1.5 cursor-pointer">
                <svg id="icon-roll" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
                </svg>
                <span id="label-toggle-roll">Enrolar Banner</span>
            </button>

            <div class="flex-1 flex flex-col gap-1 min-w-0">
                <div class="flex items-center justify-between text-[11px] font-medium text-rose-50/90">
                    <span>Abertura da Lona</span>
                    <span id="roll-percent" class="font-mono font-bold text-rose-300 tabular-nums">100%</span>
                </div>
                <input id="slider-roll" type="range" min="0" max="100" step="0.5" value="100"
                    class="roll-slider w-full cursor-pointer" />
            </div>

            <button id="btn-reset-view" title="Visão Geral (Enquadrar Banner Completo)"
                class="shrink-0 p-2 rounded-xl bg-white/10 hover:bg-white/20 text-white transition cursor-pointer">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M3 10h4V6m0 0l-3 3m17 5h-4v4m0 0l3-3M21 10V6h-4m-14 8v4h4" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Toast de Notificação Discreta (substitui qualquer alert) -->
    <div id="toast-box"
        class="fixed top-16 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 transition-all duration-300 translate-y-[-8px]">
        <div id="toast-content"
            class="glass-panel rounded-xl px-4 py-2.5 text-white text-xs sm:text-sm font-medium border border-rose-400/40">
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // =========================================================================
        // 1. CONSTANTES FÍSICAS E GEOMÉTRICAS DO BANNER E DO TRIPÉ (em metros)
        // =========================================================================
        const CANVAS_W = 1600;
        const CANVAS_H = 2133;

        // Proporção real 3:4 (equivalente a um banner universitário 90x120 cm)
        const BANNER_W = 0.90;
        const BANNER_H = 1.20;
        const BANNER_TOP_Y = 1.88;        // Altura da borda superior da lona
        const BANNER_Z = 0.068;           // Avanço frontal em relação ao eixo central do tripé (z = 0)
        const TRIPOD_TOP_Y = 2.04;        // Altura do gancho superior do tripé

        // Parâmetros da espiral de Arquimedes para o enrolamento realista
        const ROLL_R0 = 0.0145;           // Raio inicial sobre o bastão inferior
        const ROLL_LAYER_THICKNESS = 0.0042; // Espessura por volta da lona
        const ROLL_B = ROLL_LAYER_THICKNESS / (2 * Math.PI);
        const BACK_LAYER_OFFSET = 0.00085; // Separação mínima entre frente e verso (evita z-fighting)

        // Sequência exata dos 8 pares de bases do banner (da esquerda para a direita)
        const DNA_SEQUENCE = [
            { top: 'G', bottom: 'C', bonds: 3, desc: 'Guanina — Citosina • 3 pontes de hidrogênio' },
            { top: 'T', bottom: 'A', bonds: 2, desc: 'Timina — Adenina • 2 pontes de hidrogênio' },
            { top: 'G', bottom: 'C', bonds: 3, desc: 'Guanina — Citosina • 3 pontes de hidrogênio' },
            { top: 'C', bottom: 'G', bonds: 3, desc: 'Citosina — Guanina • 3 pontes de hidrogênio' },
            { top: 'T', bottom: 'A', bonds: 2, desc: 'Timina — Adenina • 2 pontes de hidrogênio' },
            { top: 'G', bottom: 'C', bonds: 3, desc: 'Guanina — Citosina • 3 pontes de hidrogênio' },
            { top: 'A', bottom: 'T', bonds: 2, desc: 'Adenina — Timina • 2 pontes de hidrogênio' },
            { top: 'A', bottom: 'T', bonds: 2, desc: 'Adenina — Timina • 2 pontes de hidrogênio' }
        ];

        // Metadados das seções (retângulos preenchidos automaticamente durante o desenho do Canvas2D)
        const SECTION_RECTS = {};

        const SECTIONS_MENU = [
            {
                id: 'geral',
                label: 'Visão Geral',
                sub: 'Banner completo + tripé',
                icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>'
            },
            {
                id: 'tema',
                label: 'Tema',
                sub: 'UFPA • Biotecnologia Vermelha',
                icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M4 18h16M6 18V9M10 18V9M14 18V9M18 18V9M12 3l9 5H3l9-5z"/></svg>'
            },
            {
                id: 'autores',
                label: 'Autores',
                sub: 'Equipe de extensão (6 autores)',
                icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>'
            },
            {
                id: 'introducao',
                label: 'Introdução',
                sub: 'Conceito e aplicações gerais',
                icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>'
            },
            {
                id: 'dna',
                label: 'DNA: A Molécula da Vida',
                sub: 'Estrutura + diagrama de 8 bases',
                icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 5c4 0 4 14 8 14s4-14 8-14"/><path d="M4 19c4 0 4-14 8-14s4 14 8 14"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="15" x2="17" y2="15"/></svg>'
            },
            {
                id: 'molecular',
                label: 'Diagnóstico Molecular',
                sub: 'Alterações genéticas e patógenos',
                icon: '<svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h8"/><path d="M3 22h18"/><path d="M14 22a7 7 0 1 0 0-14h-1"/><path d="M9 14h2"/><path d="M9 12a2 2 0 0 1-2-2V6h6v4a2 2 0 0 1-2 2Z"/><path d="M12 6V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v3"/></svg>'
            },
            {

        function clamp(v, min, max) {
            return Math.max(min, Math.min(max, v));
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function smoothstep(edge0, edge1, x) {
            const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
            return t * t * (3 - 2 * t);
        }

        function easeOutCubic(t) {
            return 1 - Math.pow(1 - clamp(t, 0, 1), 3);
        }

        function easeInOutCubic(t) {
            const c = clamp(t, 0, 1);
            return c < 0.5 ? 4 * c * c * c : 1 - Math.pow(-2 * c + 2, 3) / 2;
        }

        // =========================================================================
        // 4. GERADOR DE TEXTURA CANVAS2D DE ALTA DEFINIÇÃO (1600 x 2133 px)
        // =========================================================================
        function drawRoundedRect(ctx, x, y, w, h, r) {
            const radius = Math.min(r, w / 2, h / 2);
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + w - radius, y);
            ctx.quadraticCurveTo(x + w, y, x + w, y + radius);
            ctx.lineTo(x + w, y + h - radius);
            ctx.quadraticCurveTo(x + w, y + h, x + w - radius, y + h);
            ctx.lineTo(x + radius, y + h);
            ctx.quadraticCurveTo(x, y + h, x, y + h - radius);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
        }

        // Quebra de linha precisa para textos em português
        function drawWrappedText(ctx, text, x, y, maxWidth, lineHeight, align = 'left') {
            ctx.textAlign = align;
            const words = text.split(' ');
            let line = '';
            let currY = y;

            for (let i = 0; i < words.length; i++) {
                const testLine = line ? line + ' ' + words[i] : words[i];
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && line !== '') {
                    ctx.fillText(line, x, currY);
                    line = words[i];
                    currY += lineHeight;
                } else {
                    line = testLine;
                }
            }
            if (line) {
                ctx.fillText(line, x, currY);
                currY += lineHeight;
            }
            return currY;
        }

        // Selo circular azul/turquesa da FABIOTEC no canto superior direito
        function drawFabiotecSeal(ctx, cx, cy) {
            ctx.save();
            ctx.translate(cx, cy);

            // Anel externo com gradiente azul/turquesa
            const grad = ctx.createLinearGradient(-56, -56, 56, 56);
            grad.addColorStop(0, '#0a3d62');
            grad.addColorStop(0.5, '#1b7fa8');
            grad.addColorStop(1, '#32b6c9');

            ctx.beginPath();
            ctx.arc(0, 0, 56, 0, Math.PI * 2);
            ctx.strokeStyle = grad;
            ctx.lineWidth = 9;
            ctx.stroke();

            // Anel tracejado/molecular externo fino
            ctx.beginPath();
            ctx.arc(0, 0, 63, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(27, 127, 168, 0.35)';
            ctx.lineWidth = 2;
            ctx.setLineDash([7, 5]);
            ctx.stroke();
            ctx.setLineDash([]);

            // Fundo interno suave
            const innerGrad = ctx.createRadialGradient(-10, -10, 6, 0, 0, 48);
            innerGrad.addColorStop(0, '#eef9fc');
            innerGrad.addColorStop(1, '#cdeaf4');
            ctx.beginPath();
            ctx.arc(0, 0, 47, 0, Math.PI * 2);
            ctx.fillStyle = innerGrad;
            ctx.fill();

            // Dupla hélice estilizada no interior do selo
            ctx.save();
            ctx.rotate(-0.42);
            for (let i = -30; i <= 30; i += 8) {
                const phase = i * 0.12;
                const x1 = Math.sin(phase) * 16;
                const x2 = -Math.sin(phase) * 16;
                ctx.strokeStyle = '#177e9f';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(x1, i);
                ctx.lineTo(x2, i);
                ctx.stroke();
            }
            ctx.lineWidth = 4.5;
            ctx.strokeStyle = '#0e4d7a';
            ctx.beginPath();
            for (let i = -34; i <= 34; i += 2) {
                const x = Math.sin(i * 0.12) * 16;
                if (i === -34) ctx.moveTo(x, i); else ctx.lineTo(x, i);
            }
            ctx.stroke();

            ctx.strokeStyle = '#25a5be';
            ctx.beginPath();
            for (let i = -34; i <= 34; i += 2) {
                const x = -Math.sin(i * 0.12) * 16;
                if (i === -34) ctx.moveTo(x, i); else ctx.lineTo(x, i);
            }
            ctx.stroke();
            ctx.restore();

            // Nó molecular no topo e laterais
            const dots = [[-56, 0], [56, 0], [0, -56], [40, -40], [-40, 40]];
            ctx.fillStyle = '#0f5c85';
            dots.forEach(([dx, dy]) => {
                ctx.beginPath();
                ctx.arc(dx, dy, 4.5, 0, Math.PI * 2);
                ctx.fill();
            });

            // Texto FABIOTEC abaixo do selo
            ctx.fillStyle = '#111111';
            ctx.font = '800 20px "Montserrat", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('FABIOTEC', 0, 82);

            ctx.fillStyle = '#333333';
            ctx.font = '600 8.5px "Inter", sans-serif';
            ctx.fillText('FACULDADE DE BIOTECNOLOGIA', 0, 94);
            ctx.fillText('E ENGENHARIA DE BIOPROCESSOS', 0, 104);

            ctx.restore();
        }

        // Marca d'água sutil de dupla hélice e textura geométrica no fundo do banner

            ctx.lineTo(0, 620);

            // Marca d'água de dupla hélice no lado esquerdo inferior (fiel à imagem original)

            ctx.rotate(0.28);
            ctx.strokeStyle = 'rgba(130, 142, 162, 0.14)';
            ctx.lineWidth = 10;
            for (let y = -480; y <= 540; y += 34) {
                const x1 = Math.sin(y * 0.011) * 145;
                const x2 = -Math.sin(y * 0.011) * 145;
                ctx.beginPath();
                ctx.moveTo(x1, y);
                ctx.lineTo(x2, y);
                ctx.stroke();
            }
            ctx.lineWidth = 18;
            ctx.strokeStyle = 'rgba(130, 142, 162, 0.16)';
            ctx.beginPath();
            for (let y = -500; y <= 560; y += 6) {
                const x = Math.sin(y * 0.011) * 145;
                if (y === -500) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.beginPath();
            for (let y = -500; y <= 560; y += 6) {
                const x = -Math.sin(y * 0.011) * 145;
                if (y === -500) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.stroke();
            ctx.restore();

            // Marca d'água sutil de hexágonos moleculares no canto superior direito
            ctx.strokeStyle = 'rgba(140, 145, 155, 0.08)';
            ctx.lineWidth = 3;
            const hexCenters = [[1240, 720], [1340, 778], [1340, 894], [1440, 720]];
            hexCenters.forEach(([hx, hy]) => {
                ctx.beginPath();
                for (let k = 0; k < 6; k++) {
                    const ang = (Math.PI / 3) * k - Math.PI / 6;
                    const px = hx + Math.cos(ang) * 56;
                    const py = hy + Math.sin(ang) * 56;
                    if (k === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                }
                ctx.closePath();
                ctx.stroke();
            });

            ctx.restore();
        }

        // Esquema horizontal das 8 bases nitrogenadas do DNA (encaixes complementares exatos)
        function drawHorizontalDNADiagram(ctx, startX, startY, totalW, totalH) {
            ctx.save();
            const strandH = 30;
            const topStrandY = startY;
            const botStrandY = startY + totalH - strandH;
            const innerTop = topStrandY + strandH;
            const innerBot = botStrandY;
            const midY = (innerTop + innerBot) / 2;

            // Cores exatas conforme o banner original
            const BASE_COLORS = {
                G: { fill: '#f8d8d8', text: '#141414' }, // Guanina (claro/rosado)
                C: { fill: '#eb5e58', text: '#141414' }, // Citosina (coral)
                T: { fill: '#f5f0dc', text: '#141414' }, // Timina (creme/branco)
                A: { fill: '#9c090e', text: '#141414' }  // Adenina (bordô)
            };

            const pairCount = DNA_SEQUENCE.length; // 8 pares
            const padX = 36;
            const usableW = totalW - padX * 2;
            const colStep = usableW / pairCount;
            const barW = 46;
            const gap = 8; // pequeno espaçamento visual entre o encaixe superior e inferior

            // Desenha cada um dos 8 pares verticais
            DNA_SEQUENCE.forEach((pair, idx) => {
                const cx = startX + padX + colStep * (idx + 0.5);
                const left = cx - barW / 2;
                const right = cx + barW / 2;

                const isGC = (pair.top === 'G' || pair.top === 'C');

                // Helper para desenhar uma metade de base (top ou bottom)
                const drawHalfBase = (letter, isTop) => {
                    const style = BASE_COLORS[letter];
                    ctx.fillStyle = style.fill;
                    ctx.strokeStyle = '#1f1f1f';
                    ctx.lineWidth = 3;

                    const baseY = isTop ? innerTop : innerBot;
                    const dir = isTop ? 1 : -1; // +1 aponta para baixo, -1 aponta para cima
                    const edgeY = midY - dir * (gap / 2);

                    // Regra de encaixe complementar fiel à imagem:
                    // G = ponta convexa arredondada; C = encaixe côncavo arredondado
                    // A = ponta convexa triangular (seta); T = encaixe côncavo triangular (V)
                    const tipDepth = 16;

                    ctx.beginPath();
                    ctx.moveTo(left, baseY);
                    ctx.lineTo(right, baseY);

                    if (isGC) {
                        const isConvex = (letter === 'G');
                        if (isConvex) {
                            // Convexa arredondada avança além de edgeY
                            ctx.lineTo(right, edgeY - dir * 5);
                            ctx.quadraticCurveTo(cx, edgeY + dir * (tipDepth + 8), left, edgeY - dir * 5);
                        } else {
                            // Côncava arredondada recua para dentro
                            ctx.lineTo(right, edgeY + dir * 7);
                            ctx.quadraticCurveTo(cx, edgeY - dir * (tipDepth + 2), left, edgeY + dir * 7);
                        }
                    } else {
                        const isConvex = (letter === 'A');
                        if (isConvex) {
                            // Seta triangular convexa
                            ctx.lineTo(right, edgeY - dir * 4);
                            ctx.lineTo(cx, edgeY + dir * tipDepth);
                            ctx.lineTo(left, edgeY - dir * 4);
                        } else {
                            // Recorte triangular côncavo (V)
                            ctx.lineTo(right, edgeY + dir * 8);
                            ctx.lineTo(cx, edgeY - dir * (tipDepth - 2));
                            ctx.lineTo(left, edgeY + dir * 8);
                        }
                    }
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke();

                    // Letra rotacionada -90° centralizada dentro do bloco
                    ctx.save();
                    const labelY = isTop ? (innerTop + midY) / 2 - 4 : (midY + innerBot) / 2 + 4;
                    ctx.translate(cx, labelY);
                    ctx.rotate(-Math.PI / 2);
                    ctx.fillStyle = style.text;
                    ctx.font = '700 24px "Montserrat", "Inter", sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(letter, 0, 1);
                    ctx.restore();
                };

                drawHalfBase(pair.top, true);
                drawHalfBase(pair.bottom, false);
            });

            // Fitas horizontais coral-vermelho (topo e base) desenhadas por cima para acabamento limpo
            ctx.fillStyle = '#e9564e';
            ctx.strokeStyle = '#1f1f1f';
            ctx.lineWidth = 3.2;

            ctx.fillRect(startX, topStrandY, totalW, strandH);
            ctx.strokeRect(startX, topStrandY, totalW, strandH);

            ctx.fillRect(startX, botStrandY, totalW, strandH);
            ctx.strokeRect(startX, botStrandY, totalW, strandH);

            ctx.restore();
        }

        // Constrói a textura fiel 1600x2133px e registra as coordenadas exatas de cada seção
        function createBannerCanvasTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = CANVAS_W;
            canvas.height = CANVAS_H;
            const ctx = canvas.getContext('2d');

            // 1. Fundo claro com textura e marca d'água DNA
            drawBackgroundWatermark(ctx);

            // 2. CABEÇALHO SUPERIOR (0..222px)
            drawUFPACrest(ctx, 126, 112);

            ctx.fillStyle = '#111111';
            ctx.font = '700 28px "Montserrat", "Inter", sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'alphabetic';

        // Textura sutil de trama vinílica para o verso realista do banner
        function createVinylBackTexture() {
            const c = document.createElement('canvas');
            c.width = 256;
            c.height = 256;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#e7e8eb';
            ctx.fillRect(0, 0, 256, 256);

            ctx.strokeStyle = 'rgba(180, 184, 192, 0.25)';
            ctx.lineWidth = 1;
            for (let i = 0; i < 256; i += 4) {
                ctx.beginPath();
                ctx.moveTo(i, 0); ctx.lineTo(i, 256);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(0, i); ctx.lineTo(256, i);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping;
            tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(8, 10);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // =========================================================================

        function buildStudioEnvironment() {
            // Domo de fundo com gradiente suave que muda entre modo científico escuro (intro) e estúdio claro
            const domeGeo = new THREE.SphereGeometry(28, 32, 24);
            studioBgMat = new THREE.ShaderMaterial({
                side: THREE.BackSide,
                depthWrite: false,
                uniforms: {
                    uTopColor: { value: new THREE.Color('#09050b') },
                    uHorizonColor: { value: new THREE.Color('#1c0910') },
                    uBottomColor: { value: new THREE.Color('#0b060a') }
                },
                vertexShader: `
          varying vec3 vWorldPos;
          void main() {
            vec4 wp = modelMatrix * vec4(position, 1.0);
            vWorldPos = wp.xyz;
            gl_Position = projectionMatrix * viewMatrix * wp;
          }
        `,
                fragmentShader: `
          uniform vec3 uTopColor;
          uniform vec3 uHorizonColor;
          uniform vec3 uBottomColor;
          varying vec3 vWorldPos;
          void main() {
            float h = normalize(vWorldPos).y;
            vec3 col = h >= 0.0
              ? mix(uHorizonColor, uTopColor, pow(h, 0.65))
              : mix(uHorizonColor, uBottomColor, pow(-h, 0.5));
            gl_FragColor = vec4(col, 1.0);
          }
        `
            });
            const dome = new THREE.Mesh(domeGeo, studioBgMat);

                // Pé emborrachado antiderrapante — filho direto de tripodGroup com rotação (0,0,0)
                // para manter a base perfeitamente horizontal e assentada em y = 0.000
                const footGroup = new THREE.Group();
                const footCone = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.013, 0.020, TRIPOD_FOOT_H, 18),
                    rubberMat
                );
                footCone.position.y = TRIPOD_FOOT_H * 0.5;
                footCone.castShadow = true;
                footCone.receiveShadow = true;

                const footSole = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.0205, 0.021, 0.004, 18),
                    matteBlackMat
                );
                footSole.position.y = 0.002;
                footSole.receiveShadow = true;

                const ankleJoint = new THREE.Mesh(
                    new THREE.SphereGeometry(0.0115, 14, 12),
                    chromeMetalMat
                );
                ankleJoint.position.y = TRIPOD_FOOT_H;

                footGroup.add(footCone, footSole, ankleJoint);
                tripodGroup.add(footGroup);

                // Haste estabilizadora (geometria unitária orientada por quaternion entre o hub e a perna)
                const strutBar = new THREE.Mesh(
                    new THREE.BoxGeometry(0.0085, 1, 0.0065),
                    darkMetalMat
                );
                strutBar.castShadow = true;
                tripodGroup.add(strutBar);

                const hubPin = new THREE.Mesh(new THREE.SphereGeometry(0.007, 10, 10), chromeMetalMat);
                const strutPin = new THREE.Mesh(new THREE.SphereGeometry(0.007, 10, 10), chromeMetalMat);
                tripodGroup.add(hubPin, strutPin);

                tripodLegs.push({ az, legTube, topHinge, legClamp, footGroup });
                tripodStruts.push({ az, strutBar, hubPin, strutPin });
            }

            // Configura estado inicial recolhido (para ser animado na Fase 2 da Intro)
            setTripodDeployment(0);
        }

        // Controla abertura simétrica das 3 pernas (120°) e extensão telescópica do tripé (t de 0 a 1)
        function setTripodDeployment(t) {
            const deploy = clamp(t, 0, 1);
            const eased = easeOutCubic(deploy);
            const legSpreadAngle = lerp(0.05, 0.72, eased); // ~41° aberto simetricamente

            // Altura do colar garante que os 3 pés toquem exatamente o solo (y = 0.000)
            const collarY = TRIPOD_FOOT_H + Math.cos(legSpreadAngle) * TRIPOD_LEG_LEN;
            tripodCollar.position.y = collarY;

            // Extensão telescópica da coluna central (sem esticar travas nem afundar abaixo do hub)
            const sec1Height = lerp(0.56, 0.76, eased);
            const sec1Top = 0.125 + sec1Height;
            tripodMastRig.sec1.scale.set(1, sec1Height, 1);
            tripodMastRig.sec1.position.y = 0.125 + sec1Height * 0.5;
            tripodMastRig.lock1.position.y = sec1Top;

            const sec2Top = sec1Top + lerp(0.02, 0.64, eased);
            const sec2Bottom = Math.max(0.14, sec2Top - 0.64);
            const sec2Len = Math.max(0.02, sec2Top - sec2Bottom);
            tripodMastRig.sec2.scale.set(1, sec2Len, 1);
            tripodMastRig.sec2.position.y = sec2Bottom + sec2Len * 0.5;
            tripodMastRig.lock2.position.y = sec2Top;

            const topHookY = lerp(0.74, TRIPOD_TOP_Y, eased);
            const sec3Bottom = Math.max(0.16, topHookY - 0.52);
            const sec3Len = Math.max(0.02, topHookY - sec3Bottom);
            tripodMastRig.sec3.scale.set(1, sec3Len, 1);
            tripodMastRig.sec3.position.y = sec3Bottom + sec3Len * 0.5;
            tripodTopHook.position.y = topHookY;

            // Posicionamento vetorial explícito de cada uma das 3 pernas e hastes estabilizadoras
            const footRadialDist = TRIPOD_COLLAR_R + Math.sin(legSpreadAngle) * TRIPOD_LEG_LEN;
            const pTop = new THREE.Vector3();
            const pAnkle = new THREE.Vector3();
            const pMid = new THREE.Vector3();
            const pHub = new THREE.Vector3();
            const dirLeg = new THREE.Vector3();
            const dirStrut = new THREE.Vector3();

            for (let i = 0; i < tripodLegs.length; i++) {
                const leg = tripodLegs[i];
                const strut = tripodStruts[i];
                const cosAz = Math.cos(leg.az);
                const sinAz = Math.sin(leg.az);

                pTop.set(TRIPOD_COLLAR_R * cosAz, collarY, TRIPOD_COLLAR_R * sinAz);
                pAnkle.set(footRadialDist * cosAz, TRIPOD_FOOT_H, footRadialDist * sinAz);

                dirLeg.subVectors(pAnkle, pTop);
                const actualLegLen = Math.max(0.01, dirLeg.length());
                dirLeg.normalize();

                // Tubo da perna alinhado de P_top até P_ankle
                leg.legTube.position.copy(pTop).addScaledVector(pAnkle, 1).multiplyScalar(0.5);
                leg.legTube.scale.set(1, actualLegLen, 1);
                leg.legTube.quaternion.setFromUnitVectors(TRIPOD_UP, dirLeg);

                // Junta superior orientada radialmente
                leg.topHinge.position.copy(pTop);
                leg.topHinge.rotation.set(0, -leg.az + Math.PI * 0.5, 0);

                // Abraçadeira intermediária a 52% da perna
                pMid.lerpVectors(pTop, pAnkle, 0.52);
                leg.legClamp.position.copy(pMid);
                leg.legClamp.quaternion.copy(leg.legTube.quaternion);

                // Pé emborrachado sempre nivelado sobre o chão (y = 0)
                leg.footGroup.position.set(pAnkle.x, 0, pAnkle.z);
                leg.footGroup.rotation.set(0, 0, 0);

                // Haste estabilizadora conectando lowerHub (y = 0.16) até P_mid da perna
                pHub.set(TRIPOD_HUB_R * cosAz, TRIPOD_HUB_Y, TRIPOD_HUB_R * sinAz);
                dirStrut.subVectors(pMid, pHub);
                const strutLen = Math.max(0.01, dirStrut.length());
                dirStrut.normalize();

                strut.strutBar.position.copy(pHub).addScaledVector(pMid, 1).multiplyScalar(0.5);
                strut.strutBar.scale.set(1, strutLen, 1);
                strut.strutBar.quaternion.setFromUnitVectors(TRIPOD_UP, dirStrut);

                strut.hubPin.position.copy(pHub);
                strut.strutPin.position.copy(pMid);
            }

            tripodGroup.visible = deploy > 0.005;
        }

        // =========================================================================
        // 7. BANNER 3D SUBDIVIDIDO + ENROLAMENTO EM ESPIRAL DE ARQUIMEDES
        // =========================================================================
        function buildBannerModel() {
            bannerSystemGroup = new THREE.Group();
            scene.add(bannerSystemGroup);

            // Gera textura padrão de alta definição
            defaultBannerTexture = createBannerCanvasTexture();
            currentBannerTexture = defaultBannerTexture;
            const backTexture = createVinylBackTexture();

            // Alta segmentação vertical (150 linhas) para curvatura em espiral ultra suave
            const segX = 32;
            const segY = 150;

            bannerFrontGeo = new THREE.PlaneGeometry(BANNER_W, BANNER_H, segX, segY);
            bannerBackGeo = new THREE.PlaneGeometry(BANNER_W, BANNER_H, segX, segY);

            // Armazena coordenadas originais (x, s = distância a partir do topo)
            const posAttr = bannerFrontGeo.attributes.position;
            bannerBasePositions = new Float32Array(posAttr.count * 2);
            for (let i = 0; i < posAttr.count; i++) {
                const vx = posAttr.getX(i);
                const vy = posAttr.getY(i); // +H/2 no topo até -H/2 na base
                const s = BANNER_H / 2 - vy; // s = 0 no topo, s = H na base
                bannerBasePositions[i * 2] = vx;
                bannerBasePositions[i * 2 + 1] = s;
            }

            const frontMat = new THREE.MeshStandardMaterial({
                map: currentBannerTexture,
                roughness: 0.46,
                metalness: 0.02,
                side: THREE.FrontSide
            });

            const backMat = new THREE.MeshStandardMaterial({
                map: backTexture,
                color: '#eceef2',
                roughness: 0.62,
                metalness: 0.02,
                side: THREE.BackSide
            });

            bannerFrontMesh = new THREE.Mesh(bannerFrontGeo, frontMat);
            bannerFrontMesh.castShadow = true;
            bannerFrontMesh.receiveShadow = true;
            bannerFrontMesh.frustumCulled = false;

            bannerBackMesh = new THREE.Mesh(bannerBackGeo, backMat);
            bannerBackMesh.castShadow = true;
            bannerBackMesh.receiveShadow = true;
            bannerBackMesh.frustumCulled = false;

            bannerSystemGroup.add(bannerFrontMesh, bannerBackMesh);

            // Bastão superior (tubo branco/alumínio + ponteiras pretas)
            topRodGroup = createDowelRod(BANNER_W + 0.045, 0.0115);
            topRodGroup.position.set(0, BANNER_TOP_Y + 0.004, BANNER_Z);
            bannerSystemGroup.add(topRodGroup);

            // Bastão inferior (acompanha dinamicamente o centro do rolo ao enrolar)
            bottomRodGroup = createDowelRod(BANNER_W + 0.045, 0.0125);
            bottomRodGroup.position.set(0, BANNER_TOP_Y - BANNER_H, BANNER_Z);
            bannerSystemGroup.add(bottomRodGroup);

            // Cordão em "V" ligando o bastão superior ao gancho do tripé
            const cordCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(-0.34, BANNER_TOP_Y + 0.01, BANNER_Z),
                new THREE.Vector3(-0.17, (BANNER_TOP_Y + TRIPOD_TOP_Y) * 0.5 + 0.004, BANNER_Z),
                new THREE.Vector3(0, TRIPOD_TOP_Y + 0.002, BANNER_Z),
                new THREE.Vector3(0.17, (BANNER_TOP_Y + TRIPOD_TOP_Y) * 0.5 + 0.004, BANNER_Z),
                new THREE.Vector3(0.34, BANNER_TOP_Y + 0.01, BANNER_Z)
            ]);
            const cordGeo = new THREE.TubeGeometry(cordCurve, 32, 0.0022, 8, false);
            const cordMat = new THREE.MeshStandardMaterial({ color: '#e5e7eb', roughness: 0.8 });
            hangingCordMesh = new THREE.Mesh(cordGeo, cordMat);
            bannerSystemGroup.add(hangingCordMesh);

            // Moldura luminosa 3D para destacar a seção focada
            buildHighlightFrame();

            // Calcula bounds reais da lona desenrolada antes de aplicar estado inicial enrolado
            updateBannerDeformation(1.0, 0);
            bannerFrontGeo.computeBoundingBox();
            bannerFrontGeo.computeBoundingSphere();
            bannerBackGeo.computeBoundingBox();
            bannerBackGeo.computeBoundingSphere();
            updateBannerDeformation(0.0, 0);
        }

        function createDowelRod(length, radius) {
            const group = new THREE.Group();
            const tubeMat = new THREE.MeshStandardMaterial({
                color: '#dde2e8',
                roughness: 0.34,
                metalness: 0.45
            });
            const capMat = new THREE.MeshStandardMaterial({
                color: '#191b1f',
                roughness: 0.65,
                metalness: 0.2
            });

            const tube = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius, length, 20), tubeMat);
            tube.rotation.z = Math.PI / 2;
            tube.castShadow = true;
            group.add(tube);

            const capL = new THREE.Mesh(new THREE.CylinderGeometry(radius * 1.18, radius * 1.18, 0.026, 18), capMat);
            capL.rotation.z = Math.PI / 2;
            capL.position.x = -length / 2 - 0.006;
            group.add(capL);

            const capR = capL.clone();
            capR.position.x = length / 2 + 0.006;
            group.add(capR);

            return group;
        }

        // Moldura luminosa que destaca brevemente cada seção focada
        function buildHighlightFrame() {
            highlightGroup = new THREE.Group();
            highlightMat = new THREE.MeshBasicMaterial({
                color: '#ff3b47',
                transparent: true,
                opacity: 0,
                depthWrite: false
            });

            // 4 barras que serão redimensionadas dinamicamente para envolver qualquer seção
            const barGeo = new THREE.PlaneGeometry(1, 1);
            for (let i = 0; i < 4; i++) {
                const bar = new THREE.Mesh(barGeo, highlightMat);
                highlightGroup.add(bar);
            }
            highlightGroup.visible = false;
            bannerSystemGroup.add(highlightGroup);
