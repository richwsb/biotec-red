        function triggerSectionHighlight(rect) {
            if (!rect) {
                highlightState.active = false;
                highlightGroup.visible = false;
                return;
            }

            const w = (rect.w / CANVAS_W) * BANNER_W;
            const h = (rect.h / CANVAS_H) * BANNER_H;
            const cx = ((rect.x + rect.w / 2) / CANVAS_W - 0.5) * BANNER_W;
            const cy = BANNER_TOP_Y - ((rect.y + rect.h / 2) / CANVAS_H) * BANNER_H;
            const border = 0.0055;

            const [topBar, botBar, leftBar, rightBar] = highlightGroup.children;

            topBar.scale.set(w + border * 2, border, 1);
            topBar.position.set(0, h / 2 + border / 2, 0);

            botBar.scale.set(w + border * 2, border, 1);
            botBar.position.set(0, -h / 2 - border / 2, 0);

            leftBar.scale.set(border, h, 1);
            leftBar.position.set(-w / 2 - border / 2, 0, 0);

            rightBar.scale.set(border, h, 1);
            rightBar.position.set(w / 2 + border / 2, 0, 0);

            highlightGroup.position.set(cx, cy, BANNER_Z + 0.0045);
            highlightGroup.visible = true;
            highlightState.active = true;
            highlightState.elapsed = 0;
        }

        /**
         * Deformação paramétrica exata da lona em Espiral de Arquimedes
         * @param {number} progress - 0 (totalmente enrolado no topo) até 1 (totalmente aberto)
         * @param {number} time - tempo decorrido para leve balanço natural do tecido
         */
        function updateBannerDeformation(progress, time) {
            const p = clamp(progress, 0, 1);
            const minHanging = 0.022; // 2.2cm presos ao bastão superior
            const sSplit = lerp(minHanging, BANNER_H, p);
            const rolledLength = Math.max(0, BANNER_H - sSplit);

            // Calcula ângulo total (thetaMax) e raio externo da espiral de Arquimedes
            // L(theta) = r0 * theta + 0.5 * b * theta^2
            const thetaMax = rolledLength > 0.0001
                ? (-ROLL_R0 + Math.sqrt(ROLL_R0 * ROLL_R0 + 2 * ROLL_B * rolledLength)) / ROLL_B
                : 0;
            const rOuter = ROLL_R0 + ROLL_B * thetaMax;

            // Centro do cilindro do rolo (posicionado à frente da lona para não colidir com o mastro do tripé)
            const rollCenterY = BANNER_TOP_Y - sSplit;
            const rollCenterZ = BANNER_Z + rOuter;

            // Suaviza o deslocamento do bastão inferior quando o banner está 100% aberto
            const rodRollBlend = smoothstep(0.0, 0.06, 1 - p);
            const swayAmp = 0.0022 * p * p; // leve movimento de ar apenas quando desenrolado

            const frontPos = bannerFrontGeo.attributes.position;
            const frontNorm = bannerFrontGeo.attributes.normal;
            const backPos = bannerBackGeo.attributes.position;
            const backNorm = bannerBackGeo.attributes.normal;

            const count = frontPos.count;
            for (let i = 0; i < count; i++) {
                const vx = bannerBasePositions[i * 2];
                const s = bannerBasePositions[i * 2 + 1];

                let y, z, ny, nz;

                if (s <= sSplit) {
                    // Trecho vertical aberto
                    const normS = s / BANNER_H;
                    const wave = Math.sin(time * 1.45 - normS * 3.1 + vx * 1.8) * swayAmp * normS;
                    y = BANNER_TOP_Y - s;
                    z = BANNER_Z + wave;
                    ny = 0;
                    nz = 1;
                } else {
                    // Trecho enrolado em espiral contínua ao redor do bastão inferior
                    const uRoll = BANNER_H - s; // distância a partir da borda inferior (núcleo)
                    const theta = (-ROLL_R0 + Math.sqrt(ROLL_R0 * ROLL_R0 + 2 * ROLL_B * uRoll)) / ROLL_B;
                    const r = ROLL_R0 + ROLL_B * theta;
                    const phi = thetaMax - theta; // 0 no ponto tangente de entrada da espiral

                    const sinP = Math.sin(phi);
                    const cosP = Math.cos(phi);

                    y = rollCenterY - r * sinP;
                    z = rollCenterZ - r * cosP;

                    // Normal analítica exata da frente da lona
                    ny = sinP;
                    nz = cosP;
                }

                frontPos.setXYZ(i, vx, y, z);
                frontNorm.setXYZ(i, 0, ny, nz);

                // Malha traseira deslocada sutilmente no sentido oposto à normal frontal
                backPos.setXYZ(i, vx, y - ny * BACK_LAYER_OFFSET, z - nz * BACK_LAYER_OFFSET);
                backNorm.setXYZ(i, 0, ny, nz);
            }

            frontPos.needsUpdate = true;
            frontNorm.needsUpdate = true;
            backPos.needsUpdate = true;
            backNorm.needsUpdate = true;

            // Posiciona o bastão inferior exatamente no centro da espiral (e girando com ela!)
            bottomRodGroup.position.set(
                0,
                rollCenterY,
                lerp(BANNER_Z, rollCenterZ, rodRollBlend)
            );
            bottomRodGroup.rotation.x = -thetaMax;
        }

        // =========================================================================
        // 8. ANIMAÇÃO CINEMATOGRÁFICA DE INTRODUÇÃO (PAREAMENTO DE DNA -> TRIPÉ)
        // =========================================================================
        function createIntroBaseRingGeometry(isPurine) {
            const shape = new THREE.Shape();
            if (isPurine) {
                // Anel duplo Purina (Pentágono imidazol + Hexágono pirimidina) ao longo de +X
                shape.moveTo(0.00, -0.014);
                shape.lineTo(0.026, -0.022);
                shape.lineTo(0.044, -0.013);
                shape.lineTo(0.068, -0.022);
                shape.lineTo(0.092, -0.011);
                shape.lineTo(0.092, 0.011);
                shape.lineTo(0.068, 0.022);
                shape.lineTo(0.044, 0.013);
                shape.lineTo(0.026, 0.022);
                shape.lineTo(0.00, 0.014);
                shape.closePath();
            } else {
                // Anel simples Pirimidina (Hexágono) ao longo de +X
                shape.moveTo(0.00, -0.013);
                shape.lineTo(0.026, -0.021);
                shape.lineTo(0.054, -0.012);
                shape.lineTo(0.054, 0.012);
                shape.lineTo(0.026, 0.021);
                shape.lineTo(0.00, 0.013);
                shape.closePath();
            }

            const geo = new THREE.ExtrudeGeometry(shape, {
                depth: 0.012,
                bevelEnabled: true,
                bevelThickness: 0.0028,
                bevelSize: 0.0022,
                bevelSegments: 2
            });
            geo.rotateX(Math.PI / 2);
            geo.translate(0, 0.006, 0);
            return geo;
        }

        function buildIntroDNAObjects() {
            introGroup = new THREE.Group();
            scene.add(introGroup);

            const purineGeo = createIntroBaseRingGeometry(true);
            const pyrimidineGeo = createIntroBaseRingGeometry(false);
            const sugarGeo = new THREE.CylinderGeometry(0.018, 0.018, 0.015, 5);
            const phosGeo = new THREE.SphereGeometry(0.027, 20, 20);
            const glycoGeo = new THREE.CylinderGeometry(0.0055, 0.0055, 0.030, 10);
            const shockGeo = new THREE.TorusGeometry(0.095, 0.0042, 10, 36);

            // Materiais físicos distintos para as 4 bases nitrogenadas e esqueleto metálico
            const BASE_MATS = {
                A: new THREE.MeshPhysicalMaterial({ color: '#b91c1c', emissive: '#64080c', emissiveIntensity: 0.55, roughness: 0.22, metalness: 0.2, clearcoat: 0.6 }),
                T: new THREE.MeshPhysicalMaterial({ color: '#f8fafc', emissive: '#64748b', emissiveIntensity: 0.35, roughness: 0.24, metalness: 0.15, clearcoat: 0.55 }),
                C: new THREE.MeshPhysicalMaterial({ color: '#fb7185', emissive: '#881337', emissiveIntensity: 0.45, roughness: 0.24, metalness: 0.18, clearcoat: 0.55 }),
                G: new THREE.MeshPhysicalMaterial({ color: '#f59e0b', emissive: '#78350f', emissiveIntensity: 0.52, roughness: 0.22, metalness: 0.32, clearcoat: 0.65 })
            };

            const backboneMatL = new THREE.MeshStandardMaterial({ color: '#e11d48', emissive: '#580819', emissiveIntensity: 0.48, roughness: 0.20, metalness: 0.72 });
            const backboneMatR = new THREE.MeshStandardMaterial({ color: '#e2e8f0', emissive: '#334155', emissiveIntensity: 0.36, roughness: 0.20, metalness: 0.78 });
            const sugarMat = new THREE.MeshStandardMaterial({ color: '#38bdf8', emissive: '#0c4a6e', emissiveIntensity: 0.35, roughness: 0.28, metalness: 0.45 });
            const hBondMat = new THREE.MeshBasicMaterial({ color: '#7dd3fc', transparent: true, opacity: 0.92, blending: THREE.AdditiveBlending });

            const helixStartY = 0.56;
            const helixStepY = 0.175;
            const helixRadius = 0.178;
            const twistPerStep = 0.54;
            const isPurineCode = (code) => code === 'A' || code === 'G';

            dnaPairObjects = [];
            backboneSegments = [];

            DNA_SEQUENCE.forEach((pair, idx) => {
                const y = helixStartY + idx * helixStepY;
                const angle = idx * twistPerStep;

                const pairHolder = new THREE.Group();
                pairHolder.position.set(0, y, 0);
                pairHolder.rotation.y = angle;

                // Nucleotídeo esquerdo (Fita 5'→3')
                const leftUnit = new THREE.Group();
                const phosL = new THREE.Mesh(phosGeo, backboneMatL.clone());
                phosL.position.x = -helixRadius;
                const sugarL = new THREE.Mesh(sugarGeo, sugarMat.clone());
                sugarL.position.x = -0.135;
                const glycoL = new THREE.Mesh(glycoGeo, backboneMatL);
                glycoL.rotation.z = Math.PI / 2;
                glycoL.position.x = -0.115;

                const ringL = new THREE.Mesh(
                    isPurineCode(pair.top) ? purineGeo : pyrimidineGeo,
                    BASE_MATS[pair.top].clone()
                );
                ringL.position.x = -0.105;
                leftUnit.add(phosL, sugarL, glycoL, ringL);

                // Nucleotídeo direito (Fita 3'→5')
                const rightUnit = new THREE.Group();
                const phosR = new THREE.Mesh(phosGeo, backboneMatR.clone());
                phosR.position.x = helixRadius;
                const sugarR = new THREE.Mesh(sugarGeo, sugarMat.clone());
                sugarR.position.x = 0.135;
                const glycoR = new THREE.Mesh(glycoGeo, backboneMatR);
                glycoR.rotation.z = Math.PI / 2;
                glycoR.position.x = 0.115;

                const ringR = new THREE.Mesh(
                    isPurineCode(pair.bottom) ? purineGeo : pyrimidineGeo,
                    BASE_MATS[pair.bottom].clone()
                );
                ringR.rotation.y = Math.PI;
                ringR.position.x = 0.105;
                rightUnit.add(phosR, sugarR, glycoR, ringR);

                // Pontes de hidrogênio luminosas (3 para G≡C, 2 para A=T)
                const bondsGroup = new THREE.Group();
                const offsets = pair.bonds === 3 ? [-0.014, 0, 0.014] : [-0.0095, 0.0095];
                const bondCenterX = isPurineCode(pair.top) ? 0.018 : -0.018;
                offsets.forEach((oz) => {
                    const bond = new THREE.Mesh(
                        new THREE.CylinderGeometry(0.0038, 0.0038, 0.056, 8),
                        hBondMat.clone()
                    );
                    bond.rotation.z = Math.PI / 2;
                    bond.position.set(bondCenterX, 0, oz);
                    bondsGroup.add(bond);
                });
                bondsGroup.scale.set(0.001, 0.001, 0.001);

                // Anel de onda de choque luminosa ao formar o pareamento
                const shockMat = new THREE.MeshBasicMaterial({
                    color: pair.bonds === 3 ? '#38bdf8' : '#fde047',
                    transparent: true,
                    opacity: 0,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });
                const shockwaveRing = new THREE.Mesh(shockGeo, shockMat);
                shockwaveRing.rotation.x = Math.PI / 2;
                shockwaveRing.scale.setScalar(0.01);

                pairHolder.add(leftUnit, rightUnit, bondsGroup, shockwaveRing);
                introGroup.add(pairHolder);

                dnaPairObjects.push({
                    holder: pairHolder,
                    leftUnit,
                    rightUnit,
                    bondsGroup,
                    shockwaveRing,
                    baseY: y,
                    baseAngle: angle,
                    pair
                });

                // Fitas helicoidais contínuas ligando fosfato-açúcar ao par anterior
                if (idx > 0) {
                    const prevY = helixStartY + (idx - 1) * helixStepY;
                    const prevAng = (idx - 1) * twistPerStep;

                    const makeRail = (sideSign, mat) => {
                        const p0 = new THREE.Vector3(Math.cos(prevAng) * helixRadius * sideSign, prevY, -Math.sin(prevAng) * helixRadius * sideSign);
                        const p1 = new THREE.Vector3(Math.cos(angle) * helixRadius * sideSign, y, -Math.sin(angle) * helixRadius * sideSign);
                        const mid = new THREE.Vector3().addVectors(p0, p1).multiplyScalar(0.5);
                        mid.x *= 1.06;
                        mid.z *= 1.06;
                        const curve = new THREE.QuadraticBezierCurve3(p0, mid, p1);
                        const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 12, 0.010, 10, false), mat.clone());
                        mesh.visible = false;
                        introGroup.add(mesh);
                        return { mesh, appearIndex: idx };
                    };

                    backboneSegments.push(makeRail(-1, backboneMatL));
                    backboneSegments.push(makeRail(1, backboneMatR));
                }
            });

            // Coluna energética central usada na metamorfose DNA -> Haste Telescópica (Fase 2)
            const energyGeo = new THREE.CylinderGeometry(0.022, 0.032, 2.04, 24, 1, true);
            const energyMat = new THREE.MeshBasicMaterial({
                color: '#fb7185',
                transparent: true,
                opacity: 0,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                side: THREE.DoubleSide
            });
            introEnergyCore = new THREE.Mesh(energyGeo, energyMat);
            introEnergyCore.position.y = 1.02;
            introEnergyCore.visible = false;
            introGroup.add(introEnergyCore);

            // Partículas moleculares flutuantes ao redor da hélice
            const pCount = 160;
            const pPositions = new Float32Array(pCount * 3);
            for (let i = 0; i < pCount; i++) {
                const r = 0.34 + Math.random() * 1.95;
                const theta = Math.random() * Math.PI * 2;
                pPositions[i * 3] = Math.cos(theta) * r;
                pPositions[i * 3 + 1] = 0.16 + Math.random() * 2.25;
                pPositions[i * 3 + 2] = Math.sin(theta) * r;
            }
            const pGeo = new THREE.BufferGeometry();
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
            const pMat = new THREE.PointsMaterial({
                color: '#fda4af',
                size: 0.024,
                transparent: true,
                opacity: 0.72,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            introParticles = new THREE.Points(pGeo, pMat);
            introGroup.add(introParticles);
        }

        // Atualiza o ambiente (cores do domo + luzes) entre dark biotech (0) e estúdio claro (1)
        function setStudioBrightness(t) {
            const b = clamp(t, 0, 1);

            const darkTop = new THREE.Color('#09050b');
            const lightTop = new THREE.Color('#dce2eb');
            const darkHorizon = new THREE.Color('#1c0910');
            const lightHorizon = new THREE.Color('#f1f4f8');
            const darkBot = new THREE.Color('#0b060a');
            const lightBot = new THREE.Color('#cfd6e0');

            studioBgMat.uniforms.uTopColor.value.lerpColors(darkTop, lightTop, b);
            studioBgMat.uniforms.uHorizonColor.value.lerpColors(darkHorizon, lightHorizon, b);
            studioBgMat.uniforms.uBottomColor.value.lerpColors(darkBot, lightBot, b);

            hemiLight.intensity = lerp(0.28, 1.15, b);
            keyLight.intensity = lerp(0.35, 1.48, b);
            rimLight.intensity = lerp(0.30, 0.72, b);
            introPointLight.intensity = lerp(2.8, 0.0, smoothstep(0.15, 0.85, b));

            studioFloorMesh.material.opacity = lerp(0.14, 0.96, b);
            contactShadowMesh.material.opacity = lerp(0.0, 0.75, b);
        }

        // Executa o quadro atual da animação de introdução (0s -> 9.6s)
        function updateIntroAnimation(dt) {
            if (!introState.active) return;

            introState.time += dt;
            const t = introState.time;

            const progressPct = clamp((t / introState.duration) * 100, 0, 100);
            document.getElementById('intro-progress-bar').style.width = `${progressPct}%`;

            const phaseTitleEl = document.getElementById('intro-phase-title');

            // -----------------------------------------------------------------------
            // FASE 1 (0.0s a 4.5s): Pareamento Sequencial dos 8 Nucleotídeos
            // -----------------------------------------------------------------------
            if (t < 4.5) {
                setStudioBrightness(0.0);
                bannerSystemGroup.visible = false;
                setTripodDeployment(0);
                introGroup.visible = true;
                introEnergyCore.visible = false;

                phaseTitleEl.textContent = 'Fase 1 • Pareamento Molecular (Purina ↔ Pirimidina)';

                const pairInterval = 0.48;
                const pairAnimDur = 0.56;

                // Rotação suave da dupla hélice em formação
                introGroup.rotation.y = t * 0.44;
                introParticles.rotation.y = -t * 0.18;
                introParticles.material.opacity = 0.78;

                let activeIdx = 0;
                let maxFlash = 0;

                dnaPairObjects.forEach((obj, idx) => {
                    const localT = (t - idx * pairInterval) / pairAnimDur;
                    if (localT <= 0) {
                        obj.holder.visible = false;
                        return;
                    }
                    obj.holder.visible = true;
                    activeIdx = idx;

                    const p = easeOutCubic(clamp(localT, 0, 1));
                    const slideOffset = lerp(0.85, 0, p);
                    obj.leftUnit.position.set(-slideOffset, 0, 0);
                    obj.rightUnit.position.set(slideOffset, 0, 0);
                    obj.leftUnit.scale.setScalar(1);
                    obj.rightUnit.scale.setScalar(1);
                    obj.holder.scale.setScalar(1);
                    obj.holder.position.y = obj.baseY;

                    // Onda de choque luminosa e encaixe das pontes de hidrogênio
                    const bondP = smoothstep(0.62, 0.96, localT);
                    const flash = localT > 0.68 && localT < 1.32 ? Math.sin((localT - 0.68) * Math.PI / 0.64) : 0;
                    if (flash > maxFlash) maxFlash = flash;

                    obj.bondsGroup.scale.set(
                        Math.max(0.001, bondP),
                        Math.max(0.001, bondP + flash * 0.55),
                        Math.max(0.001, bondP + flash * 0.55)
                    );
                    obj.bondsGroup.children.forEach((b) => {
                        b.material.opacity = clamp(bondP * 0.92 + flash * 0.45, 0, 1);
                    });

                    if (localT > 0.65 && localT < 1.55) {
                        const waveP = clamp((localT - 0.65) / 0.9, 0, 1);
                        obj.shockwaveRing.visible = true;
                        obj.shockwaveRing.scale.setScalar(lerp(0.35, 1.95, easeOutCubic(waveP)));
                        obj.shockwaveRing.material.opacity = (1 - waveP) * 0.72;
                    } else {
                        obj.shockwaveRing.visible = false;
                        obj.shockwaveRing.material.opacity = 0;
                    }
                });

                // Mostra as fitas fosfato-açúcar conforme os pares acoplam
                backboneSegments.forEach((seg) => {
                    const segT = (t - seg.appearIndex * pairInterval) / 0.4;
                    seg.mesh.visible = segT > 0.32;
                    seg.mesh.scale.setScalar(1);
                });

                // Acompanha índice do par ativo
                if (activeIdx !== introState.lastShownPair) {
                    introState.lastShownPair = activeIdx;
                }

                // Câmera orbital suave acompanhando cada par acoplado
                const targetY = lerp(0.60, 1.62, easeInOutCubic(clamp(t / 4.2, 0, 1)));
                const camAngle = lerp(-0.34, 0.30, t / 4.5);
                const camRadius = lerp(0.90, 0.98, Math.sin((t / 4.5) * Math.PI));
                camera.position.set(
                    Math.sin(camAngle) * camRadius,
                    targetY + 0.08,
                    Math.cos(camAngle) * camRadius
                );
                controls.target.set(0, targetY, 0);
                camera.lookAt(controls.target);

                introPointLight.intensity = 2.6 + maxFlash * 2.2;
                introPointLight.position.set(Math.sin(t * 2.2) * 0.35, targetY, 0.55);

                // -----------------------------------------------------------------------
                // FASE 2 (4.5s a 7.2s): Condensação da Hélice + Abertura Simétrica do Tripé
                // -----------------------------------------------------------------------
            } else if (t < 7.2) {
                const p2 = clamp((t - 4.5) / 2.7, 0, 1);
                const p2Smooth = easeInOutCubic(p2);

                phaseTitleEl.textContent = 'Fase 2 • Metamorfose Molecular → Tripé UFPA';

                // Clareia gradualmente o estúdio
                setStudioBrightness(smoothstep(0.05, 0.92, p2));

                // Nucleotídeos aceleram em giro, convergem radialmente e energizam a coluna central
                const collapseP = smoothstep(0.0, 0.62, p2);
                const fadeOutDNA = 1 - smoothstep(0.42, 0.78, p2);

                introGroup.visible = fadeOutDNA > 0.01;
                introGroup.rotation.y = 4.5 * 0.44 + Math.pow(p2, 1.45) * Math.PI * 2.4;
                introParticles.material.opacity = fadeOutDNA * 0.65;

                // Feixe energético axial carmesim/dourado na transição para o mastro telescópico
                const energyPulse = Math.sin(clamp((p2 - 0.1) / 0.75, 0, 1) * Math.PI);
                introEnergyCore.visible = energyPulse > 0.02;
                introEnergyCore.material.opacity = energyPulse * 0.78;
                introEnergyCore.scale.set(lerp(1.4, 0.55, p2), clamp(p2 * 1.4, 0.25, 1), lerp(1.4, 0.55, p2));

                dnaPairObjects.forEach((obj) => {
                    obj.holder.visible = true;
                    obj.shockwaveRing.visible = false;
                    const radialScale = lerp(1.0, 0.08, collapseP);
                    obj.holder.scale.set(radialScale, lerp(1.0, 1.35, collapseP), radialScale);
                    obj.leftUnit.position.set(0, 0, 0);
                    obj.rightUnit.position.set(0, 0, 0);
                    obj.bondsGroup.scale.setScalar(fadeOutDNA);
                });

                backboneSegments.forEach((seg) => {
                    seg.mesh.visible = fadeOutDNA > 0.02;
                    seg.mesh.scale.set(lerp(1, 0.1, collapseP), 1, lerp(1, 0.1, collapseP));
                });

                // Abertura progressiva do tripé (3 pernas a 120° + mastro telescópico + pés em y=0)
                const tripodP = smoothstep(0.18, 0.95, p2);
                setTripodDeployment(tripodP);
                contactShadowMesh.material.opacity = smoothstep(0.35, 0.95, p2) * 0.75;

                // Banner enrolado surge discretamente no topo ao final da Fase 2
                bannerSystemGroup.visible = p2 > 0.84;
                unrollProgress = 0.0;
                updateBannerDeformation(0.0, t);

                // Afastamento cinematográfico da câmera até o plano geral
                const startPos = new THREE.Vector3(Math.sin(0.30) * 0.90, 1.70, Math.cos(0.30) * 0.90);
                const endPos = getOverviewCameraPose().pos;
                const startTgt = new THREE.Vector3(0, 1.62, 0);
                const endTgt = getOverviewCameraPose().target;

                const orbitOffset = Math.sin(p2Smooth * Math.PI) * 0.72;
                camera.position.lerpVectors(startPos, endPos, p2Smooth);
                camera.position.x += orbitOffset;
                controls.target.lerpVectors(startTgt, endTgt, p2Smooth);
                camera.lookAt(controls.target);

                // -----------------------------------------------------------------------
                // FASE 3 (7.2s a 9.6s): Desenrolamento Suave do Banner Completo
                // -----------------------------------------------------------------------
            } else if (t < introState.duration) {
                const p3 = clamp((t - 7.2) / (introState.duration - 7.2), 0, 1);
                setStudioBrightness(1.0);
                introGroup.visible = false;
                introEnergyCore.visible = false;
                setTripodDeployment(1.0);
                bannerSystemGroup.visible = true;

                phaseTitleEl.textContent = 'Fase 3 • Desenrolamento em Espiral de Arquimedes';

                // Desenrola suavemente com leve amortecimento no final
                unrollProgress = easeInOutCubic(p3);
                targetUnrollProgress = unrollProgress;
                updateBannerDeformation(unrollProgress, t);
                syncRollUI(unrollProgress);

                // Pequeno ajuste elegante de câmera acompanhando a abertura
                const overview = getOverviewCameraPose();
                camera.position.lerp(overview.pos, 0.08);
                controls.target.lerp(overview.target, 0.08);
                camera.lookAt(controls.target);

            } else {
                finishIntro(false);
            }
        }

        function finishIntro(immediate = false) {
            introState.active = false;
            introGroup.visible = false;
            if (introEnergyCore) introEnergyCore.visible = false;
            setStudioBrightness(1.0);
            setTripodDeployment(1.0);
            bannerSystemGroup.visible = true;

            unrollProgress = 1.0;
            targetUnrollProgress = 1.0;
            isRollAnimating = false;
            updateBannerDeformation(1.0, clock ? clock.getElapsedTime() : 0);
            syncRollUI(1.0);

            // Esconde overlay da intro e exibe UI interativa
            const introOverlay = document.getElementById('intro-overlay');
            const mainUI = document.getElementById('main-ui');
            introOverlay.classList.add('opacity-0');
            setTimeout(() => {
                if (!introState.active) introOverlay.style.display = 'none';
            }, immediate ? 50 : 650);

            mainUI.classList.remove('opacity-0');

            controls.enabled = true;
            if (immediate) {
                const overview = getOverviewCameraPose();
                camera.position.copy(overview.pos);
                controls.target.copy(overview.target);
                controls.update();
            }
            setActiveSectionUI('geral');
        }

        function replayIntro() {
            cameraTween = null;
            triggerSectionHighlight(null);
            document.getElementById('context-pill').classList.add('hidden');

            introState.active = true;
            introState.time = 0;
            introState.lastShownPair = -1;
            controls.enabled = false;

            const introOverlay = document.getElementById('intro-overlay');
            const mainUI = document.getElementById('main-ui');
            introOverlay.style.display = 'flex';
            requestAnimationFrame(() => {
                introOverlay.classList.remove('opacity-0');
            });
            mainUI.classList.add('opacity-0');
        }

        // =========================================================================
        // 9. MAPEAMENTO EXATO DE CÂMERA PARA CADA SEÇÃO DO BANNER
        // =========================================================================
        function getOverviewCameraPose() {
            const aspect = window.innerWidth / Math.max(1, window.innerHeight);
            const fovRad = THREE.MathUtils.degToRad(camera.fov);

            // Enquadra do pé do tripé (y = 0) até o topo (y = 2.08)
            const totalH = 2.28;
            const totalW = 1.25;
            const distV = (totalH / 2) / Math.tan(fovRad / 2);
            const distH = (totalW / 2) / (Math.tan(fovRad / 2) * aspect);
            const dist = Math.max(distV, distH) * 1.12;

            return {
                pos: new THREE.Vector3(0.18, 1.15, BANNER_Z + dist),
                target: new THREE.Vector3(0, 1.06, BANNER_Z)
            };
        }

        // Converte qualquer retângulo do Canvas2D (1600x2133) em pose exata de câmera 3D
        function getSectionCameraPose(rect, padding = 1.24) {
            const aspect = window.innerWidth / Math.max(1, window.innerHeight);
            const fovRad = THREE.MathUtils.degToRad(camera.fov);

            const worldW = (rect.w / CANVAS_W) * BANNER_W;
            const worldH = (rect.h / CANVAS_H) * BANNER_H;

            const centerU = (rect.x + rect.w / 2) / CANVAS_W;
            const centerV = (rect.y + rect.h / 2) / CANVAS_H;

            const targetX = (centerU - 0.5) * BANNER_W;
            const targetY = BANNER_TOP_Y - centerV * BANNER_H;

            // Compensa área ocupada pelo menu lateral esquerdo no desktop para centralizar no espaço livre
            const vw = Math.max(1, window.innerWidth);
            const drawerOccupiedPx = (isDrawerOpen && vw >= 768) ? 276 : 0;
            const visibleWidthRatio = clamp((vw - drawerOccupiedPx) / vw, 0.52, 1.0);

            const distV = (worldH * padding / 2) / Math.tan(fovRad / 2);
            const distH = (worldW * padding / 2) / (Math.tan(fovRad / 2) * aspect * visibleWidthRatio);
            const dist = Math.max(distV, distH, 0.36);

            const frustumHalfW = dist * Math.tan(fovRad / 2) * aspect;
            const shiftX = drawerOccupiedPx > 0 ? (drawerOccupiedPx / vw) * frustumHalfW : 0;

            return {
                pos: new THREE.Vector3(targetX - shiftX, targetY, BANNER_Z + dist),
                target: new THREE.Vector3(targetX - shiftX, targetY, BANNER_Z)
            };
        }

        function focusSection(sectionId) {
            // Se estiver na intro, finaliza imediatamente para responder ao clique do usuário
            if (introState.active) {
                finishIntro(true);
            }

            // Desenrola automaticamente caso o banner esteja enrolado
            if (unrollProgress < 0.98 && sectionId !== 'geral') {
                targetUnrollProgress = 1.0;
                isRollAnimating = true;
            }

            let pose;
            let rect = null;

            if (sectionId === 'geral') {
                pose = getOverviewCameraPose();
            } else {
                rect = SECTION_RECTS[sectionId];
                if (!rect) return;
                const pad = (sectionId === 'referencias' || sectionId === 'autores') ? 1.32 : 1.22;
                pose = getSectionCameraPose(rect, pad);
            }

            // Inicia interpolação suave de câmera
            cameraTween = {
                startPos: camera.position.clone(),
                endPos: pose.pos,
                startTarget: controls.target.clone(),
                endTarget: pose.target,
                elapsed: 0,
                duration: 1.05
            };

            triggerSectionHighlight(rect);
            setActiveSectionUI(sectionId);

            // Mostra atalho contextual entre Diagnóstico Molecular e o Card de Aplicações
            const ctxPill = document.getElementById('context-pill');
            const ctxText = document.getElementById('context-pill-text');
            const ctxBtn = document.getElementById('context-pill-btn-label');

            if (sectionId === 'molecular') {
                ctxText.textContent = 'Card complementar no topo direito:';
                ctxBtn.textContent = 'Ver Aplicações ↗';
                ctxPill.dataset.target = 'aplicacoes';
                ctxPill.classList.remove('hidden');
            } else if (sectionId === 'aplicacoes') {
                ctxText.textContent = 'Seção principal no canto inferior esquerdo:';
                ctxBtn.textContent = '↙ Voltar a Diag. Molecular';
                ctxPill.dataset.target = 'molecular';
                ctxPill.classList.remove('hidden');
            } else {
                ctxPill.classList.add('hidden');
            }

            // Em celulares, recolhe o menu após clicar para liberar a visão do banner
            if (window.innerWidth < 768) {
                setDrawerState(false);
            }
        }

        // =========================================================================
        // 10. CONTROLES DA INTERFACE E UPLOAD DE IMAGEM PRÓPRIA
        // =========================================================================
        function syncRollUI(val) {
            const pct = Math.round(clamp(val, 0, 1) * 100);
            document.getElementById('slider-roll').value = pct;
            document.getElementById('roll-percent').textContent = `${pct}%`;

            const labelEl = document.getElementById('label-toggle-roll');
            const iconEl = document.getElementById('icon-roll');
            if (pct > 50) {
                labelEl.textContent = 'Enrolar Banner';
                iconEl.style.transform = 'rotate(0deg)';
            } else {
                labelEl.textContent = 'Desenrolar Banner';
                iconEl.style.transform = 'rotate(180deg)';
            }
        }

        function setActiveSectionUI(sectionId) {
            activeSectionId = sectionId;
            document.querySelectorAll('.nav-btn').forEach((btn) => {
                const isMatch = btn.dataset.section === sectionId ||
                    (sectionId === 'aplicacoes' && btn.dataset.section === 'molecular');
                btn.classList.toggle('active', isMatch);
                if (isMatch) {
                    btn.setAttribute('aria-current', 'true');
                } else {
                    btn.removeAttribute('aria-current');
                }
            });
        }

        function setDrawerState(open) {
            isDrawerOpen = open;
            const drawer = document.getElementById('sections-drawer');
            if (open) {
                drawer.classList.remove('opacity-0', 'scale-95', 'pointer-events-none', '-translate-x-4');
                drawer.classList.add('opacity-100', 'scale-100', 'pointer-events-auto', 'translate-x-0');
            } else {
                drawer.classList.add('opacity-0', 'scale-95', 'pointer-events-none', '-translate-x-4');
                drawer.classList.remove('opacity-100', 'scale-100', 'pointer-events-auto', 'translate-x-0');
            }
        }

        function bindUIEvents() {
            // Popula os botões de foco de seções
            const container = document.getElementById('section-buttons');
            SECTIONS_MENU.forEach((sec) => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'nav-btn text-left w-full px-2.5 py-2 rounded-xl border border-white/10 bg-white/5 flex items-center gap-2.5 cursor-pointer';
                btn.dataset.section = sec.id;
                btn.innerHTML = `
          <span class="w-7 h-7 rounded-lg bg-white/10 border border-white/10 flex items-center justify-center text-rose-200 shrink-0" aria-hidden="true">${sec.icon}</span>
          <div class="min-w-0">
            <div class="text-xs font-bold text-white truncate">${sec.label}</div>
            <div class="text-[10.5px] text-rose-100/75 truncate">${sec.sub}</div>
          </div>
        `;
                btn.addEventListener('click', () => focusSection(sec.id));
                container.appendChild(btn);
            });

            // Estado inicial do drawer (aberto em desktop, recolhido em mobile)
            setDrawerState(isDrawerOpen);

            document.getElementById('btn-toggle-menu').addEventListener('click', () => {
                setDrawerState(!isDrawerOpen);
            });
            document.getElementById('btn-close-drawer').addEventListener('click', () => {
                setDrawerState(false);
            });

            // Pular / Rever Intro
            document.getElementById('btn-skip-intro').addEventListener('click', () => finishIntro(true));
            document.getElementById('btn-replay-intro').addEventListener('click', () => replayIntro());

            // Reset de visão geral
            document.getElementById('btn-reset-view').addEventListener('click', () => focusSection('geral'));

            // Atalho contextual (Diagnóstico Molecular <-> Card de Aplicações)
            document.getElementById('btn-jump-aplicacoes').addEventListener('click', () => {
                const target = document.getElementById('context-pill').dataset.target || 'aplicacoes';
                focusSection(target);
            });

            // Botão alternador Enrolar / Desenrolar
            document.getElementById('btn-toggle-roll').addEventListener('click', () => {
                if (introState.active) finishIntro(true);
                targetUnrollProgress = unrollProgress > 0.5 ? 0.0 : 1.0;
                isRollAnimating = true;
                if (targetUnrollProgress === 0.0) {
                    triggerSectionHighlight(null);
                }
            });

            // Slider contínuo de enrolamento
            const slider = document.getElementById('slider-roll');
            slider.addEventListener('input', (e) => {
                if (introState.active) finishIntro(true);
                isUserDraggingSlider = true;
                isRollAnimating = false;
                const val = parseFloat(e.target.value) / 100;
                unrollProgress = val;
                targetUnrollProgress = val;
                syncRollUI(val);
                updateBannerDeformation(unrollProgress, clock.getElapsedTime());
                if (val < 0.96) triggerSectionHighlight(null);
            });
            slider.addEventListener('change', () => {
                isUserDraggingSlider = false;
            });

            // Upload opcional de imagem própria (.JPG/.PNG)
            const fileInput = document.getElementById('input-custom-image');
            const resetTexBtn = document.getElementById('btn-reset-texture');

            fileInput.addEventListener('change', (e) => {
                const file = e.target.files && e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        try {
                            const customTex = new THREE.Texture(img);
                            customTex.colorSpace = THREE.SRGBColorSpace;
                            customTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
                            customTex.needsUpdate = true;

                            if (currentBannerTexture && currentBannerTexture !== defaultBannerTexture) {
                                currentBannerTexture.dispose();
                            }
                            currentBannerTexture = customTex;
                            bannerFrontMesh.material.map = customTex;
                            bannerFrontMesh.material.needsUpdate = true;
                            resetTexBtn.classList.remove('hidden');
                            showToast('Imagem própria aplicada ao banner 3D!');
                        } catch (err) {
                            showToast('Não foi possível aplicar a imagem selecionada.');
                        }
                    };
                    img.onerror = () => showToast('Arquivo de imagem inválido.');
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
                fileInput.value = '';
            });

            resetTexBtn.addEventListener('click', () => {
                if (currentBannerTexture && currentBannerTexture !== defaultBannerTexture) {
                    currentBannerTexture.dispose();
                }
                currentBannerTexture = defaultBannerTexture;
                bannerFrontMesh.material.map = defaultBannerTexture;
                bannerFrontMesh.material.needsUpdate = true;
                resetTexBtn.classList.add('hidden');
                showToast('Textura fiel HD restaurada.');
            });
        }

        // =========================================================================
        // 11. INICIALIZAÇÃO DO THREE.JS E LOOP DE ANIMAÇÃO
        // =========================================================================
        function init() {
            try {
                const container = document.getElementById('canvas-container');

                scene = new THREE.Scene();

                camera = new THREE.PerspectiveCamera(
                    40,
                    window.innerWidth / Math.max(1, window.innerHeight),
                    0.02,
                    60
                );
                camera.position.set(0, 0.7, 0.95);

                renderer = new THREE.WebGLRenderer({
                    antialias: true,
                    powerPreference: 'high-performance'
                });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.outputColorSpace = THREE.SRGBColorSpace;
                renderer.toneMapping = THREE.ACESFilmicToneMapping;
                renderer.toneMappingExposure = 1.04;
                renderer.shadowMap.enabled = true;
                renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                container.appendChild(renderer.domElement);

                // OrbitControls com amortecimento suave e cancelamento imediato de animações automáticas
                controls = new OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.065;
                controls.enablePan = true;
                controls.screenSpacePanning = true;
                controls.minDistance = 0.24;  // Permite zoom bem próximo para ler referências
                controls.maxDistance = 6.2;
                controls.maxPolarAngle = Math.PI * 0.495; // Impede atravessar o piso do estúdio
                controls.target.set(0, 1.06, BANNER_Z);
                controls.enabled = false; // Habilitado ao término da intro

                // Ao arrastar ou dar zoom manualmente, cancela qualquer tween de câmera imediatamente
                controls.addEventListener('start', () => {
                    cameraTween = null;
                });

                // Constrói todos os elementos 3D
                buildStudioEnvironment();
                buildTripodModel();
                buildBannerModel();
                buildIntroDNAObjects();
                bindUIEvents();

                // Garante que fontes web estejam carregadas e re-renderiza a textura caso terminem depois
                if (document.fonts && document.fonts.ready) {
                    document.fonts.ready.then(() => {
                        if (currentBannerTexture === defaultBannerTexture) {
                            const crispTex = createBannerCanvasTexture();
                            defaultBannerTexture.dispose();
                            defaultBannerTexture = crispTex;
                            currentBannerTexture = crispTex;
                            bannerFrontMesh.material.map = crispTex;
                            bannerFrontMesh.material.needsUpdate = true;
                        }
                    });
                }

                // Evento responsivo de redimensionamento
                window.addEventListener('resize', onWindowResize);

                clock = new THREE.Clock();
                animate();
            } catch (err) {
                console.error('Erro ao inicializar a cena 3D:', err);
                showToast('Erro ao iniciar o WebGL. Verifique se o navegador suporta aceleração 3D.', 6000);
            }
        }

        function onWindowResize() {
            if (!camera || !renderer) return;
            camera.aspect = window.innerWidth / Math.max(1, window.innerHeight);
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            if (introState.active) {
                updateIntroAnimation(dt);
            } else {
                // Animação suave de enrolar/desenrolar acionada pelos botões
                if (isRollAnimating && !isUserDraggingSlider) {
                    const diff = targetUnrollProgress - unrollProgress;
                    if (Math.abs(diff) < 0.002) {
                        unrollProgress = targetUnrollProgress;
                        isRollAnimating = false;
                    } else {
                        // Velocidade natural com leve desaceleração
                        const step = Math.sign(diff) * Math.min(Math.abs(diff), dt * 0.65 + Math.abs(diff) * dt * 2.8);
                        unrollProgress = clamp(unrollProgress + step, 0, 1);
                    }
                    syncRollUI(unrollProgress);
                }

                // Atualiza malha da lona (espiral + leve balanço de tecido)
                updateBannerDeformation(unrollProgress, elapsed);

                // Interpolação suave da câmera ao focar seções
                if (cameraTween) {
                    cameraTween.elapsed += dt;
                    const t = easeInOutCubic(cameraTween.elapsed / cameraTween.duration);
                    camera.position.lerpVectors(cameraTween.startPos, cameraTween.endPos, t);
                    controls.target.lerpVectors(cameraTween.startTarget, cameraTween.endTarget, t);
                    if (cameraTween.elapsed >= cameraTween.duration) {
                        cameraTween = null;
                    }
                }

                // Atualiza pulso e fade-out do contorno luminoso da seção focada
                if (highlightState.active) {
                    highlightState.elapsed += dt;
                    const hT = highlightState.elapsed / highlightState.duration;
                    if (hT >= 1 || unrollProgress < 0.95) {
                        highlightState.active = false;
                        highlightGroup.visible = false;
                    } else {
                        const fadeIn = smoothstep(0.0, 0.12, hT);
                        const fadeOut = 1 - smoothstep(0.65, 1.0, hT);
                        const pulse = 0.72 + 0.28 * Math.sin(highlightState.elapsed * 7.5);
                        highlightMat.opacity = fadeIn * fadeOut * pulse * 0.92;
                    }
                }

                controls.update();
            }

            renderer.render(scene, camera);
        }

        // Inicia após o carregamento completo da página
        window.addEventListener('load', init);
    </script>
    <script src="./ecosystem-nav.js" defer data-page="banner.html" data-theme="dark" data-pos="banner"></script>
