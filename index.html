     * 1. MOTOR DE ÁUDIO PROCEDURAL (WEB AUDIO API - SEM DEPENDÊNCIAS EXTERNAS)
     * ============================================================================ */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.enabled) return null;
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      playTone(freq, duration = 0.12, type = 'sine', volume = 0.08, delay = 0) {
        if (!this.enabled) return;
        const ctx = this.init();
        if (!ctx) return;

        const startTime = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }

      playClick() {
        this.playTone(720, 0.055, 'triangle', 0.05);
      }

      playSuccess() {
        this.playTone(523.25, 0.14, 'sine', 0.07, 0);
        this.playTone(659.25, 0.16, 'sine', 0.07, 0.07);
        this.playTone(783.99, 0.22, 'triangle', 0.08, 0.14);
      }

      playError() {
        this.playTone(195, 0.14, 'sawtooth', 0.06, 0);
        this.playTone(145, 0.22, 'sawtooth', 0.06, 0.11);
      }

      playLabPulse(stepIdx = 0) {
        const base = 360 + stepIdx * 75;
        this.playTone(base, 0.1, 'sine', 0.06, 0);
        this.playTone(base * 1.25, 0.15, 'triangle', 0.06, 0.08);
      }

      playVictory() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((n, idx) => {
          this.playTone(n, 0.28, 'triangle', 0.08, idx * 0.09);
        });
      }
    }

    function CSS3DHelixFallback({ focusMode, paused }) {
      const rungs = ['A-T', 'C-G', 'G-C', 'T-A', 'C-G', 'A-T', 'G-C', 'T-A', 'A-T', 'C-G', 'G-C', 'T-A', 'C-G', 'A-T'];
      return (
        <div className="w-full h-full flex items-center justify-center helix-scene-3d overflow-hidden py-4">
          <div className={`helix-rotor-3d relative w-44 sm:w-52 h-[340px] flex flex-col justify-between items-center ${paused ? 'paused' : ''}`}>
            {rungs.map((pair, idx) => {
              const [leftBase, rightBase] = pair.split('-');
              const angle = idx * 26;
              const leftColor =
                focusMode === 'forensic' ? '#71717a' : '#FACC15';
              const rightColor =
                focusMode === 'biotech' ? '#71717a' : '#FDE047';

              return (
                <div
                  key={idx}
                  className="w-full flex items-center justify-between relative"
                  style={{
                    transform: `rotateY(${angle}deg)`,
                    transformStyle: 'preserve-3d',
                  }}
                >
                  <span
                    className="w-4 h-4 rounded-none shadow-lg flex items-center justify-center text-[9px] font-mono font-bold text-black border border-yellow-200"
                    style={{ backgroundColor: leftColor, boxShadow: `0 0 14px ${leftColor}` }}
                  >
                    {leftBase}
                  </span>
                  <div className="flex-1 h-1 mx-1 bg-gradient-to-r from-yellow-400 via-yellow-200 to-yellow-400 relative shadow-[0_0_10px_rgba(250,204,21,0.55)]">
                    <span className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-1.5 h-1.5 bg-white"></span>
                  </div>
                  <span
                    className="w-4 h-4 rounded-none shadow-lg flex items-center justify-center text-[9px] font-mono font-bold text-black border border-yellow-200"
                    style={{ backgroundColor: rightColor, boxShadow: `0 0 14px ${rightColor}` }}
                  >
                    {rightBase}
                  </span>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    function DNA3DViewer() {
      const mountRef = useRef(null);
      const [renderEngine, setRenderEngine] = useState(() =>
        typeof window !== 'undefined' && window.THREE ? 'webgl' : 'css3d'
      );
      const [focusMode, setFocusMode] = useState('dual');
      const [speedMult, setSpeedMult] = useState(1);
      const [webglError, setWebglError] = useState(false);

      const speedRef = useRef(1);
      const focusRef = useRef('dual');
      const dragRef = useRef({ active: false, lastX: 0, lastY: 0, rotX: 0.12, rotY: 0 });

      useEffect(() => {
        speedRef.current = speedMult;
      }, [speedMult]);

      useEffect(() => {
        focusRef.current = focusMode;
      }, [focusMode]);

      useEffect(() => {
        if (renderEngine !== 'webgl') return;
        const container = mountRef.current;
        if (!container || typeof window.THREE === 'undefined') {
          setRenderEngine('css3d');
          return;
        }

        const THREE = window.THREE;
        let renderer;
        let animId;

        try {
          const width = container.clientWidth || 420;
          const height = container.clientHeight || 420;

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(44, width / height, 0.1, 100);
          camera.position.set(0, 0, 12.5);

          renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true, powerPreference: 'high-performance' });
          renderer.setSize(width, height);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          container.innerHTML = '';
          container.appendChild(renderer.domElement);

          // Iluminação Tática com Brilho Amarelo Alerta (#FACC15)
          const ambientLight = new THREE.AmbientLight(0xfef08a, 0.55);
          scene.add(ambientLight);

          const yellowMainLight = new THREE.PointLight(0xfacc15, 2.8, 26);
          yellowMainLight.position.set(-4.5, 3.5, 6.5);
          scene.add(yellowMainLight);

          const yellowRimLight = new THREE.PointLight(0xfde047, 2.4, 24);
          yellowRimLight.position.set(5, -3, 5.5);
          scene.add(yellowRimLight);

          // DNA Group
          const dnaGroup = new THREE.Group();
          scene.add(dnaGroup);

          const totalPairs = 18;
          const heightSpan = 9.2;
          const radius = 1.65;
          const twist = 0.56;

          const sphereGeo = new THREE.SphereGeometry(0.19, 16, 16);
          const bondGeo = new THREE.CylinderGeometry(0.055, 0.055, 1, 10);
          const backboneGeo = new THREE.SphereGeometry(0.15, 14, 14);

          const strand1Meshes = [];
          const strand2Meshes = [];
          const strand1Mat = new THREE.MeshStandardMaterial({
            color: 0xfacc15,
            emissive: 0xfacc15,
            emissiveIntensity: 0.9,
            roughness: 0.25,
            metalness: 0.35,
          });
          const strand2Mat = new THREE.MeshStandardMaterial({
            color: 0xa1a1aa,
            emissive: 0xeab308,
            emissiveIntensity: 0.55,
            roughness: 0.25,
            metalness: 0.45,
          });

          const baseColors = [0xfacc15, 0xfde047, 0xd4d4d8, 0xeab308];

          for (let i = 0; i < totalPairs; i++) {
            const y = ((i / (totalPairs - 1)) - 0.5) * heightSpan;
            const angle = i * twist;

            const x1 = Math.cos(angle) * radius;
            const z1 = Math.sin(angle) * radius;
            const x2 = Math.cos(angle + Math.PI) * radius;
            const z2 = Math.sin(angle + Math.PI) * radius;

            const b1 = new THREE.Mesh(backboneGeo, strand1Mat);
            b1.position.set(x1, y, z1);
            dnaGroup.add(b1);
            strand1Meshes.push(b1);

            const b2 = new THREE.Mesh(backboneGeo, strand2Mat);
            b2.position.set(x2, y, z2);
            dnaGroup.add(b2);
            strand2Meshes.push(b2);

            const colorA = baseColors[i % 4];
            const colorB = baseColors[(i + 2) % 4];

            const p1 = new THREE.Vector3(x1, y, z1);
            const p2 = new THREE.Vector3(x2, y, z2);
            const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);

            const halfLen = p1.distanceTo(mid);
            const matA = new THREE.MeshStandardMaterial({
              color: colorA,
              emissive: colorA,
              emissiveIntensity: 0.45,
              roughness: 0.3,
            });
            const rungA = new THREE.Mesh(bondGeo, matA);
            rungA.position.copy(p1).lerp(mid, 0.5);
            rungA.scale.set(1, halfLen * 0.92, 1);
            rungA.quaternion.setFromUnitVectors(
              new THREE.Vector3(0, 1, 0),
              new THREE.Vector3().subVectors(mid, p1).normalize()
            );
            dnaGroup.add(rungA);

            const matB = new THREE.MeshStandardMaterial({
              color: colorB,
              emissive: colorB,
              emissiveIntensity: 0.45,
              roughness: 0.3,
            });
            const rungB = new THREE.Mesh(bondGeo, matB);
            rungB.position.copy(p2).lerp(mid, 0.5);
            rungB.scale.set(1, halfLen * 0.92, 1);
            rungB.quaternion.setFromUnitVectors(
              new THREE.Vector3(0, 1, 0),
              new THREE.Vector3().subVectors(mid, p2).normalize()
            );
            dnaGroup.add(rungB);

            const hNode = new THREE.Mesh(
              sphereGeo,
              new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0xfacc15,
                emissiveIntensity: 0.75,
              })
            );
            hNode.scale.set(0.55, 0.55, 0.55);
            hNode.position.copy(mid);
            dnaGroup.add(hNode);
          }

          // Partículas Amarelas de Varredura Forense
          const particleCount = 70;
          const particleGeo = new THREE.BufferGeometry();
          const positions = new Float32Array(particleCount * 3);
          for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 9.5;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 10.5;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 7.0;
          }
          particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          const particleMat = new THREE.PointsMaterial({
            color: 0xfacc15,
            size: 0.085,
            transparent: true,
            opacity: 0.72,
          });
          const particles = new THREE.Points(particleGeo, particleMat);
          scene.add(particles);

          const handleResize = () => {
            if (!container || !renderer) return;
            const w = container.clientWidth || 420;
            const h = container.clientHeight || 420;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
          };
          window.addEventListener('resize', handleResize);

          const clock = new THREE.Clock();
          const animate = () => {
            animId = requestAnimationFrame(animate);
            const dt = clock.getDelta();
            const elapsed = clock.getElapsedTime();

            if (!dragRef.current.active) {
              dragRef.current.rotY += dt * 0.72 * speedRef.current;
            }

            dnaGroup.rotation.y = dragRef.current.rotY;
            dnaGroup.rotation.x = dragRef.current.rotX;
            dnaGroup.rotation.z = Math.sin(elapsed * 0.6) * 0.08;
            dnaGroup.position.y = Math.sin(elapsed * 1.1) * 0.16;

            particles.rotation.y -= dt * 0.14 * (speedRef.current || 0.3);

            if (focusRef.current === 'biotech') {
              strand1Mat.emissiveIntensity = 1.35;
              strand2Mat.emissiveIntensity = 0.2;
              particleMat.color.setHex(0xfacc15);
            } else if (focusRef.current === 'forensic') {
              strand1Mat.emissiveIntensity = 0.25;
              strand2Mat.emissiveIntensity = 1.3;
              particleMat.color.setHex(0xfef08a);
            } else {
              strand1Mat.emissiveIntensity = 0.95;
              strand2Mat.emissiveIntensity = 0.75;
              particleMat.color.setHex(0xfacc15);
            }

            renderer.render(scene, camera);
          };
          animate();

          return () => {
            cancelAnimationFrame(animId);
            window.removeEventListener('resize', handleResize);
            if (renderer && renderer.dispose) renderer.dispose();
          };
        } catch (err) {
          setWebglError(true);
          setRenderEngine('css3d');
        }
      }, [renderEngine]);

      const onPointerDown = (e) => {
        dragRef.current.active = true;
        dragRef.current.lastX = e.clientX;
        dragRef.current.lastY = e.clientY;
      };

      const onPointerMove = (e) => {
        if (!dragRef.current.active) return;
        const dx = e.clientX - dragRef.current.lastX;
        const dy = e.clientY - dragRef.current.lastY;
        dragRef.current.rotY += dx * 0.012;
        dragRef.current.rotX = Math.max(-0.6, Math.min(0.6, dragRef.current.rotX + dy * 0.008));
        dragRef.current.lastX = e.clientX;
        dragRef.current.lastY = e.clientY;
      };

      const onPointerUp = () => {
        dragRef.current.active = false;
      };

      return (
        <div className="relative dossier-card rounded-none border-2 border-yellow-400/60 p-3 sm:p-4 overflow-hidden shadow-neon-yellow">
          {/* Faixa Policial Superior */}
          <div className="hazard-tape-thin h-2 w-full mb-3 border border-yellow-400/50" aria-hidden="true"></div>

          {/* HUD Corner Markers */}
          <div className="absolute top-3 left-2 w-4 h-4 border-t-2 border-l-2 border-yellow-400"></div>
          <div className="absolute top-3 right-2 w-4 h-4 border-t-2 border-r-2 border-yellow-400"></div>
          <div className="absolute bottom-2 left-2 w-4 h-4 border-b-2 border-l-2 border-yellow-400"></div>
          <div className="absolute bottom-2 right-2 w-4 h-4 border-b-2 border-r-2 border-yellow-400"></div>

          {/* Top Telemetry Strip */}
          <div className="flex flex-wrap items-center justify-between gap-2 text-[11px] font-mono text-zinc-200 border-b border-yellow-400/30 pb-2.5 mb-2">
            <span className="flex items-center gap-2 text-yellow-400 font-bold">
              <span className="w-2 h-2 bg-yellow-400 terminal-blink"></span>
              SCANNER MOLECULAR 3D // EVIDÊNCIA B-DNA
            </span>
            <button
              type="button"
              onClick={() => {
                soundEngine.playClick();
                if (!webglError) {
                  setRenderEngine((prev) => (prev === 'webgl' ? 'css3d' : 'webgl'));
                }
              }}
              className="px-2.5 py-0.5 rounded-none bg-zinc-900 hover:bg-yellow-400 hover:text-black border border-yellow-400/60 text-[10px] text-yellow-400 font-bold transition"
              title="Alternar motor de renderização 3D"
            >
              {renderEngine === 'webgl' ? 'MOTOR: THREE.JS WEBGL' : 'MOTOR: HOLOGRAMA CSS 3D'}
            </button>
          </div>

          {/* 3D Canvas / CSS 3D Viewport com Brilho Amarelo Sutil */}
          <div
            className="relative w-full h-[330px] sm:h-[400px] bg-black/90 border border-zinc-800 cursor-grab active:cursor-grabbing select-none touch-none"
            onPointerDown={onPointerDown}
            onPointerMove={onPointerMove}
            onPointerUp={onPointerUp}
            onPointerLeave={onPointerUp}
            role="region"
            aria-label="Visualização interativa da dupla hélice de DNA em 3D. Arraste para rotacionar."
          >
            {/* Brilho (Glow) Amarelo Sutil no DNA 3D */}
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_50%_50%,rgba(250,204,21,0.22),rgba(234,179,8,0.06)_45%,transparent_72%)] pointer-events-none"></div>
            <div className="scanline-overlay absolute inset-0"></div>

            {renderEngine === 'webgl' ? (
              <div ref={mountRef} className="w-full h-full relative z-10"></div>
            ) : (
              <CSS3DHelixFallback focusMode={focusMode} paused={speedMult === 0} />
            )}

            <div className="absolute bottom-2 left-3 right-3 flex items-center justify-between text-[10px] font-mono text-yellow-400/80 pointer-events-none z-20">
              <span>[ARRASTE PARA ROTACIONAR AMOSTRA]</span>
              <span>PASSO: 3.4 nm // 10.5 PB</span>
            </div>
          </div>

          {/* Controls */}
          <div className="mt-2 pt-2.5 border-t border-yellow-400/25 flex flex-wrap items-center justify-between gap-2">
            <div className="flex flex-wrap gap-1.5">
              {[
                { id: 'dual', label: 'DUPLA HÉLICE', cls: 'border-yellow-400 text-black bg-yellow-400 font-bold' },
                { id: 'biotech', label: 'FITA MÉDICA', cls: 'border-yellow-400 text-black bg-yellow-400 font-bold' },
                { id: 'forensic', label: 'FITA FORENSE', cls: 'border-yellow-400 text-black bg-yellow-400 font-bold' },
              ].map((m) => (
                <button
                  key={m.id}
                  type="button"
                  onClick={() => {
                    soundEngine.playClick();
                    setFocusMode(m.id);
                  }}
                  className={`px-2.5 py-1 rounded-none text-[11px] font-mono border transition ${
                    focusMode === m.id
                      ? m.cls
                      : 'border-zinc-700 bg-zinc-900 text-zinc-300 hover:border-yellow-400 hover:text-yellow-400'
                  }`}
                >
                  {m.label}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-1">
              {[
                { val: 0, label: 'PAUSA' },
                { val: 1, label: '1X' },
                { val: 2.2, label: '2X' },
              ].map((spd) => (
                <button
                  key={spd.label}
                  type="button"
                  onClick={() => {
                    soundEngine.playClick();
                    setSpeedMult(spd.val);
                  }}
                  className={`px-2 py-1 rounded-none text-[11px] font-mono border transition ${
                    speedMult === spd.val
                      ? 'bg-yellow-400 border-yellow-300 text-black font-bold'

                  }`}
                >

              ))}

          </div>
        </div>
      );
