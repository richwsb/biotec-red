                </p>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ============================================================================
     * 6. INTERAÇÃO 1: BIOLOGIA MOLECULAR (PAREAMENTO & CONSTRUÇÃO DA HÉLICE)
     * ============================================================================ */
    function MolecularPairingLab({ onCompleteMission }) {
      const [missionIdx, setMissionIdx] = useState(0);
      const mission = PAIRING_MISSIONS[missionIdx];

      const [pairs, setPairs] = useState(() => Array(mission.template.length).fill(null));
      const [activeSlot, setActiveSlot] = useState(0);
      const [dragOverSlot, setDragOverSlot] = useState(null);
      const [errorSlot, setErrorSlot] = useState(null);
      const [feedback, setFeedback] = useState({
        type: 'info',
        message: 'Clique ou arraste o nucleotídeo complementar (A↔T, C↔G) para parear a fita molde.',
      });
      const [mistakes, setMistakes] = useState(0);

      const resetMission = useCallback((idx) => {
        const nextMission = PAIRING_MISSIONS[idx];
        setMissionIdx(idx);
        setPairs(Array(nextMission.template.length).fill(null));
        setActiveSlot(0);
        setDragOverSlot(null);
        setErrorSlot(null);
        setMistakes(0);
        setFeedback({
          type: 'info',
          message: `Missão "${nextMission.title}" carregada. Complete os ${nextMission.template.length} pares da fita!`,
        });
      }, []);

      const completedCount = pairs.filter(Boolean).length;
      const isComplete = completedCount === mission.template.length;

      const attemptPair = useCallback(
        (slotIndex, chosenBase) => {
          if (isComplete) return;
          if (slotIndex < 0 || slotIndex >= mission.template.length) return;
          if (pairs[slotIndex]) {
            const firstEmpty = pairs.findIndex((p) => !p);
            if (firstEmpty !== -1) setActiveSlot(firstEmpty);
            return;
          }

          const templateBase = mission.template[slotIndex];
          const expectedBase = BASE_INFO[templateBase].pair;

          if (chosenBase === expectedBase) {
            soundEngine.playSuccess();
            const updated = [...pairs];
            updated[slotIndex] = chosenBase;
            setPairs(updated);
            setErrorSlot(null);

            const nextEmpty = updated.findIndex((p) => !p);
            setActiveSlot(nextEmpty === -1 ? slotIndex : nextEmpty);

            const justFinished = updated.every(Boolean);
            if (justFinished) {
              soundEngine.playVictory();
              onCompleteMission();
              setFeedback({
                type: 'success',
                message: `Dupla hélice estabilizada com 100% de precisão! Todas as ligações fosfodiéster e pontes de hidrogênio foram formadas.`,
              });
            } else {
              setFeedback({
                type: 'success',
                message: `Pareamento correto: ${BASE_INFO[templateBase].name} (${templateBase}) ↔ ${BASE_INFO[chosenBase].name} (${chosenBase}) com ${BASE_INFO[templateBase].bonds} pontes de hidrogênio!`,
              });
            }
          } else {
            soundEngine.playError();
            setMistakes((m) => m + 1);
            setErrorSlot(slotIndex);
            setTimeout(() => setErrorSlot(null), 500);
            setFeedback({
              type: 'error',
              message: `Incompatibilidade estérica! ${BASE_INFO[templateBase].name} (${templateBase}) pareia exclusivamente com ${BASE_INFO[expectedBase].name} (${expectedBase}), não com ${BASE_INFO[chosenBase].name} (${chosenBase}).`,
            });
          }
        },
        [isComplete, mission.template, onCompleteMission, pairs]
      );

      const handleKeyDown = (e) => {
        const key = e.key.toUpperCase();
        if (['A', 'T', 'C', 'G'].includes(key) && !isComplete) {
          attemptPair(activeSlot, key);
        }
      };

      const gcCount = mission.template.filter((b) => b === 'G' || b === 'C').length;
      const gcPercent = Math.round((gcCount / mission.template.length) * 100);
      const tmCelsius = 4 * gcCount + 2 * (mission.template.length - gcCount);

      return (
        <section
          id="pareamento"
          data-testid="pairing-section"
          tabIndex={-1}
          onKeyDown={handleKeyDown}
          className="py-16 sm:py-24 px-4 sm:px-6 max-w-7xl mx-auto focus:outline-none"
        >
          <SectionHeader
            eyebrow="Interação 01 // Bancada Forense"
            title="Pareamento & Construção da Dupla Hélice"
            accent="green"
            subtitle="Uma fita única de DNA expõe suas bases nitrogenadas. Arraste ou clique nos nucleotídeos livres (A, T, C, G) para sintetizar a fita complementar e validar a evidência."
          />

          {/* Mission Switcher */}
          <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div className="flex flex-wrap gap-2">
              {PAIRING_MISSIONS.map((m, idx) => (
                <button
                  key={m.id}
                  type="button"
                  data-testid={`mission-select-${m.id}`}
                  onClick={() => {
                    soundEngine.playClick();
                    resetMission(idx);
                  }}
                  className={`px-3.5 py-2 text-[11px] font-mono uppercase tracking-[0.1em] border transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] flex items-center gap-2 ${
                    missionIdx === idx
                      ? 'bg-zinc-950 border-yellow-400 text-yellow-400 font-semibold'
                      : 'bg-black border-zinc-800 text-zinc-400 hover:border-zinc-600 hover:text-zinc-100'
                  }`}
                >
                  <span
                    className={`w-1.5 h-1.5 ${
                      missionIdx === idx ? 'bg-yellow-400' : 'bg-zinc-700'
                    }`}
                  ></span>
                  {m.title}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-2 text-[11px] font-mono tabular-nums">
              <span className="px-3 py-1.5 bg-zinc-950 border border-zinc-800 text-zinc-400">
                PARES <strong className="text-yellow-400 ml-1">{completedCount}/{mission.template.length}</strong>
              </span>
              <span className="px-3 py-1.5 bg-zinc-950 border border-zinc-800 text-zinc-400">
                ERROS <strong className="text-zinc-100 ml-1">{mistakes}</strong>
              </span>
              <button
                type="button"
                data-testid="pairing-reset"
                onClick={() => {
                  soundEngine.playClick();
                  resetMission(missionIdx);
                }}
                className="px-3 py-1.5 bg-black hover:border-yellow-400 hover:text-yellow-400 text-zinc-300 border border-zinc-800 font-semibold uppercase tracking-[0.1em] transition-[border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
              >
                REINICIAR
              </button>
            </div>
          </div>

          <div className="bg-zinc-950 p-6 sm:p-8 border border-zinc-800 relative overflow-hidden">
            {/* Live Feedback Banner com Descriptografia Scramble */}
            <div
              role="status"
              aria-live="polite"
              data-testid="pairing-status"
              className={`mb-6 p-4 border text-xs sm:text-sm font-mono flex items-center gap-3 transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                feedback.type === 'success'
                  ? 'bg-yellow-400/[0.06] border-yellow-400 text-zinc-100'
                  : feedback.type === 'error'
                  ? 'bg-black border-yellow-500/80 text-yellow-300'
                  : 'bg-black border-zinc-800 text-zinc-300'
              }`}
            >
              <span
                className={`w-1.5 h-1.5 shrink-0 ${
                  feedback.type === 'success'
                    ? 'bg-yellow-400 terminal-cursor'
                    : feedback.type === 'error'
                    ? 'bg-yellow-500 terminal-cursor'
                    : 'bg-zinc-500'
                }`}
              ></span>
              <span className="relative z-10">
                {feedback.type === 'success' && <strong className="text-yellow-400 mr-2">[SCAN MATCH OK]</strong>}
                {feedback.type === 'error' && <strong className="text-yellow-400 mr-2">[ALERTA DE ERRO]</strong>}
                <ScrambleText text={feedback.message} />
              </span>
            </div>

            {/* Strand Pairing Canvas */}
            <div className="bg-black border border-zinc-800 p-4 sm:p-6 overflow-x-auto">
              <div className="min-w-[620px]">
                {/* Top Label */}
                <div className="flex flex-wrap items-center justify-between gap-2 text-[11px] font-mono text-zinc-400 mb-3">
                  <span className="text-yellow-400 font-semibold tracking-[0.1em]">3&apos; — FITA MOLDE (EXPOSTA) — 5&apos;</span>
                  <span className="font-sans text-zinc-500">{mission.description}</span>
                </div>

                {/* Template Backbone */}
                <div className="h-5 bg-zinc-950 border border-zinc-800 mb-3 flex items-center justify-between px-3">
                  <span className="text-[10px] font-mono uppercase tracking-[0.16em] text-zinc-400">
                    ESQUELETO AÇÚCAR-FOSFATO
                  </span>
                  <span className="w-16 h-px bg-yellow-400/50"></span>
                </div>

                {/* 8 Base Pair Columns */}
                <div className="grid grid-cols-8 gap-2 sm:gap-3 my-2">
                  {mission.template.map((tBase, idx) => {
                    const pairedBase = pairs[idx];
                    const isTarget = !pairedBase && activeSlot === idx;
                    const isError = errorSlot === idx;
                    const isDragTarget = dragOverSlot === idx;
                    const info = BASE_INFO[tBase];

                    return (
                      <div key={idx} className="flex flex-col items-center">
                        {/* Template Base */}
                        <div
                          className={`w-full py-2.5 border flex flex-col items-center justify-center transition-[border-color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${info.bgClass}`}
                        >
                          <NucleotideShapeIcon base={tBase} size={32} active={Boolean(pairedBase)} />
                          <span className="text-[10px] font-mono mt-1 font-semibold uppercase text-zinc-300">
                            {info.name}
                          </span>
                        </div>

                        {/* Hydrogen Bond Zone (SVG Line-Drawing quando pareado) */}
                        <div className="h-10 flex flex-col items-center justify-center my-1">
                          {pairedBase ? (
                            <svg
                              width="24"
                              height="36"
                              viewBox="0 0 24 36"
                              aria-hidden="true"
                              className="overflow-visible"
                            >
                              {Array.from({ length: info.bonds }).map((_, bIdx) => {
                                const x = info.bonds === 2 ? 8 + bIdx * 8 : 5 + bIdx * 7;
                                return (
                                  <line
                                    key={bIdx}
                                    x1={x}
                                    y1="2"
                                    x2={x}
                                    y2="34"
                                    stroke="#FACC15"
                                    strokeWidth="1.5"
                                    className="svg-draw-line"
                                    style={{ '--dash-len': 34, animationDelay: `${bIdx * 70}ms` }}
                                  />
                                );
                              })}
                            </svg>
                          ) : (
                            <span className="text-[10px] font-mono text-zinc-600 tabular-nums">
                              {info.bonds}H
                            </span>
                          )}
                        </div>

                        {/* Drop / Target Slot for Complementary Base */}
                        <button
                          type="button"
                          data-testid={`pairing-slot-${idx}`}
                          onClick={() => {
                            if (!pairedBase) {
                              soundEngine.playClick();
                              setActiveSlot(idx);
                            }
                          }}
                          onDragOver={(e) => {
                            e.preventDefault();
                            if (!pairedBase) setDragOverSlot(idx);
                          }}
                          onDragLeave={() => setDragOverSlot(null)}
                          onDrop={(e) => {
                            e.preventDefault();
                            setDragOverSlot(null);
                            const droppedBase = e.dataTransfer.getData('text/plain');
                            if (droppedBase) {
                              attemptPair(idx, droppedBase);
                            }
                          }}
                          aria-label={`Posição ${idx + 1}: Fita molde ${info.name}. ${
                            pairedBase ? `Pareado com ${BASE_INFO[pairedBase].name}` : 'Aguardando nucleotídeo complementar'
                          }`}
                          className={`w-full min-h-[76px] border flex flex-col items-center justify-center transition-[background-color,border-color,transform] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                            pairedBase
                              ? 'bg-yellow-400/[0.08] border-yellow-400 text-yellow-400 animate-tactical-in'
                              : isError
                              ? 'bg-zinc-950 border-yellow-500 text-yellow-300 animate-shake'
                              : isDragTarget
                              ? 'bg-yellow-400/15 border-yellow-400 scale-[1.03]'
                              : isTarget
                              ? 'bg-zinc-950 border-yellow-400'
                              : 'bg-black border-dashed border-zinc-800 hover:border-zinc-600'
                          }`}
                        >
                          {pairedBase ? (
                            <>
                              <NucleotideShapeIcon base={pairedBase} size={32} active />
                              <span className="text-[10px] font-mono text-yellow-400 mt-1 font-semibold">
                                ✓ {BASE_INFO[pairedBase].name}
                              </span>
                            </>
                          ) : (
                            <span
                              className={`text-[10px] font-mono px-1 text-center uppercase tracking-[0.08em] ${
                                isTarget ? 'text-yellow-400 font-bold' : 'text-zinc-600'
                              }`}
                            >
                              {isTarget ? `ALVO #${idx + 1}` : `#${idx + 1}`}
                            </span>
                          )}
                        </button>
                      </div>
                    );
                  })}
                </div>

                {/* Complementary Backbone */}
                <div className="h-2 bg-zinc-950 border border-zinc-800 mt-3 relative overflow-hidden">
                  <div
                    className="h-full bg-yellow-400 transition-[width] duration-300 ease-[cubic-bezier(0.16,1,0.3,1)]"
                    style={{ width: `${(completedCount / mission.template.length) * 100}%` }}
                  ></div>
                </div>
                <div className="flex flex-wrap items-center justify-between gap-2 text-[10px] font-mono text-zinc-500 mt-2.5">
                  <span className="text-zinc-300">5&apos; — FITA COMPLEMENTAR SINTETIZADA — 3&apos;</span>
                  <span>ATALHO: TECLAS A, T, C, G PAREIAM O ALVO SELECIONADO</span>
                </div>
              </div>
            </div>

            {/* Draggable / Clickable Free Nucleotides Dock OR Completed Double Helix Animation */}
            {!isComplete ? (
              <div className="mt-6">
                <div className="text-[11px] font-mono uppercase tracking-[0.14em] text-zinc-400 mb-3">
                  <span className="text-yellow-400 mr-1.5">&gt;</span>
                  NUCLEOTÍDEOS LIVRES — ARRASTE PARA O SLOT OU CLIQUE PARA PAREAR ALVO #{activeSlot + 1}
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  {['A', 'T', 'C', 'G'].map((b) => {
                    const info = BASE_INFO[b];
                    return (
                      <button
                        key={b}
                        type="button"
                        data-testid={`nucleotide-${b.toLowerCase()}`}
                        draggable
                        onDragStart={(e) => {
                          e.dataTransfer.setData('text/plain', b);
                          soundEngine.playClick();
                        }}
                        onClick={() => attemptPair(activeSlot, b)}
                        className="group bg-black hover:bg-zinc-900/90 hover:border-yellow-400 p-4 border border-zinc-800 cursor-grab active:cursor-grabbing transition-[background-color,border-color,transform] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] flex items-center gap-3 text-left active:scale-[0.98]"
                      >
                        <NucleotideShapeIcon base={b} size={38} />
                        <div>
                          <div className="font-display font-semibold text-zinc-100 group-hover:text-yellow-400 text-base flex items-center gap-2 transition-[color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]">
                            {info.name}
                            <span className="text-[10px] font-mono px-1.5 py-0.5 bg-zinc-900 border border-zinc-700 group-hover:border-yellow-400 group-hover:text-yellow-400 text-zinc-300">
                              {b}
                            </span>
                          </div>
                          <div className="text-[11px] font-mono text-zinc-500 mt-0.5 tabular-nums">
                            Pareia c/ {info.pair} ({info.bonds}H)
                          </div>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            ) : (
              <div
                data-testid="pairing-complete-banner"
                className="mt-6 bg-black border border-yellow-400 p-6 animate-tactical-in"
              >
                <div className="grid md:grid-cols-12 gap-6 items-center relative z-10">
                  <div className="md:col-span-7">
                    <span className="inline-flex items-center gap-2 px-2.5 py-1 bg-yellow-400 text-black text-[11px] font-mono font-bold uppercase tracking-[0.14em] mb-3">
                      <span className="w-1.5 h-1.5 bg-black"></span>
                      SÍNTESE VALIDADA // DUPLA HÉLICE ESTÁVEL
                    </span>
                    <h3 className="text-xl sm:text-2xl font-display font-semibold text-zinc-100 mb-2">
                      <ScrambleText text="Fitas Pareadas com 100% de Conformidade" />
                    </h3>
                    <p className="text-sm font-sans text-zinc-400 leading-relaxed mb-5 max-w-[65ch]">
                      As duas fitas antiparalelas (<code className="font-mono text-yellow-400">3&apos;→5&apos;</code> e{' '}
                      <code className="font-mono text-yellow-400">5&apos;→3&apos;</code>) acoplaram perfeitamente formando uma dupla hélice termodinamicamente estável.
                    </p>
                    <div className="grid grid-cols-3 gap-3 tabular-nums">
                      <div className="bg-zinc-950 border border-zinc-800 p-3">
                        <div className="text-[10px] font-mono uppercase tracking-[0.12em] text-zinc-500">CONTEÚDO GC</div>
                        <div className="text-xl font-display font-semibold text-yellow-400 mt-1">{gcPercent}%</div>
                      </div>
                      <div className="bg-zinc-950 border border-zinc-800 p-3">
                        <div className="text-[10px] font-mono uppercase tracking-[0.12em] text-zinc-500">TEMP. MELTING</div>
                        <div className="text-xl font-display font-semibold text-yellow-400 mt-1">{tmCelsius}°C</div>
                      </div>
                      <div className="bg-zinc-950 border border-zinc-800 p-3">
                        <div className="text-[10px] font-mono uppercase tracking-[0.12em] text-zinc-500">PRECISÃO</div>
                        <div className="text-xl font-display font-semibold text-zinc-100 mt-1">
                          {Math.max(0, Math.round((mission.template.length / (mission.template.length + mistakes)) * 100))}%
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Mini Rotating 3D Formed Double Helix */}
                  <div className="md:col-span-5 flex flex-col items-center justify-center bg-zinc-950 border border-zinc-800 p-4 h-56 overflow-hidden">
                    <div className="helix-scene-3d w-full h-full flex items-center justify-center">
                      <div className="helix-rotor-3d w-36 h-44 flex flex-col justify-between">
                        {mission.template.map((tB, i) => (
                          <div
                            key={i}
                            className="flex items-center justify-between"
                            style={{ transform: `rotateY(${i * 36}deg)`, transformStyle: 'preserve-3d' }}
                          >
                            <span className="w-5 h-5 border border-yellow-400 bg-black text-[10px] font-mono font-bold text-yellow-400 flex items-center justify-center">
                              {tB}
                            </span>
                            <span className="flex-1 h-px mx-1.5 bg-yellow-400/70"></span>
                            <span className="w-5 h-5 border border-zinc-500 bg-black text-[10px] font-mono font-bold text-zinc-200 flex items-center justify-center">
                              {pairs[i]}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </section>
      );
    }

    /* ============================================================================
     * 7. INTERAÇÃO 2: O PASSO A PASSO DO LABORATÓRIO (STEPPER 5 FASES)
     * ============================================================================ */
    const PIPELINE_STEPS = [
      {
        id: 'coleta',
        number: '01',
        title: 'Coleta',
        subtitle: 'Captura da Amostra Biológica',
        summary:
          'Um swab estéril de algodão coleta células epiteliais da saliva ou vestígios de sangue sem contaminar a amostra.',
        actionLabel: 'Coletar Amostra com Swab',
        equipment: 'Swab Estéril & Microtubo DNA-Free',
        scienceNote:
          'Cada célula nucleada humana contém cerca de 6 picogramas de DNA. A cadeia de custódia inicia aqui com vedação e identificação única.',
      },
      {
        id: 'extracao',
        number: '02',
        title: 'Extração',
        subtitle: 'Lise Celular e Purificação',
        summary:
          'Detergentes e proteinase K rompem as membranas celulares e nucleares, separando lipídios e proteínas para isolar o DNA puro.',
        actionLabel: 'Romper Células & Isolar DNA',
        equipment: 'Tampão de Lise + Centrífuga Refrigerada',
        scienceNote:
          'Lipídios e proteínas desnaturadas precipitam no fundo (pellet), enquanto os ácidos nucleicos puros permanecem dissolvidos no sobrenadante aquoso.',
      },
      {
        id: 'pcr',
        number: '03',
        title: 'PCR',
        subtitle: 'Amplificação no Termociclador',
        summary:
          'A Reação em Cadeia da Polimerase alterna temperaturas (95°C, 58°C, 72°C) para multiplicar uma única região de DNA em milhões de cópias.',
        actionLabel: 'Iniciar Ciclos do Termociclador',
        equipment: 'Termociclador + Taq Polimerase + Primers',
        scienceNote:
          'A amplificação é exponencial (2ⁿ): após 30 ciclos, 1 molécula-alvo gera mais de 1 bilhão de cópias idênticas para análise.',
      },
      {
        id: 'analise',
        number: '04',
        title: 'Análise',
        subtitle: 'Eletroforese em Gel',
        summary:
          'Os fragmentos amplificados migram em um gel sob corrente elétrica do polo negativo (-) ao positivo (+), gerando um padrão de bandas por tamanho.',
        actionLabel: 'Aplicar Corrente & Revelar Bandas',
        equipment: 'Cuba de Eletroforese + Transiluminador UV',
        scienceNote:
          'Como o grupo fosfato confere carga negativa ao DNA, ele migra rumo ao polo positivo. Fragmentos menores atravessam os poros do gel mais rapidamente.',
      },
      {
        id: 'comparacao',
        number: '05',
        title: 'Comparação',
        subtitle: 'Match com Banco de Dados',
        summary:
          'O perfil de bandas obtido é confrontado lado a lado com perfis de suspeitos (Forense) ou de variantes clínicas (Biotecnologia Vermelha).',
        actionLabel: 'Escanear Banco de Dados',
        equipment: 'Software CODIS / Genômica Clínica',
        scienceNote:
          'Um alinhamento perfeito confirma com rigor estatístico a autoria em investigações ou a presença de mutações patogênicas no diagnóstico médico.',
      },
    ];

    function LaboratoryPipelineStepper({ onCompletePipeline }) {
      const [currentStep, setCurrentStep] = useState(0);
      const [contextMode, setContextMode] = useState('forense');
      const [executedSteps, setExecutedSteps] = useState({});
      const [simRunning, setSimRunning] = useState(false);
      const [pcrCycle, setPcrCycle] = useState(0);
      const simTimerRef = useRef(null);

      const step = PIPELINE_STEPS[currentStep];
      const isStepDone = Boolean(executedSteps[step.id]);
      const completedTotal = Object.keys(executedSteps).length;

      const clearSimTimer = useCallback(() => {
        if (simTimerRef.current) {
          clearInterval(simTimerRef.current);
          clearTimeout(simTimerRef.current);
          simTimerRef.current = null;
        }
      }, []);

      useEffect(() => {
        return () => clearSimTimer();
      }, [clearSimTimer]);

      useEffect(() => {
        if (completedTotal === PIPELINE_STEPS.length) {
          onCompletePipeline();
        }
      }, [completedTotal, onCompletePipeline]);

      const markStepExecuted = useCallback((stepId) => {
        setExecutedSteps((prev) => (prev[stepId] ? prev : { ...prev, [stepId]: true }));
      }, []);

      const runSimulation = () => {
        if (simRunning) return;
        clearSimTimer();
        soundEngine.playLabPulse(currentStep);
        setSimRunning(true);

        if (step.id === 'pcr') {
          setPcrCycle(0);
          let cycle = 0;
          const targetId = step.id;
          simTimerRef.current = setInterval(() => {
            cycle += 5;
            setPcrCycle(cycle);
            if (cycle >= 30) {
              clearSimTimer();
              setSimRunning(false);
              markStepExecuted(targetId);
              soundEngine.playSuccess();
            }
          }, 260);
        } else {
          const targetId = step.id;
          const isFinal = currentStep === PIPELINE_STEPS.length - 1;
          simTimerRef.current = setTimeout(() => {
            simTimerRef.current = null;
            setSimRunning(false);
            markStepExecuted(targetId);
            if (isFinal) {
              soundEngine.playVictory();
            } else {
              soundEngine.playSuccess();
            }
          }, 1450);
        }
      };

      return (
        <section
          id="pipeline"
          data-testid="pipeline-section"
          className="py-16 sm:py-24 px-4 sm:px-6 max-w-7xl mx-auto"
        >
          <SectionHeader
            eyebrow="Interação 02 // Cadeia de Custódia Pericial"
            title="O Passo a Passo do Laboratório (5 Fases)"
            accent="cyan"
            subtitle="Execute cada fase do protocolo tático — Coleta, Extração, PCR, Análise e Comparação — para processar a evidência biológica e emitir o laudo de Match."
          />

          {/* Scenario Context Toggle + Progress */}
          <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div className="inline-flex bg-black border border-zinc-800 divide-x divide-zinc-800">
              <button
                type="button"
                data-testid="context-mode-forense"
                onClick={() => {
                  soundEngine.playClick();
                  setContextMode('forense');
                }}
                className={`px-4 py-2 text-[11px] font-mono uppercase tracking-[0.1em] transition-[background-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                  contextMode === 'forense'
                    ? 'bg-yellow-400 text-black font-bold'
                    : 'text-zinc-400 hover:text-zinc-100 hover:bg-zinc-950'
                }`}
              >
                MODO FORENSE (SUSPEITOS)
              </button>
              <button
                type="button"
                data-testid="context-mode-clinico"
                onClick={() => {
                  soundEngine.playClick();
                  setContextMode('clinico');
                }}
                className={`px-4 py-2 text-[11px] font-mono uppercase tracking-[0.1em] transition-[background-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                  contextMode === 'clinico'
                    ? 'bg-yellow-400 text-black font-bold'
                    : 'text-zinc-400 hover:text-zinc-100 hover:bg-zinc-950'
                }`}
              >
                MODO DIAGNÓSTICO (DOENÇAS)
              </button>
            </div>

            <div className="text-[11px] font-mono text-zinc-400 bg-zinc-950 border border-zinc-800 px-3.5 py-2 tabular-nums">
              PROTOCOLO:{' '}
              <span className="text-yellow-400 font-bold ml-1">{completedTotal} / 5 FASES VALIDADAS</span>
            </div>
          </div>

          {/* 5-Step Interactive Stepper Bar */}
          <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5 mb-6" role="tablist" aria-label="Fases do laboratório">
            {PIPELINE_STEPS.map((s, idx) => {
              const active = idx === currentStep;
              const done = Boolean(executedSteps[s.id]);
              return (
                <button
                  key={s.id}
                  type="button"
                  role="tab"
                  data-testid={`stepper-${s.id}`}
                  aria-selected={active}
                  onClick={() => {
                    soundEngine.playClick();
                    clearSimTimer();
                    setCurrentStep(idx);
                    setSimRunning(false);
                  }}
                  className={`p-3.5 border text-left transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] relative overflow-hidden ${
                    idx === 4 ? 'col-span-2 sm:col-span-1 ' : ''
                  }${
                    active
                      ? 'bg-zinc-950 border-yellow-400 text-zinc-100'
                      : done
                      ? 'bg-black border-zinc-700 text-zinc-200 hover:border-zinc-500'
                      : 'bg-black border-zinc-800 hover:border-zinc-600 text-zinc-400'
                  }`}
                >
                  {active && <span className="absolute top-0 inset-x-0 h-0.5 bg-yellow-400" aria-hidden="true"></span>}
                  <div className="flex items-center justify-between mb-1.5">
                    <span
                      className={`text-[10px] font-mono uppercase tracking-[0.14em] tabular-nums ${
                        active ? 'text-yellow-400 font-bold' : done ? 'text-zinc-300' : 'text-zinc-500'
                      }`}
                    >
                      FASE {s.number}
                    </span>
                    {done && (
                      <span
                        className={`w-4 h-4 text-[10px] font-mono font-bold flex items-center justify-center ${
                          active ? 'bg-yellow-400 text-black' : 'bg-zinc-800 text-yellow-400'
                        }`}
                      >
                        ✓
                      </span>
                    )}
                  </div>
                  <div className={`font-display font-semibold text-sm sm:text-base ${active ? 'text-white' : 'text-zinc-200'}`}>
                    {s.title}
                  </div>
                  <div className="text-[11px] font-sans truncate text-zinc-500 mt-0.5">
                    {s.subtitle}
                  </div>
                </button>
              );
            })}
          </div>

          {/* Active Lab Station */}
          <div className="bg-zinc-950 border border-zinc-800 p-6 sm:p-8">
            <div className="grid lg:grid-cols-12 gap-8 items-center">
              {/* Left Info & Controls */}
              <div className="lg:col-span-5 space-y-4">
                <div className="flex flex-wrap items-center gap-2.5">
                  <span className="px-2 py-0.5 bg-yellow-400 text-black font-bold text-[10px] font-mono uppercase tracking-[0.14em] tabular-nums">
                    ETAPA {step.number} / 05
                  </span>
                  <span className="text-[11px] font-mono text-zinc-400">{step.equipment}</span>
                </div>

                <h3 className="text-2xl sm:text-3xl font-display font-semibold tracking-[-0.02em] text-zinc-100">
                  {step.title}: {step.subtitle}
                </h3>

                <p className="text-sm font-sans text-zinc-300 leading-relaxed max-w-[60ch]">
                  {step.summary}
                </p>

                <div className="p-4 bg-black border border-zinc-800 text-xs sm:text-sm font-sans text-zinc-300 leading-relaxed">
                  <strong className="font-mono text-[11px] uppercase tracking-[0.14em] text-yellow-400 block mb-1.5">
                    &gt;_ LAUDO TÉCNICO DE BANCADA
                  </strong>
                  {step.scienceNote}
                </div>

                <div className="flex flex-wrap items-center gap-3 pt-2">
                  <button
                    type="button"
                    data-testid="pipeline-execute-btn"
                    onClick={runSimulation}
                    disabled={simRunning}
                    className={`px-5 py-3 font-mono uppercase font-bold text-xs tracking-[0.1em] border transition-[background-color,border-color,color,transform] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] flex items-center gap-2 active:scale-[0.98] ${
                      simRunning
                        ? 'bg-black border-yellow-400 text-yellow-400 cursor-wait'
                        : 'bg-yellow-400 border-yellow-400 text-black hover:bg-yellow-300'
                    }`}
                  >
                    {simRunning ? (
                      <ScrambleText text="PROCESSANDO EVIDÊNCIA..." duration={180} />
                    ) : isStepDone ? (
                      `✓ REEXECUTAR: ${step.title.toUpperCase()}`
                    ) : (
                      step.actionLabel.toUpperCase()
                    )}
                  </button>

                  {currentStep < PIPELINE_STEPS.length - 1 && (
                    <button
                      type="button"
                      data-testid="pipeline-next-btn"
                      onClick={() => {
                        soundEngine.playClick();
                        clearSimTimer();
                        setSimRunning(false);
                        setCurrentStep((s) => s + 1);
                      }}
                      className="px-4 py-3 border border-zinc-800 bg-black hover:border-yellow-400 hover:text-yellow-400 text-xs font-mono uppercase tracking-[0.1em] text-zinc-300 transition-[border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
                    >
                      PRÓXIMA FASE →
                    </button>
                  )}
                </div>
              </div>

              {/* Right Interactive Animated Lab Viewport */}
              <div
                data-testid="pipeline-viewport"
                className={`lg:col-span-7 bg-black border p-5 sm:p-6 min-h-[320px] flex flex-col justify-between relative overflow-hidden transition-[border-color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                  isStepDone || simRunning ? 'border-yellow-400/70' : 'border-zinc-800'
                }`}
              >
                <div className="scanline-overlay absolute inset-0"></div>

                {/* Viewport Header */}
                <div className="relative z-10 flex items-center justify-between text-[11px] font-mono text-zinc-400 border-b border-zinc-800 pb-3 mb-4">
                  <span className="text-zinc-200 tracking-[0.12em]">
                    TERMINAL CSI // CÂMARA {step.id.toUpperCase()}
                  </span>
                  <span
                    className={`flex items-center gap-2 tracking-[0.1em] ${
                      isStepDone ? 'text-yellow-400 font-bold' : simRunning ? 'text-yellow-400' : 'text-zinc-500'
                    }`}
                  >
                    <span
                      className={`w-1.5 h-1.5 ${
                        isStepDone
                          ? 'bg-yellow-400'
                          : simRunning
                          ? 'bg-yellow-400 terminal-cursor'
                          : 'bg-zinc-600'
                      }`}
                    ></span>
                    {simRunning ? (
                      <ScrambleText text="ESCANEANDO..." />
                    ) : isStepDone ? (
                      <ScrambleText text="LAUDO VALIDADO" />
                    ) : (
                      'AGUARDANDO COMANDO'
                    )}
                  </span>
                </div>

                {/* STAGE 1: COLETA */}
                {step.id === 'coleta' && (
                  <div className="relative z-10 flex-1 flex flex-col items-center justify-center py-2">
                    <div className="relative w-full max-w-md h-48 flex items-center justify-around">
                      {/* Swab Técnico SVG */}
                      <div className={`flex flex-col items-center ${simRunning || isStepDone ? 'animate-swab' : ''}`}>
                        <svg width="36" height="110" viewBox="0 0 36 110" aria-hidden="true">
                          <line x1="18" y1="6" x2="18" y2="74" stroke="#A1A1AA" strokeWidth="2.5" />
                          <polygon
                            points="12,74 24,74 21,102 15,102"
                            fill={simRunning || isStepDone ? '#FACC15' : '#18181B'}
                            fillOpacity="0.25"
                            stroke="#FACC15"
                            strokeWidth="1.5"
                          />
                        </svg>
                        <span className="text-[10px] font-mono text-zinc-400 mt-1">Swab Estéril</span>
                      </div>

                      {/* Target Biological Specimen Reticle */}
                      <div className="flex flex-col items-center">
                        <div className="w-24 h-24 border border-zinc-800 bg-zinc-950 flex items-center justify-center relative">
                          <svg width="72" height="72" viewBox="0 0 72 72" aria-hidden="true">
                            <rect x="6" y="6" width="60" height="60" fill="none" stroke="#27272A" strokeDasharray="4 4" />
                            <line x1="36" y1="2" x2="36" y2="14" stroke="#FACC15" strokeWidth="1" />
                            <line x1="36" y1="58" x2="36" y2="70" stroke="#FACC15" strokeWidth="1" />
                            <line x1="2" y1="36" x2="14" y2="36" stroke="#FACC15" strokeWidth="1" />
                            <line x1="58" y1="36" x2="70" y2="36" stroke="#FACC15" strokeWidth="1" />
                            <polygon
                              points="36,18 52,27 52,45 36,54 20,45 20,27"
                              fill="#FACC15"
                              fillOpacity={simRunning ? '0.28' : isStepDone ? '0.18' : '0.06'}
                              stroke="#FACC15"
                              strokeWidth="1.5"
                              className={simRunning || isStepDone ? 'svg-draw-line' : ''}
                              style={{ '--dash-len': 120 }}
                            />
                          </svg>
                          <span className="absolute -bottom-6 text-[10px] font-mono text-zinc-300 whitespace-nowrap">
                            {contextMode === 'forense' ? 'Vestígio Criminal' : 'Saliva / Mucosa'}
                          </span>
                        </div>
                      </div>

                      {/* Microtubo Graduado */}
                      <div className="flex flex-col items-center">
                        <div className="w-12 h-24 border border-zinc-700 relative overflow-hidden bg-zinc-950">
                          <div
                            className={`absolute bottom-0 inset-x-0 transition-[height,background-color] duration-700 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                              isStepDone
                                ? 'h-14 bg-yellow-400/35 border-t border-yellow-400'
                                : simRunning
                                ? 'h-9 bg-yellow-400/20 border-t border-yellow-400/60'
                                : 'h-2 bg-zinc-800'
                            }`}
                          ></div>
                        </div>
                        <span className="text-[10px] font-mono text-yellow-400 mt-1 tabular-nums">Tubo #CSI-042</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* STAGE 2: EXTRAÇÃO */}
                {step.id === 'extracao' && (
                  <div className="relative z-10 flex-1 flex flex-col items-center justify-center py-2">
                    <div className="w-full max-w-md flex flex-col items-center">
                      <div className="relative w-48 h-44 flex items-center justify-center">
                        <svg width="180" height="150" viewBox="0 0 180 150" aria-hidden="true">
                          {/* Membrana Celular & Nuclear */}
                          <polygon
                            points="90,8 156,42 156,108 90,142 24,108 24,42"
                            fill="none"
                            stroke={simRunning || isStepDone ? '#3F3F46' : '#FACC15'}
                            strokeWidth="1.2"
                            strokeDasharray={simRunning || isStepDone ? '5 5' : 'none'}
                          />
                          <polygon
                            points="90,26 136,50 136,100 90,124 44,100 44,50"
                            fill="none"
                            stroke={simRunning || isStepDone ? '#52525B' : '#71717A'}
                            strokeWidth="1"
                            strokeDasharray="3 3"
                          />
                          {/* Fitas de DNA Purificadas com SVG Line-Drawing */}
                          <path
                            d="M42,60 Q66,40 90,60 T138,60"
                            fill="none"
                            stroke="#FACC15"
                            strokeWidth="2.2"
                            className={simRunning || isStepDone ? 'svg-draw-line' : ''}
                            style={{ '--dash-len': 130 }}
                          />
                          <path
                            d="M42,90 Q66,110 90,90 T138,90"
                            fill="none"
                            stroke="#E4E4E7"
                            strokeWidth="2.2"
                            className={simRunning || isStepDone ? 'svg-draw-line' : ''}
                            style={{ '--dash-len': 130 }}
                          />
                          <line x1="60" y1="53" x2="60" y2="97" stroke="#FACC15" strokeWidth="1.4" />
                          <line x1="90" y1="60" x2="90" y2="90" stroke="#FACC15" strokeWidth="1.4" />
                          <line x1="120" y1="53" x2="120" y2="97" stroke="#FACC15" strokeWidth="1.4" />
                        </svg>
                      </div>

                      <div className="text-[11px] font-mono text-yellow-400 font-semibold uppercase tracking-[0.12em] mb-3">
                        {isStepDone ? <ScrambleText text="DNA PURO ISOLADO" /> : 'LISE CELULAR + PRECIPITAÇÃO'}
                      </div>

                      <div className="grid grid-cols-3 gap-2 w-full text-center text-[10px] font-mono">
                        <div className="p-2 bg-zinc-950 border border-zinc-800 text-zinc-400">
                          Lipídios removidos
                        </div>
                        <div className="p-2 bg-zinc-950 border border-zinc-800 text-zinc-400">
                          Proteínas digeridas
                        </div>
                        <div
                          className={`p-2 border font-semibold ${
                            isStepDone
                              ? 'bg-yellow-400 border-yellow-400 text-black'
                              : 'bg-zinc-950 border-zinc-800 text-zinc-300'
                          }`}
                        >
                          DNA Purificado
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* STAGE 3: PCR */}
                {step.id === 'pcr' && (
                  <div className="relative z-10 flex-1 flex flex-col justify-center py-2">
                    <div className="grid sm:grid-cols-3 gap-2.5 mb-4">
                      {[
                        { label: 'Desnaturação', temp: '95°C', active: simRunning && pcrCycle % 15 === 5 },
                        { label: 'Anelamento', temp: '58°C', active: simRunning && pcrCycle % 15 === 10 },
                        { label: 'Extensão (Taq)', temp: '72°C', active: simRunning && pcrCycle % 15 === 0 },
                      ].map((phase) => (
                        <div
                          key={phase.label}
                          className={`p-3 border text-center transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                            phase.active
                              ? 'bg-yellow-400 border-yellow-400 text-black'
                              : 'bg-zinc-950 border-zinc-800 text-zinc-200'
                          }`}
                        >
                          <div className="text-lg font-display font-bold tabular-nums">{phase.temp}</div>
                          <div className="text-[10px] font-mono uppercase tracking-[0.1em]">{phase.label}</div>
                        </div>
                      ))}
                    </div>

                    <div className="bg-zinc-950 border border-zinc-800 p-4">
                      <div className="flex items-center justify-between text-xs font-mono mb-3 tabular-nums">
                        <span className="text-zinc-400">
                          CICLO TÉRMICO: <strong className="text-yellow-400">{isStepDone ? 30 : pcrCycle} / 30</strong>
                        </span>
                        <span className="text-yellow-400 font-bold">
                          CÓPIAS: {isStepDone ? '1.073.741.824' : Math.pow(2, pcrCycle).toLocaleString('pt-BR')}
                        </span>
                      </div>

                      <div className="flex flex-wrap gap-1.5 items-center justify-center min-h-[54px]">
                        {Array.from({ length: Math.min(24, Math.max(1, isStepDone ? 24 : pcrCycle + 1)) }).map((_, idx) => (
                          <div
                            key={idx}
                            className="w-6 h-1.5 bg-yellow-400 animate-tactical-in"
                          ></div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* STAGE 4: ANÁLISE (ELETROFORESE) */}
                {step.id === 'analise' && (
                  <div className="relative z-10 flex-1 flex flex-col justify-center py-2">
                    <div className="bg-zinc-950 border border-zinc-800 p-4 relative">
                      <div className="flex justify-between text-[10px] font-mono uppercase tracking-[0.12em] mb-2">
                        <span className="text-zinc-400">POLO NEGATIVO (-)</span>
                        <span className="text-yellow-400 font-semibold">POLO POSITIVO (+) MIGRAÇÃO</span>
                      </div>

                      <div className="grid grid-cols-4 gap-3 h-40 bg-black border border-zinc-800 p-3 relative overflow-hidden">
                        {['Ladder', 'Amostra #042', 'Controle (+)', 'Controle (-)'].map((lane, lIdx) => {
                          const bandOffsets =
                            lIdx === 0
                              ? [20, 42, 65, 92, 115]
                              : lIdx === 1
                              ? [28, 72, 108]
                              : lIdx === 2
                              ? [28, 72, 108]
                              : [];
                          return (
                            <div key={lane} className="relative border-r last:border-r-0 border-zinc-800/80 flex flex-col items-center">
                              <div className="w-8 h-1.5 bg-zinc-800 mb-2"></div>
                              <span className="text-[9px] font-mono text-zinc-500 text-center">{lane}</span>
                              {(simRunning || isStepDone) &&
                                bandOffsets.map((y, bIdx) => (
                                  <div
                                    key={bIdx}
                                    style={{ '--target-y': `${y}px` }}
                                    className={`animate-gel-band absolute top-6 w-10 h-1 ${
                                      lIdx === 1 ? 'bg-yellow-400' : 'bg-zinc-400'
                                    }`}
                                  ></div>
                                ))}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}

                {/* STAGE 5: COMPARAÇÃO */}
                {step.id === 'comparacao' && (
                  <div className="relative z-10 flex-1 flex flex-col justify-center py-2">
                    <div className="grid grid-cols-4 gap-3 relative">
                      {simRunning && (
                        <div className="animate-scan absolute inset-x-0 h-px bg-yellow-400 z-20"></div>
                      )}

                      {isStepDone && (
                        <svg
                          viewBox="0 0 400 160"
                          preserveAspectRatio="none"
                          aria-hidden="true"
                          className="pointer-events-none absolute inset-0 w-full h-full z-20"
                        >
                          {[54, 88, 118].map((yPos, lIdx) => (
                            <g key={lIdx}>
                              <line
                                x1="50"
                                y1={yPos}
                                x2="250"
                                y2={yPos}
                                stroke="#FACC15"
                                strokeWidth="1.2"
                                strokeDasharray="4 3"
                                className="svg-draw-line"
                                style={{ '--dash-len': 220, animationDelay: `${lIdx * 90}ms` }}
                              />
                              <circle cx="50" cy={yPos} r="2.2" fill="#FACC15" />
                              <circle cx="250" cy={yPos} r="2.2" fill="#FACC15" />
                            </g>
                          ))}
                        </svg>
                      )}

                      {[
                        {
                          name: 'Amostra Coletada',
                          bands: [18, 48, 74],
                          isTarget: true,
                        },
                        {
                          name: contextMode === 'forense' ? 'Perfil DB #01' : 'Alelo Saudável',
                          bands: [26, 62, 85],
                          isMatch: false,
                        },
                        {
                          name: contextMode === 'forense' ? 'Perfil DB #02 (Alvo)' : 'Mutação Alvo',
                          bands: [18, 48, 74],
                          isMatch: true,
                        },
                        {
                          name: contextMode === 'forense' ? 'Perfil DB #03' : 'Variante Neutra',
                          bands: [14, 55, 90],
                          isMatch: false,
                        },
                      ].map((col, idx) => (
                        <div
                          key={idx}
                          className={`border p-2.5 flex flex-col items-center transition-[background-color,border-color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                            isStepDone && col.isMatch
                              ? 'bg-yellow-400/[0.08] border-yellow-400'
                              : col.isTarget
                              ? 'bg-zinc-950 border-zinc-600'
                              : 'bg-zinc-950 border-zinc-800'
                          }`}
                        >
                          <span className="text-[10px] font-mono text-center text-zinc-300 mb-2 h-7 flex items-center">
                            {col.name}
                          </span>
                          <div className="w-full h-28 bg-black border border-zinc-800 relative">
                            {col.bands.map((topPct, bIdx) => (
                              <div
                                key={bIdx}
                                style={{ top: `${topPct}%` }}
                                className={`absolute left-2 right-2 h-1 ${
                                  isStepDone && (col.isMatch || col.isTarget)
                                    ? 'bg-yellow-400'
                                    : 'bg-zinc-600'
                                }`}
                              ></div>
                            ))}
                          </div>
                          {isStepDone && col.isMatch && (
                            <span className="mt-2 px-1.5 py-0.5 bg-yellow-400 text-black text-[10px] font-mono font-bold tabular-nums">
                              <ScrambleText text="100% MATCH" />
                            </span>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Bottom Status Strip */}
                <div className="relative z-10 mt-4 pt-3 border-t border-zinc-800 flex items-center justify-between text-[10px] font-mono text-zinc-500">
                  <span>
                    APLICAÇÃO: {contextMode === 'forense' ? 'INVESTIGAÇÃO CRIMINAL (CODIS)' : 'DIAGNÓSTICO CLÍNICO'}
                  </span>
                  {isStepDone && (
                    <span className="text-yellow-400 font-bold">
                      &gt;&gt; <ScrambleText text="EVIDÊNCIA SINCRONIZADA" />
                    </span>
                  )}
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ============================================================================
     * 8. INTERAÇÃO 3: MINIGAME — QUADRO DE INVESTIGAÇÃO (JOGO DA MEMÓRIA)
     * ============================================================================ */
    function buildShuffledDeck(numPairs) {
      const subset = MEMORY_PAIRS_DATA.slice(0, numPairs);
      const cards = [];
      subset.forEach((pair) => {
        cards.push({
          uid: `${pair.pairId}-a`,
          pairId: pair.pairId,
          label: pair.a.label,
          tag: pair.a.tag,
          category: pair.category,
          color: pair.color,
          explanation: pair.explanation,
        });
        cards.push({
          uid: `${pair.pairId}-b`,
          pairId: pair.pairId,
          label: pair.b.label,
          tag: pair.b.tag,
          category: pair.category,
          color: pair.color,
          explanation: pair.explanation,
        });
      });

      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      return cards;
    }

    function GeneticMemoryGame({ onWinGame }) {
      const [pairCount, setPairCount] = useState(6);
      const [cards, setCards] = useState(() => buildShuffledDeck(6));
      const [flippedIndices, setFlippedIndices] = useState([]);
      const [matchedPairIds, setMatchedPairIds] = useState([]);
      const [moves, setMoves] = useState(0);
      const [isLocked, setIsLocked] = useState(false);
      const [lastMatchExplanation, setLastMatchExplanation] = useState(
        'Vire duas cartas no quadro de investigação para conectar pares lógicos (ex: Adenina ↔ Timina, Local do Crime ↔ Coleta de DNA).'
      );
      const [elapsedSec, setElapsedSec] = useState(0);
      const [hasStarted, setHasStarted] = useState(false);
      const mismatchTimerRef = useRef(null);

      const isWon = matchedPairIds.length === pairCount;

      useEffect(() => {
        return () => {
          if (mismatchTimerRef.current) clearTimeout(mismatchTimerRef.current);
        };
      }, []);

      useEffect(() => {
        if (!hasStarted || isWon) return;
        const interval = setInterval(() => setElapsedSec((s) => s + 1), 1000);
        return () => clearInterval(interval);
      }, [hasStarted, isWon]);

      useEffect(() => {
        if (isWon) {
          onWinGame();
        }
      }, [isWon, onWinGame]);

      const restartGame = (newCount = pairCount) => {
        soundEngine.playClick();
        if (mismatchTimerRef.current) {
          clearTimeout(mismatchTimerRef.current);
          mismatchTimerRef.current = null;
        }
        setPairCount(newCount);
        setCards(buildShuffledDeck(newCount));
        setFlippedIndices([]);
        setMatchedPairIds([]);
        setMoves(0);
        setIsLocked(false);
        setElapsedSec(0);
        setHasStarted(false);
        setLastMatchExplanation(
          'Quadro reembaralhado! Conecte todos os pares lógicos com precisão pericial.'
        );
      };

      const handleCardClick = (idx) => {
        if (isLocked) return;
        if (flippedIndices.includes(idx)) return;
        const card = cards[idx];
        if (matchedPairIds.includes(card.pairId)) return;

        if (!hasStarted) setHasStarted(true);
        soundEngine.playClick();

        const nextFlipped = [...flippedIndices, idx];
        setFlippedIndices(nextFlipped);

        if (nextFlipped.length === 2) {
          setMoves((m) => m + 1);
          const firstCard = cards[nextFlipped[0]];
          const secondCard = cards[nextFlipped[1]];

          if (firstCard.pairId === secondCard.pairId) {
            const updatedMatches = [...matchedPairIds, firstCard.pairId];
            setMatchedPairIds(updatedMatches);
            setFlippedIndices([]);
            setLastMatchExplanation(`✓ Par Lógico Formado: ${firstCard.label} ↔ ${secondCard.label} — ${firstCard.explanation}`);
            if (updatedMatches.length === pairCount) {
              soundEngine.playVictory();
            } else {
              soundEngine.playSuccess();
            }
          } else {
            setIsLocked(true);
            mismatchTimerRef.current = setTimeout(() => {
              mismatchTimerRef.current = null;
              soundEngine.playError();
              setFlippedIndices([]);
              setIsLocked(false);
            }, 900);
          }
        }
      };

      const accuracy = moves > 0 ? Math.min(100, Math.round((matchedPairIds.length / moves) * 100)) : 100;

      return (
        <section
          id="memoria"
          data-testid="memory-section"
          className="py-16 sm:py-24 px-4 sm:px-6 max-w-7xl mx-auto"
        >
          <SectionHeader
            eyebrow="Interação 03 // Quadro de Investigação"
            title="Jogo da Memória: Conexões do Caso"
            accent="red"
            subtitle="Explore o quadro de detetive conectando pares lógicos científicos: Adenina ↔ Timina, Citosina ↔ Guanina, Local do Crime ↔ Coleta de DNA e Doença Genética ↔ Diagnóstico por Biotecnologia."
          />

          <div className="detective-board border border-zinc-800 p-6 sm:p-8 relative">
            {/* HUD Scoreboard */}
            <div className="flex flex-wrap items-center justify-between gap-4 mb-6 pb-5 border-b border-zinc-800">
              <div className="flex flex-wrap gap-2">
                <button
                  type="button"
                  data-testid="memory-mode-6"
                  onClick={() => restartGame(6)}
                  className={`px-3.5 py-2 text-[11px] font-mono uppercase tracking-[0.1em] border transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                    pairCount === 6
                      ? 'bg-yellow-400 border-yellow-400 text-black font-bold'
                      : 'bg-black border-zinc-800 text-zinc-400 hover:border-zinc-600 hover:text-zinc-100'
                  }`}
                >
                  CASO PADRÃO (12)
                </button>
                <button
                  type="button"
                  data-testid="memory-mode-8"
                  onClick={() => restartGame(8)}
                  className={`px-3.5 py-2 text-[11px] font-mono uppercase tracking-[0.1em] border transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                    pairCount === 8
                      ? 'bg-yellow-400 border-yellow-400 text-black font-bold'
                      : 'bg-black border-zinc-800 text-zinc-400 hover:border-zinc-600 hover:text-zinc-100'
                  }`}
                >
                  CASO COMPLETO (16)
                </button>
              </div>

              <div className="flex flex-wrap items-center gap-2 text-[11px] font-mono tabular-nums">
                <div className="px-3 py-1.5 bg-black border border-zinc-800 text-zinc-400">
                  MOVIMENTOS <strong className="text-zinc-100 ml-1">{moves}</strong>
                </div>
                <div className="px-3 py-1.5 bg-black border border-zinc-800 text-zinc-400">
                  PARES <strong className="text-yellow-400 ml-1">{matchedPairIds.length}/{pairCount}</strong>
                </div>
                <div className="px-3 py-1.5 bg-black border border-zinc-800 text-zinc-400">
                  TEMPO <strong className="text-zinc-100 ml-1">{elapsedSec}s</strong>
                </div>
                <button
                  type="button"
                  data-testid="memory-restart"
                  onClick={() => restartGame(pairCount)}
                  className="px-3.5 py-1.5 bg-black hover:border-yellow-400 hover:text-yellow-400 border border-zinc-800 text-zinc-300 font-semibold uppercase tracking-[0.1em] transition-[border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
                >
                  REINICIAR QUADRO
                </button>
              </div>
            </div>

            {/* Educational Insight Strip */}
            <div
              role="status"
              aria-live="polite"
              data-testid="memory-status"
              className={`mb-6 p-4 border text-xs sm:text-sm font-mono transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] flex items-center gap-3 ${
                lastMatchExplanation.startsWith('✓')
                  ? 'bg-yellow-400/[0.06] border-yellow-400 text-zinc-100'
                  : 'bg-black border-zinc-800 text-zinc-300'
              }`}
            >
              <span
                className={`w-1.5 h-1.5 shrink-0 ${
                  lastMatchExplanation.startsWith('✓') ? 'bg-yellow-400 terminal-cursor' : 'bg-zinc-600'
                }`}
              ></span>
              <span className="relative z-10">
                {lastMatchExplanation.startsWith('✓') && (
                  <strong className="text-yellow-400 mr-2">[CONEXÃO DETECTADA]</strong>
                )}
                <ScrambleText text={lastMatchExplanation} />
              </span>
            </div>

            {/* Card Grid */}
            <div
              className={`grid gap-3 sm:gap-4 ${
                pairCount === 8 ? 'grid-cols-2 sm:grid-cols-4' : 'grid-cols-2 sm:grid-cols-3 lg:grid-cols-4'
              }`}
            >
              {cards.map((card, idx) => {
                const isFlipped = flippedIndices.includes(idx) || matchedPairIds.includes(card.pairId);
                const isMatched = matchedPairIds.includes(card.pairId);

                return (
                  <button
                    key={card.uid}
                    type="button"
                    data-testid={isMatched ? 'memory-card-match' : `memory-card-${idx}`}
                    data-card-index={idx}
                    data-pair-id={card.pairId}
                    data-matched={isMatched ? 'true' : 'false'}
                    onClick={() => handleCardClick(idx)}
                    aria-label={isFlipped ? `${card.label} — ${card.tag}` : `Evidência fechada número ${idx + 1}`}
                    aria-pressed={isFlipped}
                    className="perspective-1000 h-32 sm:h-36 w-full text-left focus:outline-none group"
                  >
                    <div
                      className={`relative w-full h-full transform-style-3d transition-[transform] duration-300 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                        isFlipped ? 'rotate-y-180' : 'group-hover:-translate-y-0.5'
                      }`}
                    >
                      {/* Front (Hidden Face - Etiqueta Tática Escura) */}
                      <div className="backface-hidden absolute inset-0 bg-black border border-zinc-800 group-hover:border-zinc-600 p-4 flex flex-col items-center justify-center transition-[border-color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]">
                        <div className="w-8 h-8 border border-zinc-800 group-hover:border-yellow-400/70 bg-zinc-950 flex items-center justify-center mb-2 text-zinc-400 group-hover:text-yellow-400 font-mono font-semibold text-xs tabular-nums transition-[border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]">
                          #{String(idx + 1).padStart(2, '0')}
                        </div>
                        <span className="text-[10px] font-mono tracking-[0.16em] text-zinc-300 uppercase">
                          EVIDÊNCIA LACRADA
                        </span>
                        <span className="text-[9px] font-mono text-zinc-600 mt-1">
                          INSPECIONAR
                        </span>
                      </div>

                      {/* Back (Revealed Face) */}
                      <div
                        className={`backface-hidden rotate-y-180 absolute inset-0 p-3.5 flex flex-col justify-between border transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                          isMatched
                            ? 'bg-yellow-400 border-yellow-400 text-black'
                            : 'bg-zinc-950 border-yellow-400 text-zinc-100'
                        }`}
                      >
                        <div
