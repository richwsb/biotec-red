     * 1. MOTOR DE ÁUDIO PROCEDURAL (WEB AUDIO API - SEM DEPENDÊNCIAS EXTERNAS)
     * ============================================================================ */
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.enabled) return null;
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) {
            this.ctx = new AudioCtx();
          }
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
        return this.ctx;
      }

      playTone(freq, duration = 0.12, type = 'sine', volume = 0.08, delay = 0) {
        if (!this.enabled) return;
        const ctx = this.init();
        if (!ctx) return;

        const startTime = ctx.currentTime + delay;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = type;
        osc.frequency.setValueAtTime(freq, startTime);

        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.015);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start(startTime);
        osc.stop(startTime + duration + 0.02);
      }

      playClick() {
        this.playTone(720, 0.055, 'triangle', 0.05);
      }

      playSuccess() {
        this.playTone(523.25, 0.14, 'sine', 0.07, 0);
        this.playTone(659.25, 0.16, 'sine', 0.07, 0.07);
        this.playTone(783.99, 0.22, 'triangle', 0.08, 0.14);
      }

      playError() {
        this.playTone(195, 0.14, 'sawtooth', 0.06, 0);
        this.playTone(145, 0.22, 'sawtooth', 0.06, 0.11);
      }

      playLabPulse(stepIdx = 0) {
        const base = 360 + stepIdx * 75;
        this.playTone(base, 0.1, 'sine', 0.06, 0);
        this.playTone(base * 1.25, 0.15, 'triangle', 0.06, 0.08);
      }

      playVictory() {
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((n, idx) => {
          this.playTone(n, 0.28, 'triangle', 0.08, idx * 0.09);
        });
      }
    }

    const SCRAMBLE_GLYPHS = '0123456789ABCDEF/#<>_-';

    function ScrambleText({ text, className = '', duration = 220 }) {
      const [display, setDisplay] = useState(text);
      const prevTextRef = useRef(text);

      useEffect(() => {
        if (typeof window === 'undefined') {
          setDisplay(text);
          return;
        }
        const prefersReduced =
          window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        if (prefersReduced || prevTextRef.current === text) {
          prevTextRef.current = text;
          setDisplay(text);
          return;
        }
        prevTextRef.current = text;

        let frameId = null;
        const start = performance.now();
        const chars = String(text).split('');

        const tick = (now) => {
          const progress = Math.min(1, (now - start) / duration);
          const resolvedCount = Math.floor(progress * chars.length);

          const nextText = chars
            .map((ch, idx) => {
              if (idx < resolvedCount || /[\s.,:;!?()\[\]{}\/\-_↔→✓★%°]/.test(ch)) {
                return ch;
              }
              const glyphIdx = (idx + Math.floor(now / 28)) % SCRAMBLE_GLYPHS.length;
              return SCRAMBLE_GLYPHS[glyphIdx];
            })
            .join('');

          setDisplay(nextText);
          if (progress < 1) {
            frameId = requestAnimationFrame(tick);
          } else {
            setDisplay(text);
          }
        };

        frameId = requestAnimationFrame(tick);
        return () => {
          if (frameId) cancelAnimationFrame(frameId);
        };
      }, [text, duration]);

      return (
        <span className={className} aria-label={text}>
          {display}
        </span>
      );
    }

    function DNA3DViewer() {
      const mountRef = useRef(null);
      const [renderEngine, setRenderEngine] = useState(() =>
        typeof window !== 'undefined' && window.THREE ? 'webgl' : 'css3d'
      );
      const [focusMode, setFocusMode] = useState('dual');
      const [speedMult, setSpeedMult] = useState(1);
      const [webglError, setWebglError] = useState(false);

      const speedRef = useRef(1);
      const focusRef = useRef('dual');
      const dragRef = useRef({
        active: false,
        lastX: 0,
        lastY: 0,
        rotX: 0.1,
        rotY: 0,
        velX: 0,
        velY: 0,
      });
      const parallaxRef = useRef({ targetX: 0, targetY: 0, curX: 0, curY: 0 });
      const scrollInertiaRef = useRef({ lastY: 0, velocity: 0 });

      useEffect(() => {
        speedRef.current = speedMult;
      }, [speedMult]);

      useEffect(() => {
        focusRef.current = focusMode;
      }, [focusMode]);

      useEffect(() => {
        if (typeof window === 'undefined') return;
        scrollInertiaRef.current.lastY = window.scrollY || 0;

        const onScroll = () => {
          const currentY = window.scrollY || 0;
          const delta = currentY - scrollInertiaRef.current.lastY;
          scrollInertiaRef.current.lastY = currentY;
          scrollInertiaRef.current.velocity = Math.max(
            -0.08,
            Math.min(0.08, scrollInertiaRef.current.velocity + delta * 0.00025)
          );
        };

        const onWindowPointerMove = (e) => {
          const nx = (e.clientX / Math.max(1, window.innerWidth)) * 2 - 1;
          const ny = (e.clientY / Math.max(1, window.innerHeight)) * 2 - 1;
          parallaxRef.current.targetX = nx;
          parallaxRef.current.targetY = ny;
        };

        window.addEventListener('scroll', onScroll, { passive: true });
        window.addEventListener('pointermove', onWindowPointerMove, { passive: true });
        return () => {
          window.removeEventListener('scroll', onScroll);
          window.removeEventListener('pointermove', onWindowPointerMove);
        };
      }, []);

      useEffect(() => {
        if (renderEngine !== 'webgl') return;
        const container = mountRef.current;
        if (!container || typeof window.THREE === 'undefined') {
          setRenderEngine('css3d');
          return;
        }

        const THREE = window.THREE;
        let renderer;
        let animId;
        const disposables = [];

        try {
          const width = container.clientWidth || 440;
          const height = container.clientHeight || 420;

          const scene = new THREE.Scene();
          const camera = new THREE.PerspectiveCamera(42, width / height, 0.1, 100);
          camera.position.set(0, 0, 12.8);

          renderer = new THREE.WebGLRenderer({
            alpha: true,
            antialias: true,
            powerPreference: 'high-performance',
          });
          renderer.setSize(width, height);
          renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
          container.innerHTML = '';
          container.appendChild(renderer.domElement);

          // Iluminação Volumétrica & Rim Lighting Amarelo Cirúrgico contra Vazio Preto
          const ambientLight = new THREE.AmbientLight(0x27272a, 0.9);
          scene.add(ambientLight);

          const rimLightLeft = new THREE.DirectionalLight(0xfacc15, 2.1);
          rimLightLeft.position.set(-6, 3, -4);
          scene.add(rimLightLeft);

          const rimLightRight = new THREE.DirectionalLight(0xfef08a, 1.4);
          rimLightRight.position.set(6, -2, -3);
          scene.add(rimLightRight);

          const keyLightFront = new THREE.PointLight(0xf4f4f5, 0.9, 28);
          keyLightFront.position.set(2, 4, 9);
          scene.add(keyLightFront);

          const dnaGroup = new THREE.Group();
          scene.add(dnaGroup);

          // Geometria fiel ao image.png: Duas fitas helicoidais contínuas + Purinas (2 anéis) e Pirimidinas (1 anel)
          const heightSpan = 9.2;
          const radius = 1.65;
          const totalTurns = 1.65;
          const spineSamples = 64;

          const ptsStrand1 = [];
          const ptsStrand2 = [];
          for (let s = 0; s <= spineSamples; s++) {
            const t = s / spineSamples;
            const y = (t - 0.5) * heightSpan;
            const theta = t * Math.PI * 2 * totalTurns;
            ptsStrand1.push(new THREE.Vector3(Math.cos(theta) * radius, y, Math.sin(theta) * radius));
            ptsStrand2.push(new THREE.Vector3(Math.cos(theta + Math.PI) * radius, y, Math.sin(theta + Math.PI) * radius));
          }

          const curve1 = new THREE.CatmullRomCurve3(ptsStrand1);
          const curve2 = new THREE.CatmullRomCurve3(ptsStrand2);

          const tubeGeo1 = new THREE.TubeGeometry(curve1, 96, 0.085, 8, false);
          const tubeGeo2 = new THREE.TubeGeometry(curve2, 96, 0.085, 8, false);
          const wireGeo1 = new THREE.WireframeGeometry(tubeGeo1);
          const wireGeo2 = new THREE.WireframeGeometry(tubeGeo2);
          disposables.push(tubeGeo1, tubeGeo2, wireGeo1, wireGeo2);

          const strand1CoreMat = new THREE.MeshStandardMaterial({
            color: 0x18181b,
            emissive: 0xfacc15,
            emissiveIntensity: 0.42,
            roughness: 0.25,
            metalness: 0.8,
            transparent: true,
            opacity: 0.85,
          });
          const strand2CoreMat = new THREE.MeshStandardMaterial({
            color: 0x18181b,
            emissive: 0x71717a,
            emissiveIntensity: 0.35,
            roughness: 0.25,
            metalness: 0.8,
            transparent: true,
            opacity: 0.85,
          });
          const strand1WireMat = new THREE.LineBasicMaterial({
            color: 0xfacc15,
            transparent: true,
            opacity: 0.65,
            blending: THREE.AdditiveBlending,
          });
          const strand2WireMat = new THREE.LineBasicMaterial({
            color: 0xd4d4d8,
            transparent: true,
            opacity: 0.48,
            blending: THREE.AdditiveBlending,
          });
          disposables.push(strand1CoreMat, strand2CoreMat, strand1WireMat, strand2WireMat);

          const strand1Mesh = new THREE.Mesh(tubeGeo1, strand1CoreMat);
          const strand1Wire = new THREE.LineSegments(wireGeo1, strand1WireMat);
          const strand2Mesh = new THREE.Mesh(tubeGeo2, strand2CoreMat);
          const strand2Wire = new THREE.LineSegments(wireGeo2, strand2WireMat);
          dnaGroup.add(strand1Mesh, strand1Wire, strand2Mesh, strand2Wire);

          // Fábrica de anéis químicos 3D (Purina bicíclica vs Pirimidina hexagonal do image.png)
          const makeMolecularRingGeometry = (isPurine) => {
            const shape = new THREE.Shape();
            const hexR = 0.2;
            const hexPts = [];
            for (let k = 0; k < 6; k++) {
              const a = ((k + 0.5) / 6) * Math.PI * 2;
              hexPts.push([Math.cos(a) * hexR, Math.sin(a) * hexR]);
            }

            if (isPurine) {
              // Contorno único contínuo (hexágono + pentágono fundido na aresta esquerda) sem auto-interseção
              shape.moveTo(hexPts[0][0], hexPts[0][1]);
              shape.lineTo(hexPts[1][0], hexPts[1][1]);
              shape.lineTo(hexPts[2][0], hexPts[2][1]);
              shape.lineTo(hexPts[2][0] - 0.14, hexPts[2][1] + 0.04);
              shape.lineTo(hexPts[2][0] - 0.23, 0);
              shape.lineTo(hexPts[3][0] - 0.14, hexPts[3][1] - 0.04);
              shape.lineTo(hexPts[3][0], hexPts[3][1]);
              shape.lineTo(hexPts[4][0], hexPts[4][1]);
              shape.lineTo(hexPts[5][0], hexPts[5][1]);
              shape.closePath();
            } else {
              hexPts.forEach(([px, py], k) => {
                if (k === 0) shape.moveTo(px, py);
                else shape.lineTo(px, py);
              });
              shape.closePath();
            }

            const extrudeGeo = new THREE.ExtrudeGeometry(shape, {
              depth: 0.036,
              bevelEnabled: false,
            });
            extrudeGeo.center();
            const edgeGeo = new THREE.EdgesGeometry(extrudeGeo);
            disposables.push(extrudeGeo, edgeGeo);
            return { extrudeGeo, edgeGeo };
          };

          const purineGeos = makeMolecularRingGeometry(true);
          const pyrimidineGeos = makeMolecularRingGeometry(false);
          const stemGeo = new THREE.CylinderGeometry(0.022, 0.022, 1, 6);
          const hBondGeo = new THREE.CylinderGeometry(0.01, 0.01, 0.56, 6);
          disposables.push(stemGeo, hBondGeo);

          // Paleta molecular inspirada no image.png aplicada com discrição holográfica
          const baseVisuals = {
            A: { isPurine: true, wire: 0x2dd4bf, emissive: 0x0d9488 },   // Adenina (ciano-teal)
            G: { isPurine: true, wire: 0xfacc15, emissive: 0xca8a04 },   // Guanina (amarelo alerta)
            C: { isPurine: false, wire: 0xfb7185, emissive: 0xbe123c },  // Citosina (rosa-carmim)
            T: { isPurine: false, wire: 0xa78bfa, emissive: 0x6d28d9 },  // Timina (índigo-violeta sutil)
          };
          const compMap = { A: 'T', T: 'A', C: 'G', G: 'C' };
          const seq = ['C', 'A', 'C', 'G', 'A', 'C', 'T', 'T', 'A', 'G', 'A', 'T', 'C', 'T', 'G', 'A'];

          const hBondMat = new THREE.MeshBasicMaterial({
            color: 0xfacc15,
            transparent: true,
            opacity: 0.72,
            blending: THREE.AdditiveBlending,
          });
          disposables.push(hBondMat);

          const rungMeshes = [];
          const hBondMeshes = [];

          seq.forEach((bLeft, i) => {
            const t = i / (seq.length - 1);
            const y = (t - 0.5) * heightSpan * 0.92;
            const theta = t * Math.PI * 2 * totalTurns;

            const p1 = new THREE.Vector3(Math.cos(theta) * radius, y, Math.sin(theta) * radius);
            const p2 = new THREE.Vector3(Math.cos(theta + Math.PI) * radius, y, Math.sin(theta + Math.PI) * radius);
            const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
            const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5);

            const bRight = compMap[bLeft];
            const vL = baseVisuals[bLeft];
            const vR = baseVisuals[bRight];

            // Hastes de conexão aos anéis
            const stemMatL = new THREE.MeshStandardMaterial({
              color: 0x09090b,
              emissive: vL.emissive,
              emissiveIntensity: 0.45,
              transparent: true,
              opacity: 0.85,
            });
            const stemMatR = new THREE.MeshStandardMaterial({
              color: 0x09090b,
              emissive: vR.emissive,
              emissiveIntensity: 0.45,
              transparent: true,
              opacity: 0.85,
            });
            disposables.push(stemMatL, stemMatR);

            const stemLen = radius * 0.5;
            const stemL = new THREE.Mesh(stemGeo, stemMatL);
            stemL.position.copy(p1).addScaledVector(dir, stemLen * 0.5);
            stemL.scale.set(1, stemLen, 1);
            stemL.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
            dnaGroup.add(stemL);

            const stemR = new THREE.Mesh(stemGeo, stemMatR);
            stemR.position.copy(p2).addScaledVector(dir, -stemLen * 0.5);
            stemR.scale.set(1, stemLen, 1);
            stemR.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
            dnaGroup.add(stemR);

            // Anéis Moleculares (Purina 2 anéis / Pirimidina 1 anel)
            const geoL = vL.isPurine ? purineGeos : pyrimidineGeos;
            const geoR = vR.isPurine ? purineGeos : pyrimidineGeos;

            const fillMatL = new THREE.MeshBasicMaterial({
              color: vL.emissive,
              transparent: true,
              opacity: 0.22,
              blending: THREE.AdditiveBlending,
            });
            const wireMatL = new THREE.LineBasicMaterial({
              color: vL.wire,
              transparent: true,
              opacity: 0.92,
              blending: THREE.AdditiveBlending,
            });
            const fillMatR = new THREE.MeshBasicMaterial({
              color: vR.emissive,
              transparent: true,
              opacity: 0.22,
              blending: THREE.AdditiveBlending,
            });
            const wireMatR = new THREE.LineBasicMaterial({
              color: vR.wire,
              transparent: true,
              opacity: 0.92,
              blending: THREE.AdditiveBlending,
            });
            disposables.push(fillMatL, wireMatL, fillMatR, wireMatR);

            const ringGroupL = new THREE.Group();
            ringGroupL.add(new THREE.Mesh(geoL.extrudeGeo, fillMatL), new THREE.LineSegments(geoL.edgeGeo, wireMatL));
            ringGroupL.position.copy(mid).addScaledVector(dir, -0.54);
            ringGroupL.rotation.y = -theta;
            dnaGroup.add(ringGroupL);

            const ringGroupR = new THREE.Group();
            ringGroupR.add(new THREE.Mesh(geoR.extrudeGeo, fillMatR), new THREE.LineSegments(geoR.edgeGeo, wireMatR));
            ringGroupR.position.copy(mid).addScaledVector(dir, 0.54);
            ringGroupR.rotation.y = -theta + Math.PI;
            dnaGroup.add(ringGroupR);

            // Pontes de Hidrogênio Laser (2 para A=T, 3 para G≡C)
            const bondCount = bLeft === 'G' || bLeft === 'C' ? 3 : 2;
            for (let b = 0; b < bondCount; b++) {
              const offset = (b - (bondCount - 1) / 2) * 0.085;
              const bond = new THREE.Mesh(hBondGeo, hBondMat);
              bond.position.copy(mid);
              bond.position.y += offset;
              bond.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
              dnaGroup.add(bond);
              hBondMeshes.push(bond);
            }

            rungMeshes.push({ stemR, ringGroupR, stemMatR, fillMatR, wireMatR });
          });

          // Anel de Varredura Laser Volumétrico
          const scanRingGeo = new THREE.RingGeometry(2.02, 2.08, 64);
          const scanRingMat = new THREE.MeshBasicMaterial({
            color: 0xfacc15,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.48,
            blending: THREE.AdditiveBlending,
          });
          disposables.push(scanRingGeo, scanRingMat);
          const scanRing = new THREE.Mesh(scanRingGeo, scanRingMat);
          scanRing.rotation.x = Math.PI / 2;
          scene.add(scanRing);

          // Poeira Quântica Sutil (Partículas Amarelas Esparsas)
          const particleCount = 48;
          const particleGeo = new THREE.BufferGeometry();
          const positions = new Float32Array(particleCount * 3);
          for (let i = 0; i < particleCount; i++) {
            positions[i * 3] = (Math.random() - 0.5) * 9.0;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 10.5;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 6.0;
          }
          particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
          const particleMat = new THREE.PointsMaterial({
            color: 0xfacc15,
            size: 0.055,
            transparent: true,
            opacity: 0.45,
            blending: THREE.AdditiveBlending,
          });
          disposables.push(particleGeo, particleMat);
          const particles = new THREE.Points(particleGeo, particleMat);
          scene.add(particles);

          const handleResize = () => {
            if (!container || !renderer) return;
            const w = container.clientWidth || 440;
            const h = container.clientHeight || 420;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
          };
          window.addEventListener('resize', handleResize);

          const clock = new THREE.Clock();
          const animate = () => {
            animId = requestAnimationFrame(animate);
            const dt = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.getElapsedTime();

            // Inércia de Scroll + Velocidade de Rotação + Inércia de Arraste
            const scrollImpulse = scrollInertiaRef.current.velocity;
            scrollInertiaRef.current.velocity *= 0.91;

            if (!dragRef.current.active) {
              dragRef.current.rotY += dt * 0.48 * speedRef.current + scrollImpulse + dragRef.current.velY;
              dragRef.current.rotX = Math.max(-0.55, Math.min(0.55, dragRef.current.rotX + dragRef.current.velX));
              dragRef.current.velX *= 0.9;
              dragRef.current.velY *= 0.92;
            }

            // Parallax Suave da Posição do Cursor
            parallaxRef.current.curX += (parallaxRef.current.targetX - parallaxRef.current.curX) * 0.06;
            parallaxRef.current.curY += (parallaxRef.current.targetY - parallaxRef.current.curY) * 0.06;

            dnaGroup.rotation.y = dragRef.current.rotY + parallaxRef.current.curX * 0.14;
            dnaGroup.rotation.x = dragRef.current.rotX - parallaxRef.current.curY * 0.09;
            dnaGroup.rotation.z = parallaxRef.current.curX * -0.05;
            dnaGroup.position.y = Math.sin(elapsed * 0.9) * 0.12 - scrollImpulse * 2.4;

            camera.position.x = parallaxRef.current.curX * 0.35;
            camera.position.y = -parallaxRef.current.curY * 0.25;
            camera.lookAt(0, 0, 0);

            // Plano de Varredura Laser Vertical
            scanRing.position.y = Math.sin(elapsed * 0.85) * 4.1;
            scanRingMat.opacity = speedRef.current === 0 ? 0.22 : 0.42 + Math.sin(elapsed * 2.4) * 0.12;

            particles.rotation.y -= dt * 0.08 * (speedRef.current || 0.25);

            // Modos de Foco: Dupla Hélice (DNA) / Fita Médica (RNA Fita Simples) / Fita Forense
            if (focusRef.current === 'biotech') {
              strand1CoreMat.emissiveIntensity = 0.88;
              strand1WireMat.opacity = 0.92;
              strand2Mesh.visible = false;
              strand2Wire.visible = false;
              hBondMeshes.forEach((b) => { b.visible = false; });
              rungMeshes.forEach(({ stemR, ringGroupR }) => {
                stemR.visible = false;
                ringGroupR.visible = false;
              });
            } else if (focusRef.current === 'forensic') {
              strand1CoreMat.emissiveIntensity = 0.2;
              strand1WireMat.opacity = 0.26;
              strand2Mesh.visible = true;
              strand2Wire.visible = true;
              strand2CoreMat.opacity = 0.92;
              strand2CoreMat.emissive.setHex(0xfacc15);
              strand2CoreMat.emissiveIntensity = 0.85;
              strand2WireMat.color.setHex(0xfacc15);
              strand2WireMat.opacity = 0.9;
              hBondMat.opacity = 0.88;
              hBondMeshes.forEach((b) => { b.visible = true; });
              rungMeshes.forEach(({ stemR, ringGroupR, stemMatR, fillMatR, wireMatR }) => {
                stemR.visible = true;
                ringGroupR.visible = true;
                stemMatR.opacity = 0.92;
                fillMatR.opacity = 0.28;
                wireMatR.opacity = 0.96;
              });
            } else {
              strand1CoreMat.emissiveIntensity = 0.55;
              strand1WireMat.opacity = 0.72;
              strand2Mesh.visible = true;
              strand2Wire.visible = true;
              strand2CoreMat.opacity = 0.85;
              strand2CoreMat.emissive.setHex(0x71717a);
              strand2CoreMat.emissiveIntensity = 0.38;
              strand2WireMat.color.setHex(0xd4d4d8);
              strand2WireMat.opacity = 0.52;
              hBondMat.opacity = 0.72;
              hBondMeshes.forEach((b) => { b.visible = true; });
              rungMeshes.forEach(({ stemR, ringGroupR, stemMatR, fillMatR, wireMatR }) => {
                stemR.visible = true;
                ringGroupR.visible = true;
                stemMatR.opacity = 0.85;
                fillMatR.opacity = 0.22;
                wireMatR.opacity = 0.92;
              });
            }

            renderer.render(scene, camera);
          };
          animate();

          return () => {
            cancelAnimationFrame(animId);
            window.removeEventListener('resize', handleResize);
            disposables.forEach((d) => d && d.dispose && d.dispose());
            if (renderer && renderer.dispose) renderer.dispose();
          };
        } catch (err) {
          setWebglError(true);
          setRenderEngine('css3d');
        }
      }, [renderEngine]);

      const onPointerDown = (e) => {
        dragRef.current.active = true;
        dragRef.current.lastX = e.clientX;
        dragRef.current.lastY = e.clientY;
        dragRef.current.velX = 0;
        dragRef.current.velY = 0;
      };

      const onPointerMove = (e) => {
        if (!dragRef.current.active) return;
        const dx = e.clientX - dragRef.current.lastX;
        const dy = e.clientY - dragRef.current.lastY;
        const stepY = dx * 0.011;
        const stepX = dy * 0.007;
        dragRef.current.rotY += stepY;
        dragRef.current.rotX = Math.max(-0.55, Math.min(0.55, dragRef.current.rotX + stepX));
        dragRef.current.velY = stepY * 0.45;
        dragRef.current.velX = stepX * 0.45;
        dragRef.current.lastX = e.clientX;
        dragRef.current.lastY = e.clientY;
      };

      const onPointerUp = () => {
        dragRef.current.active = false;
      };

      return (
        <div
          data-testid="dna-3d-viewer"
          className="relative bg-zinc-950 border border-zinc-800 p-4 sm:p-5 overflow-hidden"
        >
          {/* Cantoneiras Táticas de 1px */}
          <span className="pointer-events-none absolute top-0 left-0 w-2.5 h-2.5 border-t border-l border-yellow-400" aria-hidden="true"></span>
          <span className="pointer-events-none absolute top-0 right-0 w-2.5 h-2.5 border-t border-r border-yellow-400" aria-hidden="true"></span>
          <span className="pointer-events-none absolute bottom-0 left-0 w-2.5 h-2.5 border-b border-l border-zinc-600" aria-hidden="true"></span>
          <span className="pointer-events-none absolute bottom-0 right-0 w-2.5 h-2.5 border-b border-r border-zinc-600" aria-hidden="true"></span>

          {/* Top Telemetry Strip */}
          <div className="flex flex-wrap items-center justify-between gap-2 text-[11px] font-mono text-zinc-400 border-b border-zinc-800 pb-3 mb-3">
            <span className="flex items-center gap-2 text-zinc-200 tracking-[0.12em]">
              <span className="w-1.5 h-1.5 bg-yellow-400 terminal-cursor"></span>
              SCANNER 3D // B-DNA HOLOGRÁFICO
            </span>
            <button
              type="button"
              data-testid="dna-engine-toggle"
              onClick={() => {
                soundEngine.playClick();
                if (!webglError) {
                  setRenderEngine((prev) => (prev === 'webgl' ? 'css3d' : 'webgl'));
                }
              }}
              className="px-2.5 py-1 bg-black hover:border-yellow-400 hover:text-yellow-400 border border-zinc-800 text-[10px] text-zinc-400 font-mono uppercase tracking-[0.1em] transition-[border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
              title="Alternar motor de renderização 3D"
            >
              {renderEngine === 'webgl' ? 'WEBGL.R128' : 'CSS3D.FALLBACK'}
            </button>
          </div>

          {/* 3D Canvas / CSS 3D Viewport */}
          <div
            data-testid="dna-canvas-viewport"
            className="relative w-full h-[340px] sm:h-[420px] bg-black border border-zinc-800/90 cursor-grab active:cursor-grabbing select-none touch-none overflow-hidden"
            onPointerDown={onPointerDown}
            onPointerMove={onPointerMove}
            onPointerUp={onPointerUp}
            onPointerLeave={onPointerUp}
            role="region"
            aria-label="Visualização interativa da dupla hélice de DNA em 3D. Arraste para rotacionar."
          >
            {/* Rim Glow Volumétrico Sutil */}
            <div
              className="absolute inset-0 pointer-events-none"
              style={{
                background:
                  'radial-gradient(circle at 50% 48%, rgba(250, 204, 21, 0.085) 0%, rgba(250, 204, 21, 0.02) 42%, transparent 72%)',
              }}
            ></div>
            <div className="scanline-overlay absolute inset-0"></div>

            {/* Coordenadas HUD sutis */}
            <div className="absolute top-2.5 left-3 right-3 flex items-center justify-between text-[10px] font-mono text-zinc-500 pointer-events-none z-20 tabular-nums">
              <span>{focusMode === 'biotech' ? 'RNA / FITA SIMPLES · A, G, C, U' : 'DNA / DUPLA HÉLICE · A, T, C, G'}</span>
              <span>3.4 nm // 10.5 BP/TURN</span>
            </div>

            {renderEngine === 'webgl' ? (
              <div ref={mountRef} className="w-full h-full relative z-10"></div>
            ) : (
              <CSS3DHelixFallback focusMode={focusMode} paused={speedMult === 0} />
            )}

            {/* Legenda Química baseada no image.png */}
            <div className="absolute bottom-2.5 left-3 right-3 flex flex-wrap items-center justify-between gap-2 text-[10px] font-mono text-zinc-500 pointer-events-none z-20">
              <span>PURINAS [A, G: 2 ANÉIS] · PIRIMIDINAS [T, C, U: 1 ANEL]</span>
              <span className="text-yellow-400/90">[ARRASTE / SCROLL]</span>
            </div>
          </div>

          {/* Controls */}
          <div className="mt-3 pt-3 border-t border-zinc-800 flex flex-wrap items-center justify-between gap-2">
            <div className="flex flex-wrap gap-1.5">
              {[
                { id: 'dual', label: 'DUPLA HÉLICE' },
                { id: 'biotech', label: 'FITA MÉDICA' },
                { id: 'forensic', label: 'FITA FORENSE' },
              ].map((m) => (
                <button
                  key={m.id}
                  type="button"
                  data-testid={`dna-focus-${m.id}`}
                  onClick={() => {
                    soundEngine.playClick();
                    setFocusMode(m.id);
                  }}
                  className={`px-2.5 py-1.5 text-[10px] font-mono uppercase tracking-[0.1em] border transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                    focusMode === m.id
                      ? 'border-yellow-400 text-black bg-yellow-400 font-bold'
                      : 'border-zinc-800 bg-black text-zinc-400 hover:border-zinc-600 hover:text-zinc-100'
                  }`}
                >
                  {m.label}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-1">
              {[
                { val: 0, label: 'PAUSA', testId: 'dna-speed-0' },
                { val: 1, label: '1X', testId: 'dna-speed-1' },
                { val: 2.2, label: '2X', testId: 'dna-speed-2' },
              ].map((spd) => (
                <button
                  key={spd.label}
                  type="button"
                  data-testid={spd.testId}
                  onClick={() => {
                    soundEngine.playClick();
                    setSpeedMult(spd.val);
                  }}
                  className={`px-2 py-1.5 text-[10px] font-mono tabular-nums border transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                    speedMult === spd.val
                      ? 'bg-yellow-400 border-yellow-400 text-black font-bold'
                      : 'border-zinc-800 bg-black text-zinc-400 hover:border-zinc-600 hover:text-zinc-100'
                  }`}
                >
                  {spd.label}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    /* ============================================================================
     * 5. SEÇÃO TEÓRICA: BIOTECNOLOGIA VERMELHA & GENÉTICA FORENSE (DOSSIÊS)
     * ============================================================================ */
    function TheorySection() {
      const [activeTrack, setActiveTrack] = useState('all');
      const [expandedId, setExpandedId] = useState('diag-molecular');
      const [selectedBase, setSelectedBase] = useState('A');

      const base = selectedBase === 'U' ? RNA_URACIL_REF : BASE_INFO[selectedBase];
      const partner = BASE_INFO[base.pair];

      return (
        <section
          id="teoria"
          data-testid="theory-section"
          className="py-16 sm:py-24 px-4 sm:px-6 max-w-7xl mx-auto relative"
        >
          <SectionHeader
            eyebrow="Módulo 01 // Arquivos Classificados"
            title="Biotecnologia Vermelha & Genética Forense"
            accent="red"
            subtitle="Relatório pericial integrado: enquanto a Biotecnologia Vermelha aplica o DNA no diagnóstico e tratamento médico, a Genética Forense converte vestígios biológicos em provas criminais irrefutáveis."
          />

          {/* Track Filter Tabs */}
          <div className="flex flex-wrap gap-2 mb-8" role="tablist" aria-label="Filtrar domínio científico">
            {[
              { id: 'all', label: 'VISÃO INTEGRADA (AMBOS)' },
              { id: 'red', label: 'BIOTECNOLOGIA VERMELHA (SAÚDE)' },
              { id: 'cyan', label: 'GENÉTICA FORENSE (PERÍCIA)' },
            ].map((tab) => (
              <button
                key={tab.id}
                type="button"
                role="tab"
                data-testid={`track-tab-${tab.id}`}
                aria-selected={activeTrack === tab.id}
                onClick={() => {
                  soundEngine.playClick();
                  setActiveTrack(tab.id);
                }}
                className={`px-4 py-2 text-[11px] font-mono uppercase tracking-[0.12em] border transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] flex items-center gap-2 ${
                  activeTrack === tab.id
                    ? 'bg-zinc-950 border-yellow-400 text-yellow-400 font-semibold'
                    : 'bg-black border-zinc-800 text-zinc-400 hover:border-zinc-600 hover:text-zinc-100'
                }`}
              >
                <span className={`w-1.5 h-1.5 ${activeTrack === tab.id ? 'bg-yellow-400' : 'bg-zinc-700'}`}></span>
                {tab.label}
              </button>
            ))}
          </div>

          {/* Two Columns of Confidential Dossier Cards */}
          <div className={`grid gap-6 ${activeTrack === 'all' ? 'lg:grid-cols-2' : 'grid-cols-1 max-w-4xl'}`}>
            {/* Dossiê Biotecnologia Vermelha */}
            {(activeTrack === 'all' || activeTrack === 'red') && (
              <article className="bg-zinc-950 p-6 sm:p-8 border border-zinc-800 relative">
                <div className="flex items-start justify-between gap-4 mb-6 pb-5 border-b border-zinc-800">
                  <div>
                    <span className="text-[11px] font-mono uppercase tracking-[0.16em] text-zinc-400">
                      ARQUIVO CONFIDENCIAL // SETOR MÉDICO
                    </span>
                    <h3 className="text-xl sm:text-2xl font-display font-semibold tracking-[-0.015em] text-zinc-100 mt-1.5">
                      Biotecnologia Vermelha
                    </h3>
                  </div>
                  <div className="w-10 h-10 bg-black border border-zinc-800 flex items-center justify-center text-yellow-400 shrink-0">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5">

            {/* Dossiê Genética Forense */}
            {(activeTrack === 'all' || activeTrack === 'cyan') && (
              <article className="bg-zinc-950 p-6 sm:p-8 border border-zinc-800 relative">
                <div className="flex items-start justify-between gap-4 mb-6 pb-5 border-b border-zinc-800">
                  <div>
                    <span className="text-[11px] font-mono uppercase tracking-[0.16em] text-zinc-400">
                      ARQUIVO CONFIDENCIAL // PERÍCIA CRIMINAL
                    </span>
                    <h3 className="text-xl sm:text-2xl font-display font-semibold tracking-[-0.015em] text-zinc-100 mt-1.5">
                      Genética Forense
                    </h3>
                  </div>
                  <div className="w-10 h-10 bg-black border border-zinc-800 flex items-center justify-center text-yellow-400 shrink-0">
                    <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5">
                      <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                  </div>
                </div>

                <p className="text-sm font-sans text-zinc-400 mb-6 leading-relaxed max-w-[68ch]">
                  Aplica técnicas de biologia molecular para identificar indivíduos a partir de vestígios como{' '}
                  <strong className="text-zinc-100 font-medium">sangue, saliva, sêmen, fios de cabelo e células da pele</strong>.
                </p>

                <div className="divide-y divide-zinc-800 border border-zinc-800 bg-black">
                  {FORENSIC_CARDS.map((card) => {
                    const isOpen = expandedId === card.id;
                    return (
                      <div
                        key={card.id}
                        data-testid={`dossier-card-${card.id}`}
                        className={`transition-[background-color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                          isOpen ? 'bg-zinc-950' : 'bg-black hover:bg-zinc-950/60'
                        }`}
                      >
                        <button
                          type="button"
                          onClick={() => {
                            soundEngine.playClick();
                            setExpandedId(isOpen ? null : card.id);
                          }}
                          aria-expanded={isOpen}
                          className="w-full text-left p-4 sm:p-5 flex items-start justify-between gap-4"
                        >
                          <div>
                            <div className="flex flex-wrap items-center gap-2 mb-1.5">
                              <span
                                className={`text-[10px] font-mono uppercase tracking-[0.14em] px-2 py-0.5 border ${
                                  isOpen
                                    ? 'border-yellow-400 text-yellow-400 bg-yellow-400/10'
                                    : 'border-zinc-800 text-zinc-400 bg-zinc-950'
                                }`}
                              >
                                {card.badge}
                              </span>
                            </div>
                            <h4 className="font-display font-semibold tracking-[-0.01em] text-zinc-100 text-base sm:text-lg">
                              {card.title}
                            </h4>
                            <p className="text-xs font-sans text-zinc-500 mt-1">{card.subtitle}</p>
                          </div>
                          <span
                            className={`font-mono text-base transition-[transform,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                              isOpen ? 'rotate-45 text-yellow-400' : 'text-zinc-500'
                            }`}
                          >
                            +
                          </span>
                        </button>

                        {isOpen && (
                          <div className="px-4 sm:px-5 pb-5 pt-3 border-t border-zinc-800/80 animate-tactical-in text-left">
                            <p className="text-sm font-sans text-zinc-300 mb-3 leading-relaxed max-w-[68ch]">
                              {card.summary}
                            </p>
                            <ul className="space-y-2">
                              {card.details.map((d, i) => (
                                <li key={i} className="flex items-start gap-2.5 text-xs sm:text-sm font-sans text-zinc-400">
                                  <span className="mt-2 w-1.5 h-px bg-yellow-400 shrink-0"></span>
                                  <span>{d}</span>
                                </li>
                              ))}
                            </ul>
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              </article>
            )}
          </div>

          {/* Interactive Chargaff Base Inspector */}
          <div
            data-testid="chargaff-inspector"
            className="mt-8 bg-zinc-950 p-6 sm:p-8 border border-zinc-800"
          >
            <div className="grid md:grid-cols-12 gap-8 items-center">
              <div className="md:col-span-5">
                <span className="text-[11px] font-mono text-yellow-400 uppercase tracking-[0.16em]">
                  TERMINAL BIOQUÍMICO // REGRA DE CHARGAFF
                </span>
                <h3 className="text-xl sm:text-2xl font-display font-semibold tracking-[-0.015em] text-zinc-100 mt-2 mb-2">
                  DNA: A Molécula da Vida
                </h3>
                <p className="text-sm font-sans text-zinc-400 mb-5 leading-relaxed">
                  Selecione uma base nitrogenada para inspecionar sua geometria complementar e suas pontes de hidrogênio:
                </p>
                <div className="grid grid-cols-5 gap-2">
                  {['A', 'T', 'C', 'G', 'U'].map((b) => {
                    const item = b === 'U' ? RNA_URACIL_REF : BASE_INFO[b];
                    return (
                      <button
                        key={b}
                        type="button"
                        data-testid={`inspect-base-${b.toLowerCase()}`}
                        onClick={() => {
                          soundEngine.playClick();
                          setSelectedBase(b);
                        }}
                        className={`py-3 px-1.5 font-mono border transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] flex flex-col items-center gap-1 ${
                          selectedBase === b
                            ? 'bg-yellow-400 border-yellow-400 text-black font-bold'
                            : 'bg-black border-zinc-800 text-zinc-300 hover:border-zinc-600 hover:text-zinc-100'
                        }`}
                      >
                        <span className="text-base font-bold">{b}</span>
                        <span className="text-[9px] font-mono uppercase tracking-[0.04em]">{item.name}</span>
                      </button>
                    );
                  })}
                </div>
                <div className="mt-3 text-[10px] font-mono text-zinc-500 flex flex-wrap gap-x-3 gap-y-1">
                  <span>DNA: A–T / C–G (2 FITAS)</span>
                  <span className="text-zinc-400">RNA: A–U / C–G (1 FITA)</span>
                </div>
              </div>

              <div className="md:col-span-7 bg-black border border-zinc-800 p-5 sm:p-6">
                <div className="flex flex-col sm:flex-row items-center justify-between gap-4 pb-5 border-b border-zinc-800">
                  <div className="flex items-center gap-3">
                    <NucleotideShapeIcon base={base.code} size={44} active />
                    <div>
                      <div className="font-display font-semibold text-yellow-400 text-lg">
                        {base.name} ({base.code})
                      </div>
                      <div className="text-[11px] font-mono text-zinc-500 uppercase tracking-[0.1em]">
                        {base.group}
                      </div>
                    </div>
                  </div>

                  {/* Hydrogen Bonds SVG Line-Drawing */}
                  <div className="flex flex-col items-center">
                    <span className="text-[10px] font-mono text-zinc-400 uppercase tracking-[0.12em] mb-1.5 tabular-nums">
                      {base.bonds} Pontes de H
                    </span>
                    <svg
                      key={selectedBase}
                      width="96"
                      height="24"
                      viewBox="0 0 96 24"
                      aria-hidden="true"
                      className="overflow-visible"
                    >
                      {Array.from({ length: base.bonds }).map((_, idx) => {
                        const y = base.bonds === 2 ? 7 + idx * 10 : 4 + idx * 8;
                        return (
                          <line
                            key={idx}
                            x1="4"
                            y1={y}
                            x2="92"
                            y2={y}
                            stroke="#FACC15"
                            strokeWidth="1.5"
                            strokeDasharray="6 4"
                            className="svg-draw-line"
                            style={{ '--dash-len': 96, animationDelay: `${idx * 65}ms` }}
                          />
                        );
                      })}
                    </svg>
                  </div>

                  <div className="flex items-center gap-3">
                    <div className="text-right">
                      <div className="font-display font-semibold text-zinc-100 text-lg">
                        {partner.name} ({partner.code})
                      </div>
                      <div className="text-[11px] font-mono text-zinc-500 uppercase tracking-[0.1em]">
                        {partner.group}
                      </div>
                    </div>
                    <NucleotideShapeIcon base={partner.code} size={44} />
                  </div>
                </div>

                <p className="text-sm font-sans text-zinc-300 mt-4 leading-relaxed">
                  <span className="font-mono text-yellow-400 mr-2">&gt;_</span>
