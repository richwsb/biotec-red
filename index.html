    /* ============================================================================
     * 6. INTERAÇÃO 1: BIOLOGIA MOLECULAR (PAREAMENTO & CONSTRUÇÃO DA HÉLICE)
     * ============================================================================ */
    function MolecularPairingLab({ onCompleteMission }) {
      const [missionIdx, setMissionIdx] = useState(0);
      const mission = PAIRING_MISSIONS[missionIdx];

      const [pairs, setPairs] = useState(() => Array(mission.template.length).fill(null));
      const [activeSlot, setActiveSlot] = useState(0);
      const [dragOverSlot, setDragOverSlot] = useState(null);
      const [errorSlot, setErrorSlot] = useState(null);
      const [feedback, setFeedback] = useState({
        type: 'info',
        message: 'Clique ou arraste o nucleotídeo complementar (A↔T, C↔G) para parear a fita molde.',
      });
      const [mistakes, setMistakes] = useState(0);

      const resetMission = useCallback((idx) => {
        const nextMission = PAIRING_MISSIONS[idx];
        setMissionIdx(idx);
        setPairs(Array(nextMission.template.length).fill(null));
        setActiveSlot(0);
        setDragOverSlot(null);
        setErrorSlot(null);
        setMistakes(0);
        setFeedback({
          type: 'info',
          message: `Missão "${nextMission.title}" carregada. Complete os ${nextMission.template.length} pares da fita!`,
        });
      }, []);

      const completedCount = pairs.filter(Boolean).length;
      const isComplete = completedCount === mission.template.length;

      const attemptPair = useCallback(
        (slotIndex, chosenBase) => {
          if (isComplete) return;
          if (slotIndex < 0 || slotIndex >= mission.template.length) return;
          if (pairs[slotIndex]) {
            const firstEmpty = pairs.findIndex((p) => !p);
            if (firstEmpty !== -1) setActiveSlot(firstEmpty);
            return;
          }

          const templateBase = mission.template[slotIndex];
          const expectedBase = BASE_INFO[templateBase].pair;

          if (chosenBase === expectedBase) {
            soundEngine.playSuccess();
            const updated = [...pairs];
            updated[slotIndex] = chosenBase;
            setPairs(updated);
            setErrorSlot(null);

            const nextEmpty = updated.findIndex((p) => !p);
            setActiveSlot(nextEmpty === -1 ? slotIndex : nextEmpty);

            const justFinished = updated.every(Boolean);
            if (justFinished) {
              soundEngine.playVictory();
              onCompleteMission();
              setFeedback({
                type: 'success',
                message: `Dupla hélice estabilizada com 100% de precisão! Todas as ligações fosfodiéster e pontes de hidrogênio foram formadas.`,
              });
            } else {
              setFeedback({
                type: 'success',
                message: `Pareamento correto: ${BASE_INFO[templateBase].name} (${templateBase}) ↔ ${BASE_INFO[chosenBase].name} (${chosenBase}) com ${BASE_INFO[templateBase].bonds} pontes de hidrogênio!`,
              });
            }
          } else {
            soundEngine.playError();
            setMistakes((m) => m + 1);
            setErrorSlot(slotIndex);
            setTimeout(() => setErrorSlot(null), 500);
            setFeedback({
              type: 'error',
              message: `Incompatibilidade estérica! ${BASE_INFO[templateBase].name} (${templateBase}) pareia exclusivamente com ${BASE_INFO[expectedBase].name} (${expectedBase}), não com ${BASE_INFO[chosenBase].name} (${chosenBase}).`,
            });
          }
        },
        [isComplete, mission.template, onCompleteMission, pairs]
      );

      const handleKeyDown = (e) => {
        const key = e.key.toUpperCase();
        if (['A', 'T', 'C', 'G'].includes(key) && !isComplete) {
          attemptPair(activeSlot, key);
        }
      };

      const gcCount = mission.template.filter((b) => b === 'G' || b === 'C').length;
      const gcPercent = Math.round((gcCount / mission.template.length) * 100);
      const tmCelsius = 4 * gcCount + 2 * (mission.template.length - gcCount);

      return (
        <section
          id="pareamento"
          tabIndex={-1}
          onKeyDown={handleKeyDown}
          className="py-16 sm:py-24 px-4 sm:px-6 max-w-7xl mx-auto focus:outline-none"
        >
          <SectionHeader
            eyebrow="Interação 01 // Bancada Forense"
            title="Pareamento & Construção da Dupla Hélice"
            accent="green"
            subtitle="Uma fita única de DNA expõe suas bases nitrogenadas. Arraste ou clique nos nucleotídeos livres (A, T, C, G) para sintetizar a fita complementar e validar a evidência."
          />

          {/* Mission Switcher */}
          <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div className="flex flex-wrap gap-2">
              {PAIRING_MISSIONS.map((m, idx) => (
                <button
                  key={m.id}
                  type="button"
                  onClick={() => {
                    soundEngine.playClick();
                    resetMission(idx);
                  }}
                  className={`px-3.5 py-2 rounded-none text-xs font-mono border transition flex items-center gap-2 ${
                    missionIdx === idx
                      ? 'bg-yellow-400 border-yellow-300 text-black font-bold shadow-neon-yellow'
                      : 'bg-zinc-900 border-zinc-700 text-zinc-300 hover:border-yellow-400 hover:text-yellow-400'
                  }`}
                >
                  <span
                    className={`w-2 h-2 ${
                      missionIdx === idx ? 'bg-black' : 'bg-yellow-400'
                    }`}
                  ></span>
                  {m.title}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-3 text-xs font-mono">
              <span className="px-3 py-1.5 rounded-none bg-zinc-900 border border-yellow-400/40 text-zinc-200">
                PARES: <strong className="text-yellow-400">{completedCount}/{mission.template.length}</strong>
              </span>
              <span className="px-3 py-1.5 rounded-none bg-zinc-900 border border-zinc-700 text-zinc-200">
                ERROS: <strong className="text-yellow-300">{mistakes}</strong>
              </span>
              <button
                type="button"
                onClick={() => {
                  soundEngine.playClick();
                  resetMission(missionIdx);
                }}
                className="px-3 py-1.5 rounded-none bg-zinc-900 hover:bg-yellow-400 hover:text-black text-yellow-400 border border-yellow-400/60 font-bold transition"
              >
                REINICIAR
              </button>
            </div>
          </div>

          <div className="dossier-card rounded-none p-5 sm:p-7 border-2 border-yellow-400/50 relative overflow-hidden">
            {/* Live Feedback Banner com Escâner Policial + Terminal Blink */}
            <div
              role="status"
              aria-live="polite"
              className={`mb-6 p-3.5 rounded-none border text-xs sm:text-sm font-mono flex items-center gap-3 transition-all ${
                feedback.type === 'success'
                  ? 'police-scanner bg-yellow-400/15 border-yellow-400 text-yellow-300 shadow-neon-yellow'
                  : feedback.type === 'error'
                  ? 'bg-zinc-950 border-yellow-500 text-yellow-200'
                  : 'bg-black border-zinc-700 text-zinc-200'
              }`}
            >
              <span
                className={`w-2.5 h-2.5 shrink-0 ${
                  feedback.type === 'success'
                    ? 'bg-yellow-400 terminal-blink'
                    : feedback.type === 'error'
                    ? 'bg-yellow-500 terminal-blink'
                    : 'bg-yellow-400'
                }`}
              ></span>
              <span className="relative z-10">
                {feedback.type === 'success' && <strong className="terminal-blink mr-2">[SCAN MATCH OK]</strong>}
                {feedback.type === 'error' && <strong className="terminal-blink mr-2">[ALERTA DE ERRO]</strong>}
                {feedback.message}
              </span>
            </div>

            {/* Strand Pairing Canvas */}
            <div className="bg-black rounded-none border border-zinc-800 p-4 sm:p-6 overflow-x-auto">
              <div className="min-w-[600px]">
                {/* Top Label */}
                <div className="flex items-center justify-between text-[11px] font-mono text-zinc-400 mb-3">
                  <span className="text-yellow-400 font-bold">3&apos; — FITA MOLDE (EXPOSTA) — 5&apos;</span>
                  <span>{mission.description}</span>
                </div>

                {/* Template Backbone */}
                <div className="h-3.5 hazard-tape-thin border border-yellow-400 mb-2 relative">
                  <span className="absolute -top-0.5 left-2 bg-black px-1.5 text-[9px] font-mono font-bold text-yellow-400">
                    ESQUELETO AÇÚCAR-FOSFATO
                  </span>
                </div>

                {/* 8 Base Pair Columns */}
                <div className="grid grid-cols-8 gap-2 sm:gap-3 my-2">
                  {mission.template.map((tBase, idx) => {
                    const pairedBase = pairs[idx];
                    const isTarget = !pairedBase && activeSlot === idx;
                    const isError = errorSlot === idx;
                    const isDragTarget = dragOverSlot === idx;
                    const info = BASE_INFO[tBase];

                    return (
                      <div key={idx} className="flex flex-col items-center">
                        {/* Template Base */}
                        <div
                          className={`w-full py-2.5 rounded-none border flex flex-col items-center justify-center transition ${info.bgClass}`}
                        >
                          <NucleotideShapeIcon base={tBase} size={30} />
                          <span className="text-[10px] font-mono mt-1 font-bold uppercase">{info.name}</span>
                        </div>

                        {/* Hydrogen Bond Zone */}
                        <div className="h-9 flex flex-col items-center justify-center gap-1 my-1">
                          {pairedBase ? (
                            <div className="flex flex-col gap-1 items-center animate-spring">
                              {Array.from({ length: info.bonds }).map((_, bIdx) => (
                                <span
                                  key={bIdx}
                                  className="w-8 h-0.5 bg-yellow-400 shadow-[0_0_8px_#FACC15]"
                                ></span>
                              ))}
                            </div>
                          ) : (
                            <span className="text-[10px] font-mono text-zinc-600">
                              {info.bonds} H-BOND
                            </span>
                          )}
                        </div>

                        {/* Drop / Target Slot for Complementary Base */}
                        <button
                          type="button"
                          onClick={() => {
                            if (!pairedBase) {
                              soundEngine.playClick();
                              setActiveSlot(idx);
                            }
                          }}
                          onDragOver={(e) => {
                            e.preventDefault();
                            if (!pairedBase) setDragOverSlot(idx);
                          }}
                          onDragLeave={() => setDragOverSlot(null)}
                          onDrop={(e) => {
                            e.preventDefault();
                            setDragOverSlot(null);
                            const droppedBase = e.dataTransfer.getData('text/plain');
                            if (droppedBase) {
                              attemptPair(idx, droppedBase);
                            }
                          }}
                          aria-label={`Posição ${idx + 1}: Fita molde ${info.name}. ${
                            pairedBase ? `Pareado com ${BASE_INFO[pairedBase].name}` : 'Aguardando nucleotídeo complementar'
                          }`}
                          className={`w-full min-h-[76px] rounded-none border-2 flex flex-col items-center justify-center transition-all ${
                            pairedBase
                              ? 'bg-yellow-400/20 border-yellow-400 text-yellow-300 shadow-neon-yellow animate-spring'
                              : isError
                              ? 'bg-zinc-900 border-yellow-500 text-yellow-200 animate-shake'
                              : isDragTarget
                              ? 'bg-yellow-400/30 border-yellow-300 scale-105'
                              : isTarget
                              ? 'bg-zinc-900 border-dashed border-yellow-400 shadow-neon-yellow'
                              : 'bg-zinc-950 border-dashed border-zinc-700 hover:border-yellow-400/60'
                          }`}
                        >
                          {pairedBase ? (
                            <>
                              <NucleotideShapeIcon base={pairedBase} size={30} />
                              <span className="text-[10px] font-mono text-yellow-400 mt-1 font-bold">
                                ✓ {BASE_INFO[pairedBase].name}
                              </span>
                            </>
                          ) : (
                            <span className={`text-[11px] font-mono px-1 text-center ${isTarget ? 'text-yellow-400 font-bold terminal-blink' : 'text-zinc-500'}`}>
                              {isTarget ? 'ALVO #' + (idx + 1) : 'SOLTE / CLIQUE'}
                            </span>
                          )}
                        </button>
                      </div>
                    );
                  })}
                </div>

                {/* Complementary Backbone */}
                <div
                  className={`h-3 rounded-none mt-2 relative transition-all duration-700 ${
                    isComplete
                      ? 'bg-yellow-400 shadow-neon-yellow'
                      : 'bg-zinc-900 border border-zinc-700'
                  }`}
                >
                  <div
                    className="h-full bg-yellow-400 transition-all duration-500"
                    style={{ width: `${(completedCount / mission.template.length) * 100}%` }}
                  ></div>
                </div>
                <div className="flex items-center justify-between text-[11px] font-mono text-zinc-400 mt-2">
                  <span className="text-yellow-400">5&apos; — FITA COMPLEMENTAR SINTETIZADA — 3&apos;</span>
                  <span>ATALHO: TECLAS A, T, C, G PAREIAM O ALVO SELECIONADO</span>
                </div>
              </div>
            </div>

            {/* Draggable / Clickable Free Nucleotides Dock OR Completed Double Helix Animation */}
            {!isComplete ? (
              <div className="mt-6">
                <div className="text-xs font-mono uppercase tracking-wider text-yellow-400 mb-3">
                  &gt; NUCLEOTÍDEOS DISPONÍVEIS (ARRASTE PARA O SLOT OU CLIQUE PARA PAREAR ALVO #{activeSlot + 1}):
                </div>
                <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                  {['A', 'T', 'C', 'G'].map((b, i) => {
                    const info = BASE_INFO[b];
                    return (
                      <button
                        key={b}
                        type="button"
                        draggable
                        onDragStart={(e) => {
                          e.dataTransfer.setData('text/plain', b);
                          soundEngine.playClick();
                        }}
                        onClick={() => attemptPair(activeSlot, b)}
                        style={{ animationDelay: `${i * 0.25}s` }}
                        className="group animate-float bg-zinc-900 hover:bg-yellow-400 hover:text-black p-3.5 rounded-none border-2 border-yellow-400/50 hover:border-yellow-300 cursor-grab active:cursor-grabbing transition flex items-center gap-3 text-left shadow-sm hover:shadow-neon-yellow"
                      >
                        <NucleotideShapeIcon base={b} size={36} />
                        <div>
                          <div className="font-display uppercase text-white group-hover:text-black text-base flex items-center gap-1.5">
                            {info.name}
                            <span className="text-[10px] font-mono px-1.5 py-0.5 bg-yellow-400 text-black font-bold">
                              [{b}]
                            </span>
                          </div>
                          <div className="text-[11px] font-mono text-zinc-300 group-hover:text-black">
                            Pareia com {info.pair} ({info.bonds} H)
                          </div>
                        </div>
                      </button>
                    );
                  })}
                </div>
              </div>
            ) : (
              <div className="mt-6 police-scanner rounded-none bg-zinc-950 border-2 border-yellow-400 p-5 sm:p-6 shadow-neon-yellow animate-spring">
                <div className="grid md:grid-cols-12 gap-6 items-center relative z-10">
                  <div className="md:col-span-7">
                    <span className="inline-flex items-center gap-2 px-3 py-1 rounded-none bg-yellow-400 text-black text-xs font-mono font-bold mb-3 terminal-blink">
                      ✓ SÍNTESE VALIDADA // DUPLA HÉLICE ESTÁVEL
                    </span>
                    <h3 className="text-xl sm:text-2xl font-display uppercase text-white mb-2">
                      Fitas Pareadas com 100% de Conformidade!
                    </h3>
                    <p className="text-xs sm:text-sm font-mono text-zinc-300 leading-relaxed mb-4">
                      As duas fitas antiparalelas (<code className="text-yellow-400">3&apos;→5&apos;</code> e <code className="text-yellow-400">5&apos;→3&apos;</code>) acoplaram perfeitamente formando uma dupla hélice termodinamicamente estável.
                    </p>
                    <div className="grid grid-cols-3 gap-2.5">
                      <div className="bg-black border border-yellow-400/50 rounded-none p-3">
                        <div className="text-[10px] font-mono text-zinc-400">CONTEÚDO GC</div>
                        <div className="text-lg font-display text-yellow-400">{gcPercent}%</div>
                      </div>
                      <div className="bg-black border border-yellow-400/50 rounded-none p-3">
                        <div className="text-[10px] font-mono text-zinc-400">TEMP. MELTING</div>
                        <div className="text-lg font-display text-yellow-400">{tmCelsius}°C</div>
                      </div>
                      <div className="bg-black border border-yellow-400/50 rounded-none p-3">
                        <div className="text-[10px] font-mono text-zinc-400">PRECISÃO</div>
                        <div className="text-lg font-display text-white">
                          {Math.max(0, Math.round((mission.template.length / (mission.template.length + mistakes)) * 100))}%
                        </div>
                      </div>
                    </div>
                  </div>

                  {/* Mini Rotating 3D Formed Double Helix */}
                  <div className="md:col-span-5 flex flex-col items-center justify-center bg-black rounded-none border border-yellow-400/50 p-4 h-56 overflow-hidden">
                    <div className="helix-scene-3d w-full h-full flex items-center justify-center">
                      <div className="helix-rotor-3d w-36 h-44 flex flex-col justify-between">
                        {mission.template.map((tB, i) => (
                          <div
                            key={i}
                            className="flex items-center justify-between"
                            style={{ transform: `rotateY(${i * 36}deg)`, transformStyle: 'preserve-3d' }}
                          >
                            <span className="w-5 h-5 rounded-none bg-yellow-400 text-[10px] font-mono font-bold text-black flex items-center justify-center shadow-neon-yellow">
                              {tB}
                            </span>
                            <span className="flex-1 h-1 mx-1 bg-yellow-400 shadow-[0_0_8px_#FACC15]"></span>
                            <span className="w-5 h-5 rounded-none bg-zinc-200 text-[10px] font-mono font-bold text-black flex items-center justify-center">
                              {pairs[i]}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}
          </div>
        </section>
      );
    }

    /* ============================================================================
     * 7. INTERAÇÃO 2: O PASSO A PASSO DO LABORATÓRIO (STEPPER 5 FASES)
     * ============================================================================ */
    const PIPELINE_STEPS = [
      {
        id: 'coleta',
        number: '01',
        title: 'Coleta',
        subtitle: 'Captura da Amostra Biológica',
        summary:
          'Um swab estéril de algodão coleta células epiteliais da saliva ou vestígios de sangue sem contaminar a amostra.',
        actionLabel: 'Coletar Amostra com Swab',
        equipment: 'Swab Estéril & Microtubo DNA-Free',
        scienceNote:
          'Cada célula nucleada humana contém cerca de 6 picogramas de DNA. A cadeia de custódia inicia aqui com vedação e identificação única.',
      },
      {
        id: 'extracao',
        number: '02',
        title: 'Extração',
        subtitle: 'Lise Celular e Purificação',
        summary:
          'Detergentes e proteinase K rompem as membranas celulares e nucleares, separando lipídios e proteínas para isolar o DNA puro.',
        actionLabel: 'Romper Células & Isolar DNA',
        equipment: 'Tampão de Lise + Centrífuga Refrigerada',
        scienceNote:
          'Lipídios e proteínas desnaturadas precipitam no fundo (pellet), enquanto os ácidos nucleicos puros permanecem dissolvidos no sobrenadante aquoso.',
      },
      {
        id: 'pcr',
        number: '03',
        title: 'PCR',
        subtitle: 'Amplificação no Termociclador',
        summary:
          'A Reação em Cadeia da Polimerase alterna temperaturas (95°C, 58°C, 72°C) para multiplicar uma única região de DNA em milhões de cópias.',
        actionLabel: 'Iniciar Ciclos do Termociclador',
        equipment: 'Termociclador + Taq Polimerase + Primers',
        scienceNote:
          'A amplificação é exponencial (2ⁿ): após 30 ciclos, 1 molécula-alvo gera mais de 1 bilhão de cópias idênticas para análise.',
      },
      {
        id: 'analise',
        number: '04',
        title: 'Análise',
        subtitle: 'Eletroforese em Gel',
        summary:
          'Os fragmentos amplificados migram em um gel sob corrente elétrica do polo negativo (-) ao positivo (+), gerando um padrão de bandas por tamanho.',
        actionLabel: 'Aplicar Corrente & Revelar Bandas',
        equipment: 'Cuba de Eletroforese + Transiluminador UV',
        scienceNote:
          'Como o grupo fosfato confere carga negativa ao DNA, ele migra rumo ao polo positivo. Fragmentos menores atravessam os poros do gel mais rapidamente.',
      },
      {
        id: 'comparacao',
        number: '05',
        title: 'Comparação',
        subtitle: 'Match com Banco de Dados',
        summary:
          'O perfil de bandas obtido é confrontado lado a lado com perfis de suspeitos (Forense) ou de variantes clínicas (Biotecnologia Vermelha).',
        actionLabel: 'Escanear Banco de Dados',
        equipment: 'Software CODIS / Genômica Clínica',
        scienceNote:
          'Um alinhamento perfeito confirma com rigor estatístico a autoria em investigações ou a presença de mutações patogênicas no diagnóstico médico.',
      },
    ];

    function LaboratoryPipelineStepper({ onCompletePipeline }) {
      const [currentStep, setCurrentStep] = useState(0);
      const [contextMode, setContextMode] = useState('forense');
      const [executedSteps, setExecutedSteps] = useState({});
      const [simRunning, setSimRunning] = useState(false);
      const [pcrCycle, setPcrCycle] = useState(0);
      const simTimerRef = useRef(null);

      const step = PIPELINE_STEPS[currentStep];
      const isStepDone = Boolean(executedSteps[step.id]);
      const completedTotal = Object.keys(executedSteps).length;

      const clearSimTimer = useCallback(() => {
        if (simTimerRef.current) {
          clearInterval(simTimerRef.current);
          clearTimeout(simTimerRef.current);
          simTimerRef.current = null;
        }
      }, []);

      useEffect(() => {
        return () => clearSimTimer();
      }, [clearSimTimer]);

      useEffect(() => {
        if (completedTotal === PIPELINE_STEPS.length) {
          onCompletePipeline();
        }
      }, [completedTotal, onCompletePipeline]);

      const markStepExecuted = useCallback((stepId) => {
        setExecutedSteps((prev) => (prev[stepId] ? prev : { ...prev, [stepId]: true }));
      }, []);

      const runSimulation = () => {
        if (simRunning) return;
        clearSimTimer();
        soundEngine.playLabPulse(currentStep);
        setSimRunning(true);

        if (step.id === 'pcr') {
          setPcrCycle(0);
          let cycle = 0;
          const targetId = step.id;
          simTimerRef.current = setInterval(() => {
            cycle += 5;
            setPcrCycle(cycle);
            if (cycle >= 30) {
              clearSimTimer();
              setSimRunning(false);
              markStepExecuted(targetId);
              soundEngine.playSuccess();
            }
          }, 260);
        } else {
          const targetId = step.id;
          const isFinal = currentStep === PIPELINE_STEPS.length - 1;
          simTimerRef.current = setTimeout(() => {
            simTimerRef.current = null;
            setSimRunning(false);
            markStepExecuted(targetId);
            if (isFinal) {
              soundEngine.playVictory();
            } else {
              soundEngine.playSuccess();
            }
          }, 1450);
        }
      };

      return (
        <section id="pipeline" className="py-16 sm:py-24 px-4 sm:px-6 max-w-7xl mx-auto">
          <SectionHeader
            eyebrow="Interação 02 // Cadeia de Custódia Pericial"
            title="O Passo a Passo do Laboratório (5 Fases)"
            accent="cyan"
            subtitle="Execute cada fase do protocolo tático — Coleta, Extração, PCR, Análise e Comparação — para processar a evidência biológica e emitir o laudo de Match."
          />

          {/* Scenario Context Toggle + Progress */}
          <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div className="inline-flex p-1 rounded-none bg-zinc-900 border border-yellow-400/40">
              <button
                type="button"
                onClick={() => {
                  soundEngine.playClick();
                  setContextMode('forense');
                }}
                className={`px-3.5 py-1.5 rounded-none text-xs font-mono transition ${
                  contextMode === 'forense'
                    ? 'bg-yellow-400 text-black font-bold'
                    : 'text-zinc-400 hover:text-yellow-400'
                }`}
              >
                MODO FORENSE (SUSPEITOS)
              </button>
              <button
                type="button"
                onClick={() => {
                  soundEngine.playClick();
                  setContextMode('clinico');
                }}
                className={`px-3.5 py-1.5 rounded-none text-xs font-mono transition ${
                  contextMode === 'clinico'
                    ? 'bg-yellow-400 text-black font-bold'
                    : 'text-zinc-400 hover:text-yellow-400'
                }`}
              >
                MODO DIAGNÓSTICO (DOENÇAS)
              </button>
            </div>

            <div className="text-xs font-mono text-zinc-300 bg-zinc-900 border border-zinc-700 px-3 py-1.5">
              PROTOCOLO:{' '}
              <span className="text-yellow-400 font-bold">{completedTotal} / 5 FASES VALIDADAS</span>
            </div>
          </div>

          {/* 5-Step Interactive Stepper Bar */}
          <div className="grid grid-cols-2 sm:grid-cols-5 gap-2.5 mb-6" role="tablist" aria-label="Fases do laboratório">
            {PIPELINE_STEPS.map((s, idx) => {
              const active = idx === currentStep;
              const done = Boolean(executedSteps[s.id]);
              return (
                <button
                  key={s.id}
                  type="button"
                  role="tab"
                  aria-selected={active}
                  onClick={() => {
                    soundEngine.playClick();
                    clearSimTimer();
                    setCurrentStep(idx);
                    setSimRunning(false);
                  }}
                  className={`p-3 rounded-none border-2 text-left transition-all relative overflow-hidden ${
                    idx === 4 ? "col-span-2 sm:col-span-1 " : ""
                  }${
                    active
                      ? 'bg-yellow-400 border-yellow-300 text-black shadow-neon-yellow'
                      : done
                      ? 'bg-zinc-900 border-yellow-400 text-white'
                      : 'bg-zinc-950 border-zinc-800 hover:border-yellow-400/60 text-zinc-300'
                  }`}
                >
                  <div className="flex items-center justify-between mb-1">
                    <span
                      className={`text-xs font-mono font-bold ${
                        active ? 'text-black' : done ? 'text-yellow-400' : 'text-zinc-500'
                      }`}
                    >
                      FASE {s.number}
                    </span>
                    {done && (
                      <span className={`w-4 h-4 rounded-none text-[10px] font-bold flex items-center justify-center ${active ? 'bg-black text-yellow-400' : 'bg-yellow-400 text-black'}`}>
                        ✓
                      </span>
                    )}
                  </div>
                  <div className={`font-display uppercase text-sm sm:text-base ${active ? 'text-black' : 'text-white'}`}>
                    {s.title}
                  </div>
                  <div className={`text-[11px] font-mono truncate ${active ? 'text-zinc-900' : 'text-zinc-400'}`}>
                    {s.subtitle}
                  </div>
                </button>
              );
            })}
          </div>

          {/* Active Lab Station */}
          <div className="dossier-card rounded-none border-2 border-yellow-400/50 p-5 sm:p-7">
            <div className="grid lg:grid-cols-12 gap-7 items-center">
              {/* Left Info & Controls */}
              <div className="lg:col-span-5 space-y-4">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="px-2.5 py-0.5 rounded-none bg-yellow-400 text-black font-bold text-[11px] font-mono">
                    ETAPA {step.number} DE 05
                  </span>
                  <span className="text-[11px] font-mono text-yellow-400/90">{step.equipment}</span>
                </div>

                <h3 className="text-2xl sm:text-3xl font-display uppercase tracking-wide text-white">
                  {step.title}: {step.subtitle}
                </h3>

                <p className="text-xs sm:text-sm font-mono text-zinc-300 leading-relaxed">{step.summary}</p>

                <div className="p-3.5 rounded-none bg-black border border-yellow-400/40 text-xs font-mono text-zinc-200">
                  <strong className="text-yellow-400 block mb-1">&gt;_ LAUDO TÉCNICO DE BANCADA:</strong>
                  {step.scienceNote}
                </div>

                <div className="flex flex-wrap items-center gap-3 pt-2">
                  <button
                    type="button"
                    onClick={runSimulation}
                    disabled={simRunning}
                    className={`px-5 py-3 rounded-none font-mono uppercase font-bold text-xs sm:text-sm border-2 transition flex items-center gap-2 ${
                      simRunning
                        ? 'bg-zinc-900 border-yellow-400 text-yellow-400 cursor-wait terminal-blink'
                        : isStepDone
                        ? 'bg-yellow-400 border-yellow-300 text-black hover:bg-yellow-300 shadow-neon-yellow'
                        : 'bg-yellow-400 border-yellow-300 text-black hover:bg-yellow-300 shadow-neon-yellow'
                    }`}
                  >
                    {simRunning
                      ? '>>> PROCESSANDO EVIDÊNCIA...'
                      : isStepDone
                      ? `✓ REEXECUTAR: ${step.title.toUpperCase()}`
                      : step.actionLabel.toUpperCase()}
                  </button>

                  {currentStep < PIPELINE_STEPS.length - 1 && (
                    <button
                      type="button"
                      onClick={() => {
                        soundEngine.playClick();
                        clearSimTimer();
                        setSimRunning(false);
                        setCurrentStep((s) => s + 1);
                      }}
                      className="px-4 py-3 rounded-none border border-yellow-400/60 bg-zinc-900 hover:bg-yellow-400 hover:text-black text-xs font-mono font-bold text-yellow-400 transition"
                    >
                      PRÓXIMA FASE →
                    </button>
                  )}
                </div>
              </div>

              {/* Right Interactive Animated Lab Viewport */}
              <div className={`lg:col-span-7 bg-black rounded-none border-2 border-yellow-400/50 p-4 sm:p-6 min-h-[310px] flex flex-col justify-between relative overflow-hidden ${simRunning || isStepDone ? 'police-scanner' : ''}`}>
                <div className="scanline-overlay absolute inset-0"></div>

                {/* Viewport Header */}
                <div className="relative z-10 flex items-center justify-between text-[11px] font-mono text-zinc-400 border-b border-yellow-400/30 pb-2 mb-4">
                  <span className="text-yellow-400 font-bold">TERMINAL CSI // CÂMARA {step.id.toUpperCase()}</span>
                  <span className={isStepDone ? 'text-yellow-400 font-bold terminal-blink' : simRunning ? 'text-yellow-300 terminal-blink' : 'text-zinc-500'}>
                    {simRunning ? '● ESCANEANDO...' : isStepDone ? '● LAUDO VALIDADO' : '○ AGUARDANDO COMANDO'}
                  </span>
                </div>

                {/* STAGE 1: COLETA */}
                {step.id === 'coleta' && (
                  <div className="relative z-10 flex-1 flex flex-col items-center justify-center py-2">
                    <div className="relative w-full max-w-md h-48 flex items-center justify-around">
                      {/* Swab */}
                      <div className={`flex flex-col items-center ${simRunning || isStepDone ? 'animate-swab' : ''}`}>
                        <div className="w-2 h-24 bg-zinc-300"></div>
                        <div className="w-6 h-9 bg-yellow-400 rounded-b-full border-2 border-yellow-200 shadow-neon-yellow"></div>
                        <span className="text-[10px] font-mono text-yellow-400 mt-1">Swab Estéril</span>
                      </div>

                      {/* Biological Sample */}
                      <div className="flex flex-col items-center">
                        <div className="w-24 h-24 rounded-none border-2 border-dashed border-yellow-400/70 bg-zinc-900 flex items-center justify-center relative">
                          <div className={`w-12 h-12 rounded-full transition-all duration-700 ${
                            contextMode === 'forense' ? 'bg-yellow-400/80 shadow-neon-yellow' : 'bg-yellow-300/70 shadow-neon-yellow'
                          } ${simRunning ? 'scale-125' : ''}`}></div>
                          <span className="absolute -bottom-6 text-[10px] font-mono text-zinc-200 whitespace-nowrap">
                            {contextMode === 'forense' ? 'Vestígio Criminal' : 'Saliva / Mucosa'}
                          </span>
                        </div>
                      </div>

                      {/* Collection Microtube */}
                      <div className="flex flex-col items-center">
                        <div className="w-12 h-24 border-2 border-yellow-400/60 rounded-b-full relative overflow-hidden bg-zinc-950">
                          <div
                            className={`absolute bottom-0 inset-x-0 transition-all duration-1000 ${
                              isStepDone ? 'h-14 bg-yellow-400/60' : simRunning ? 'h-10 bg-yellow-400/40' : 'h-2 bg-zinc-700'
                            }`}
                          ></div>
                        </div>
                        <span className="text-[10px] font-mono text-yellow-400 mt-1">Tubo #CSI-042</span>
                      </div>
                    </div>
                  </div>
                )}

                {/* STAGE 2: EXTRAÇÃO */}
                {step.id === 'extracao' && (
                  <div className="relative z-10 flex-1 flex flex-col items-center justify-center py-2">
                    <div className="w-full max-w-md flex flex-col items-center">
                      <div className="relative w-48 h-48 flex items-center justify-center">
                        <div
                          className={`absolute inset-2 rounded-full border-2 transition-all duration-700 ${
                            simRunning || isStepDone
                              ? 'border-dashed border-yellow-400/60 scale-125 opacity-30'
                              : 'border-yellow-400 bg-zinc-900/40'
                          }`}
                        ></div>
                        <div
                          className={`w-24 h-24 rounded-full border-2 flex items-center justify-center transition-all duration-700 ${
                            simRunning || isStepDone
                              ? 'border-dashed border-yellow-300/60 scale-110 opacity-40'
                              : 'border-zinc-500 bg-zinc-900/60'
                          }`}
                        ></div>

                        <div
                          className={`absolute flex flex-col items-center transition-all duration-700 ${
                            simRunning || isStepDone ? 'scale-110 opacity-100' : 'scale-75 opacity-60'
                          }`}
                        >
                          <svg width="96" height="64" viewBox="0 0 96 64">
                            <path d="M8,16 Q28,4 48,16 T88,16" fill="none" stroke="#FACC15" strokeWidth="3.5" />
                            <path d="M8,44 Q28,56 48,44 T88,44" fill="none" stroke="#E4E4E7" strokeWidth="3.5" />
                            <line x1="20" y1="12" x2="20" y2="48" stroke="#FACC15" strokeWidth="2" />
                            <line x1="48" y1="16" x2="48" y2="44" stroke="#FACC15" strokeWidth="2" />
                            <line x1="76" y1="12" x2="76" y2="48" stroke="#FACC15" strokeWidth="2" />
                          </svg>
                          <span className="text-[11px] font-mono text-yellow-400 font-bold">
                            {isStepDone ? 'DNA PURO ISOLADO!' : 'LISE CELULAR + PRECIPITAÇÃO'}
                          </span>
                        </div>
                      </div>

                      <div className="grid grid-cols-3 gap-2 w-full text-center text-[10px] font-mono mt-2">
                        <div className="p-1.5 bg-zinc-900 border border-zinc-700 text-zinc-300">
                          Lipídios removidos
                        </div>
                        <div className="p-1.5 bg-zinc-900 border border-zinc-700 text-zinc-300">
                          Proteínas digeridas
                        </div>
                        <div className="p-1.5 bg-yellow-400 text-black font-bold">
                          DNA Purificado
                        </div>
                      </div>
                    </div>
                  </div>
                )}

                {/* STAGE 3: PCR */}
                {step.id === 'pcr' && (
                  <div className="relative z-10 flex-1 flex flex-col justify-center py-2">
                    <div className="grid sm:grid-cols-3 gap-3 mb-4">
                      {[
                        { label: 'Desnaturação', temp: '95°C', active: simRunning && pcrCycle % 15 === 5 },
                        { label: 'Anelamento', temp: '58°C', active: simRunning && pcrCycle % 15 === 10 },
                        { label: 'Extensão (Taq)', temp: '72°C', active: simRunning && pcrCycle % 15 === 0 },
                      ].map((phase) => (
                        <div
                          key={phase.label}
                          className={`p-3 rounded-none border text-center transition ${
                            phase.active
                              ? 'bg-yellow-400 border-yellow-300 text-black shadow-neon-yellow'
                              : 'bg-zinc-900 border-zinc-700 text-white'
                          }`}
                        >
                          <div className="text-lg font-display font-bold">{phase.temp}</div>
                          <div className="text-[11px] font-mono">{phase.label}</div>
                        </div>
                      ))}
                    </div>

                    <div className="bg-zinc-950 rounded-none border border-yellow-400/40 p-4">
                      <div className="flex items-center justify-between text-xs font-mono mb-3">
                        <span className="text-zinc-300">
                          CICLO TÉRMICO: <strong className="text-yellow-400">{isStepDone ? 30 : pcrCycle} / 30</strong>
                        </span>
                        <span className="text-yellow-400 font-bold">
                          CÓPIAS: {isStepDone ? '1.073.741.824' : Math.pow(2, pcrCycle).toLocaleString('pt-BR')}
                        </span>
                      </div>

                      <div className="flex flex-wrap gap-1.5 items-center justify-center min-h-[54px]">
                        {Array.from({ length: Math.min(24, Math.max(1, isStepDone ? 24 : pcrCycle + 1)) }).map((_, idx) => (
                          <div
                            key={idx}
                            className="w-6 h-2 bg-yellow-400 animate-spring shadow-[0_0_6px_rgba(250,204,21,0.5)]"
                          ></div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* STAGE 4: ANÁLISE (ELETROFORESE) */}
                {step.id === 'analise' && (
                  <div className="relative z-10 flex-1 flex flex-col justify-center py-2">
                    <div className="bg-zinc-950 rounded-none border border-yellow-400/40 p-4 relative">
                      <div className="flex justify-between text-[11px] font-mono mb-2">
                        <span className="text-zinc-300 font-bold">POLO NEGATIVO (-)</span>
                        <span className="text-yellow-400 font-bold">POLO POSITIVO (+) MIGRAÇÃO</span>
                      </div>

                      <div className="grid grid-cols-4 gap-3 h-40 bg-black rounded-none border border-zinc-800 p-3 relative overflow-hidden">
                        {['Ladder', 'Amostra #042', 'Controle (+)', 'Controle (-)'].map((lane, lIdx) => {
                          const bandOffsets =
                            lIdx === 0
                              ? [20, 42, 65, 92, 115]
                              : lIdx === 1
                              ? [28, 72, 108]
                              : lIdx === 2
                              ? [28, 72, 108]
                              : [];
                          return (
                            <div key={lane} className="relative border-r last:border-r-0 border-zinc-800 flex flex-col items-center">
                              <div className="w-8 h-2 bg-zinc-700 mb-2"></div>
                              <span className="text-[9px] font-mono text-zinc-400 text-center">{lane}</span>
                              {(simRunning || isStepDone) &&
                                bandOffsets.map((y, bIdx) => (
                                  <div
                                    key={bIdx}
                                    style={{ '--target-y': `${y}px` }}
                                    className={`animate-gel-band absolute top-6 w-10 h-1.5 ${
                                      lIdx === 1
                                        ? 'bg-yellow-400 shadow-[0_0_12px_#FACC15]'
                                        : 'bg-zinc-300 shadow-[0_0_6px_rgba(255,255,255,0.5)]'
                                    }`}
                                  ></div>
                                ))}
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}

                {/* STAGE 5: COMPARAÇÃO */}
                {step.id === 'comparacao' && (
                  <div className="relative z-10 flex-1 flex flex-col justify-center py-2">
                    <div className="grid grid-cols-4 gap-3 relative">
                      {simRunning && (
                        <div className="animate-scan absolute inset-x-0 h-1 bg-yellow-400 shadow-[0_0_16px_#FACC15] z-20"></div>
                      )}

                      {[
                        {
                          name: 'Amostra Coletada',
                          bands: [18, 48, 74],
                          isTarget: true,
                        },
                        {
                          name: contextMode === 'forense' ? 'Perfil DB #01' : 'Alelo Saudável',
                          bands: [26, 62, 85],
                          isMatch: false,
                        },
                        {
                          name: contextMode === 'forense' ? 'Perfil DB #02 (Alvo)' : 'Mutação Alvo',
                          bands: [18, 48, 74],
                          isMatch: true,
                        },
                        {
                          name: contextMode === 'forense' ? 'Perfil DB #03' : 'Variante Neutra',
                          bands: [14, 55, 90],
                          isMatch: false,
                        },
                      ].map((col, idx) => (
                        <div
                          key={idx}
                          className={`rounded-none border p-2.5 flex flex-col items-center transition ${
                            isStepDone && col.isMatch
                              ? 'bg-yellow-400/20 border-yellow-400 shadow-neon-yellow'
                              : col.isTarget
                              ? 'bg-zinc-900 border-yellow-400/60'
                              : 'bg-zinc-950 border-zinc-800'
                          }`}
                        >
                          <span className="text-[10px] font-mono text-center text-zinc-200 mb-2 h-7 flex items-center">
                            {col.name}
                          </span>
                          <div className="w-full h-28 bg-black border border-zinc-800 relative">
                            {col.bands.map((topPct, bIdx) => (
                              <div
                                key={bIdx}
                                style={{ top: `${topPct}%` }}
                                className={`absolute left-2 right-2 h-1.5 ${
                                  isStepDone && (col.isMatch || col.isTarget)
                                    ? 'bg-yellow-400 shadow-[0_0_10px_#FACC15]'
                                    : 'bg-zinc-500'
                                }`}
                              ></div>
                            ))}
                          </div>
                          {isStepDone && col.isMatch && (
                            <span className="mt-2 px-1.5 py-0.5 bg-yellow-400 text-black text-[10px] font-mono font-bold terminal-blink">
                              100% MATCH!
                            </span>
                          )}
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Bottom Status Strip */}
                <div className="relative z-10 mt-4 pt-2 border-t border-yellow-400/30 flex items-center justify-between text-[11px] font-mono text-zinc-400">
                  <span>
                    APLICAÇÃO: {contextMode === 'forense' ? 'INVESTIGAÇÃO CRIMINAL (CODIS)' : 'DIAGNÓSTICO CLÍNICO'}
                  </span>
                  {isStepDone && <span className="text-yellow-400 font-bold terminal-blink">&gt;&gt; EVIDÊNCIA SINCRONIZADA</span>}
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    /* ============================================================================
     * 8. INTERAÇÃO 3: MINIGAME — QUADRO DE INVESTIGAÇÃO (JOGO DA MEMÓRIA)
     * ============================================================================ */
    function buildShuffledDeck(numPairs) {
      const subset = MEMORY_PAIRS_DATA.slice(0, numPairs);
      const cards = [];
      subset.forEach((pair) => {
        cards.push({
          uid: `${pair.pairId}-a`,
          pairId: pair.pairId,
          label: pair.a.label,
          tag: pair.a.tag,
          category: pair.category,
          color: pair.color,
          explanation: pair.explanation,
        });
        cards.push({
          uid: `${pair.pairId}-b`,
          pairId: pair.pairId,
          label: pair.b.label,
          tag: pair.b.tag,
          category: pair.category,
          color: pair.color,
          explanation: pair.explanation,
        });
      });

      for (let i = cards.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [cards[i], cards[j]] = [cards[j], cards[i]];
      }
      return cards;
    }

    function GeneticMemoryGame({ onWinGame }) {
      const [pairCount, setPairCount] = useState(6);
      const [cards, setCards] = useState(() => buildShuffledDeck(6));
      const [flippedIndices, setFlippedIndices] = useState([]);
      const [matchedPairIds, setMatchedPairIds] = useState([]);
      const [moves, setMoves] = useState(0);
      const [isLocked, setIsLocked] = useState(false);
      const [lastMatchExplanation, setLastMatchExplanation] = useState(
        'Vire duas cartas no quadro de investigação para conectar pares lógicos (ex: Adenina ↔ Timina, Local do Crime ↔ Coleta de DNA).'
      );
      const [elapsedSec, setElapsedSec] = useState(0);
      const [hasStarted, setHasStarted] = useState(false);
      const mismatchTimerRef = useRef(null);

      const isWon = matchedPairIds.length === pairCount;

      useEffect(() => {
        return () => {
          if (mismatchTimerRef.current) clearTimeout(mismatchTimerRef.current);
        };
      }, []);

      useEffect(() => {
        if (!hasStarted || isWon) return;
        const interval = setInterval(() => setElapsedSec((s) => s + 1), 1000);
        return () => clearInterval(interval);
      }, [hasStarted, isWon]);

      useEffect(() => {
        if (isWon) {
          onWinGame();
        }
      }, [isWon, onWinGame]);

      const restartGame = (newCount = pairCount) => {
        soundEngine.playClick();
        if (mismatchTimerRef.current) {
          clearTimeout(mismatchTimerRef.current);
          mismatchTimerRef.current = null;
        }
        setPairCount(newCount);
        setCards(buildShuffledDeck(newCount));
        setFlippedIndices([]);
        setMatchedPairIds([]);
        setMoves(0);
        setIsLocked(false);
        setElapsedSec(0);
        setHasStarted(false);
        setLastMatchExplanation(
          'Quadro reembaralhado! Conecte todos os pares lógicos com precisão pericial.'
        );
      };

      const handleCardClick = (idx) => {
        if (isLocked) return;
        if (flippedIndices.includes(idx)) return;
        const card = cards[idx];
        if (matchedPairIds.includes(card.pairId)) return;

        if (!hasStarted) setHasStarted(true);
        soundEngine.playClick();

        const nextFlipped = [...flippedIndices, idx];
        setFlippedIndices(nextFlipped);

        if (nextFlipped.length === 2) {
          setMoves((m) => m + 1);
          const firstCard = cards[nextFlipped[0]];
          const secondCard = cards[nextFlipped[1]];

          if (firstCard.pairId === secondCard.pairId) {
            const updatedMatches = [...matchedPairIds, firstCard.pairId];
            setMatchedPairIds(updatedMatches);
            setFlippedIndices([]);
            setLastMatchExplanation(`✓ Par Lógico Formado: ${firstCard.label} ↔ ${secondCard.label} — ${firstCard.explanation}`);
            if (updatedMatches.length === pairCount) {
              soundEngine.playVictory();
            } else {
              soundEngine.playSuccess();
            }
          } else {
            setIsLocked(true);
            mismatchTimerRef.current = setTimeout(() => {
              mismatchTimerRef.current = null;
              soundEngine.playError();
              setFlippedIndices([]);
              setIsLocked(false);
            }, 900);
          }
        }
      };

      const accuracy = moves > 0 ? Math.min(100, Math.round((matchedPairIds.length / moves) * 100)) : 100;

      return (
        <section id="memoria" className="py-16 sm:py-24 px-4 sm:px-6 max-w-7xl mx-auto">
          <SectionHeader
            eyebrow="Interação 03 // Quadro de Investigação"
            title="Jogo da Memória: Conexões do Caso"
            accent="red"
            subtitle="Explore o quadro de detetive conectando pares lógicos científicos: Adenina ↔ Timina, Citosina ↔ Guanina, Local do Crime ↔ Coleta de DNA e Doença Genética ↔ Diagnóstico por Biotecnologia."
          />

          <div className="detective-board rounded-none p-5 sm:p-7 relative">
            <div className="hazard-tape-thin h-2 w-full mb-5 border border-yellow-400/50" aria-hidden="true"></div>

            {/* HUD Scoreboard */}
            <div className="flex flex-wrap items-center justify-between gap-3 mb-5 pb-4 border-b border-yellow-400/30">
              <div className="flex flex-wrap gap-2">
                <button
                  type="button"
                  onClick={() => restartGame(6)}
                  className={`px-3 py-1.5 rounded-none text-xs font-mono border transition ${
                    pairCount === 6
                      ? 'bg-yellow-400 border-yellow-300 text-black font-bold'
                      : 'bg-zinc-900 border-zinc-700 text-zinc-300 hover:border-yellow-400 hover:text-yellow-400'
                  }`}
                >
                  CASO PADRÃO (12 EVIDÊNCIAS)
                </button>
                <button
                  type="button"
                  onClick={() => restartGame(8)}
                  className={`px-3 py-1.5 rounded-none text-xs font-mono border transition ${
                    pairCount === 8
                      ? 'bg-yellow-400 border-yellow-300 text-black font-bold'
                      : 'bg-zinc-900 border-zinc-700 text-zinc-300 hover:border-yellow-400 hover:text-yellow-400'
                  }`}
                >
                  CASO COMPLETO (16 EVIDÊNCIAS)
                </button>
              </div>

              <div className="flex flex-wrap items-center gap-2.5 text-xs font-mono">
                <div className="px-3 py-1.5 rounded-none bg-black border border-zinc-700">
                  MOVIMENTOS: <strong className="text-yellow-400">{moves}</strong>
                </div>
                <div className="px-3 py-1.5 rounded-none bg-black border border-yellow-400/50">
                  PARES: <strong className="text-yellow-400">{matchedPairIds.length}/{pairCount}</strong>
                </div>
                <div className="px-3 py-1.5 rounded-none bg-black border border-zinc-700">
                  TEMPO: <strong className="text-white">{elapsedSec}s</strong>
                </div>
                <button
                  type="button"
                  onClick={() => restartGame(pairCount)}
                  className="px-3.5 py-1.5 rounded-none bg-zinc-900 hover:bg-yellow-400 hover:text-black border border-yellow-400 text-yellow-400 font-bold transition"
                >
                  REINICIAR QUADRO
                </button>
              </div>
            </div>

            {/* Educational Insight Strip */}
            <div
              role="status"
              aria-live="polite"
              className={`mb-6 p-3.5 rounded-none border text-xs sm:text-sm font-mono transition-colors ${
                lastMatchExplanation.startsWith('✓')
                  ? 'police-scanner bg-yellow-400/15 border-yellow-400 text-yellow-300 shadow-neon-yellow'
                  : 'bg-black border-zinc-700 text-zinc-300'
              }`}
            >
              <span className="relative z-10">
                {lastMatchExplanation.startsWith('✓') && <strong className="terminal-blink mr-2">[CONEXÃO DETECTADA]</strong>}
                {lastMatchExplanation}
              </span>
            </div>

            {/* Card Grid: Quadro de Detetive com Alto Contraste em Amarelo quando virada */}
            <div
              className={`grid gap-3 sm:gap-4 ${
                pairCount === 8 ? 'grid-cols-2 sm:grid-cols-4' : 'grid-cols-2 sm:grid-cols-3 lg:grid-cols-4'
              }`}
            >
              {cards.map((card, idx) => {
                const isFlipped = flippedIndices.includes(idx) || matchedPairIds.includes(card.pairId);
                const isMatched = matchedPairIds.includes(card.pairId);

                return (
                  <button
                    key={card.uid}
                    type="button"
                    onClick={() => handleCardClick(idx)}
                    aria-label={isFlipped ? `${card.label} — ${card.tag}` : `Evidência fechada número ${idx + 1}`}
                    aria-pressed={isFlipped}
                    className="perspective-1000 h-32 sm:h-36 w-full text-left focus:outline-none group"
                  >
                    <div
                      className={`relative w-full h-full transform-style-3d transition-transform duration-500 ${
                        isFlipped ? 'rotate-y-180' : 'group-hover:-translate-y-1'
                      }`}
                    >
                      {/* Front (Hidden Face - Etiqueta Escura de Evidência) */}
                      <div className="backface-hidden absolute inset-0 rounded-none bg-zinc-900 border border-zinc-700 group-hover:border-yellow-400 p-3 flex flex-col items-center justify-center shadow-lg transition">
                        <div className="w-8 h-8 rounded-none border border-yellow-400/60 bg-black flex items-center justify-center mb-2 text-yellow-400 font-mono font-bold text-xs">
                          #{String(idx + 1).padStart(2, '0')}
                        </div>
                        <span className="text-[10px] font-mono tracking-widest text-yellow-400/90 uppercase">
                          EVIDÊNCIA LACRADA
                        </span>
                        <span className="text-[9px] font-mono text-zinc-500 mt-0.5">
                          CLIQUE P/ INSPECIONAR
                        </span>
                      </div>

                      {/* Back (Revealed Face - ALTO CONTRASTE EM AMARELO #FACC15) */}
                      <div
                        className={`backface-hidden rotate-y-180 absolute inset-0 rounded-none p-3 flex flex-col justify-between border-2 transition ${
                          isMatched
                            ? 'bg-yellow-400 border-white text-black shadow-neon-yellow'
                            : 'bg-yellow-400 border-yellow-200 text-black shadow-neon-yellow'
                        }`}
                      >
                        <div className="flex items-center justify-between gap-1 border-b border-black/25 pb-1">
                          <span className="text-[9px] font-mono uppercase tracking-wider px-1.5 py-0.5 bg-black text-yellow-400 font-bold truncate">
                            {card.category}
                          </span>
                          {isMatched && <span className="text-xs bg-black text-yellow-400 px-1 font-mono font-bold">✓ PAR</span>}
                        </div>

                        <div className="font-display uppercase text-black text-sm sm:text-base leading-tight">
                          {card.label}
                        </div>

                        <div className="text-[11px] font-mono font-bold text-zinc-900">
                          [{card.tag}]
                        </div>
                      </div>
                    </div>
                  </button>
                );
              })}
            </div>

            {/* Educational Victory Message */}
            {isWon && (
              <div className="mt-7 police-scanner p-6 rounded-none bg-black border-2 border-yellow-400 shadow-neon-yellow animate-spring">
                <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-4 relative z-10">
                  <div>
                    <span className="inline-block px-3 py-1 rounded-none bg-yellow-400 text-black font-mono text-xs font-bold mb-2 terminal-blink">
                      ★ CASO SOLUCIONADO // CONEXÕES PERICIAIS VALIDADAS
                    </span>
                    <h3 className="text-xl sm:text-2xl font-display uppercase text-white mb-1">
                      Parabéns! Todas as {pairCount} conexões do quadro foram desvendadas!
                    </h3>
                    <p className="text-xs sm:text-sm font-mono text-zinc-300 leading-relaxed max-w-2xl">
                      Em <strong className="text-yellow-400">{moves} movimentos</strong> ({elapsedSec}s • Precisão de <strong className="text-yellow-400">{accuracy}%</strong>), você concluiu o pareamento molecular (A=T, C≡G) e conectou coleta forense e diagnósticos médicos de precisão.
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => restartGame(pairCount)}
                    className="shrink-0 px-5 py-3 rounded-none bg-yellow-400 hover:bg-yellow-300 text-black font-mono uppercase font-bold text-sm border-2 border-yellow-200 transition"
                  >
                    NOVO INQUÉRITO
                  </button>
                </div>
              </div>
            )}
          </div>
        </section>
      );
    }

    /* ============================================================================
     * 9. SEÇÃO DE DESFECHO: CARROSSEL DE PASTAS CONFIDENCIAIS ("CASOS SOLUCIONADOS")
     * ============================================================================ */
    function SolvedCasesCarousel() {
      const [filter, setFilter] = useState('all');
      const [activeIdx, setActiveIdx] = useState(0);
      const [expandedCaseId, setExpandedCaseId] = useState(SOLVED_CASES[0].id);

      const visibleCases = useMemo(() => {
        if (filter === 'all') return SOLVED_CASES;
        return SOLVED_CASES.filter((c) => c.domain === filter);
      }, [filter]);

      const currentCase = visibleCases[activeIdx] || visibleCases[0];

      const goPrev = () => {
        soundEngine.playClick();
        const nextIdx = (activeIdx - 1 + visibleCases.length) % visibleCases.length;
        setActiveIdx(nextIdx);
        if (visibleCases[nextIdx]) setExpandedCaseId(visibleCases[nextIdx].id);
      };

      const goNext = () => {
        soundEngine.playClick();
        const nextIdx = (activeIdx + 1) % visibleCases.length;
        setActiveIdx(nextIdx);
        if (visibleCases[nextIdx]) setExpandedCaseId(visibleCases[nextIdx].id);
      };

      return (
        <section id="casos" className="py-16 sm:py-24 px-4 sm:px-6 max-w-7xl mx-auto">
          <SectionHeader
            eyebrow="Desfecho // Arquivo Policial & Médico"
            title="Casos Solucionados: Dossiês Confidenciais"
            accent="cyan"
            subtitle="Navegue pelo carrossel de pastas confidenciais encerradas pela Biotecnologia Vermelha e Genética Forense. Clique em qualquer arquivo para abrir o relatório técnico completo."
          />

          {/* Filter & Carousel Controls */}
          <div className="flex flex-wrap items-center justify-between gap-3 mb-6">
            <div className="flex flex-wrap gap-2">
              {['all', 'Genética Forense', 'Biotecnologia Vermelha'].map((f) => (
                <button
                  key={f}
                  type="button"
                  onClick={() => {
                    soundEngine.playClick();
                    setFilter(f);
                    setActiveIdx(0);
                    const nextList = f === 'all' ? SOLVED_CASES : SOLVED_CASES.filter((c) => c.domain === f);
                    if (nextList[0]) setExpandedCaseId(nextList[0].id);
                  }}
                  className={`px-3.5 py-1.5 rounded-none text-xs font-mono uppercase border transition ${
                    filter === f
                      ? 'bg-yellow-400 border-yellow-300 text-black font-bold'
                      : 'bg-zinc-900 border-zinc-700 text-zinc-300 hover:border-yellow-400 hover:text-yellow-400'
                  }`}
                >
                  {f === 'all' ? 'TODOS OS DOSSIÊS' : f.toUpperCase()}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-2">
              <button
                type="button"
                onClick={goPrev}
                aria-label="Caso anterior"
                className="w-9 h-9 rounded-none bg-zinc-900 border border-yellow-400/60 hover:bg-yellow-400 hover:text-black text-yellow-400 font-bold flex items-center justify-center transition"
              >
                ←
              </button>
              <span className="text-xs font-mono text-yellow-400 px-2">
                {activeIdx + 1} / {visibleCases.length}
              </span>
              <button
                type="button"
                onClick={goNext}
                aria-label="Próximo caso"
                className="w-9 h-9 rounded-none bg-zinc-900 border border-yellow-400/60 hover:bg-yellow-400 hover:text-black text-yellow-400 font-bold flex items-center justify-center transition"
              >
                →
              </button>
            </div>
          </div>

          {/* Horizontal Confidential Folder Selector Strip */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
            {visibleCases.map((item, idx) => {
              const isSelected = currentCase.id === item.id;
              return (
                <button
                  key={item.id}
                  type="button"
                  onClick={() => {
                    soundEngine.playClick();
                    setActiveIdx(idx);
                    setExpandedCaseId(item.id);
                  }}
                  className={`text-left rounded-none p-5 border transition-all relative overflow-hidden group ${
                    isSelected
                      ? 'bg-zinc-900 border-2 border-yellow-400 shadow-neon-yellow'
                      : 'dossier-card border-zinc-700 hover:border-yellow-400'
                  }`}
                >
                  {isSelected && <div className="hazard-tape-thin h-1.5 w-full mb-3" aria-hidden="true"></div>}

                  {/* Folder Tab Top */}
                  <div className="flex items-center justify-between gap-2 mb-3">
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded-none bg-black border border-yellow-400/50 text-yellow-400">
                      {item.code}
                    </span>
                    <span className="text-[10px] font-mono px-2 py-0.5 rounded-none bg-yellow-400 text-black font-bold">

    /* ============================================================================

          <div
            className="dossier-card max-w-4xl w-full max-h-[90vh] overflow-y-auto rounded-none border-2 border-yellow-400 p-5 sm:p-6 shadow-neon-yellow animate-spring"

    /* ============================================================================
     * 10.1 MODAL DE ACESSO MOBILE // QR CODE WI-FI
     * ============================================================================ */
    function MobileConnectModal({ open, onClose }) {
      const [copied, setCopied] = useState(false);
      const mobileUrl = 'http://192.168.100.8:8000';

      useEffect(() => {
        if (!open) return;
        const onEsc = (e) => {
          if (e.key === 'Escape') onClose();
        };
        window.addEventListener('keydown', onEsc);
        return () => window.removeEventListener('keydown', onEsc);
      }, [open, onClose]);

      if (!open) return null;

      const handleCopy = () => {
        if (navigator.clipboard) {
          navigator.clipboard.writeText(mobileUrl);
          setCopied(true);
          soundEngine.playSuccess();
          setTimeout(() => setCopied(false), 2000);
        }
      };

      return (
        <div
          className="fixed inset-0 z-50 bg-black/90 backdrop-blur-sm flex items-center justify-center p-4"
          role="dialog"
          aria-modal="true"
          aria-label="Conexão Mobile via QR Code"
          onClick={onClose}
        >
          <div
            className="dossier-card max-w-md w-full bg-zinc-950 border-2 border-yellow-400 p-5 sm:p-6 shadow-neon-yellow animate-spring"
            onClick={(e) => e.stopPropagation()}
          >
            <div className="hazard-tape-thin h-2 w-full mb-3" aria-hidden="true"></div>
            <div className="flex items-center justify-between border-b border-yellow-400/50 pb-3 mb-4">
              <div className="flex items-center gap-2">
                <span className="w-2.5 h-2.5 bg-yellow-400 terminal-blink"></span>
                <h3 className="font-display text-sm sm:text-base font-bold text-white uppercase tracking-wider">
                  ACESSO NO CELULAR // CSI-NET
                </h3>
              </div>
              <button
                type="button"
                onClick={() => {
                  soundEngine.playClick();
                  onClose();
                }}
                className="w-7 h-7 flex items-center justify-center border border-yellow-400/60 text-yellow-400 hover:bg-yellow-400 hover:text-black font-mono font-bold text-sm"
                aria-label="Fechar modal"
              >
                ✕
              </button>
            </div>

            <div className="text-center mb-3">
              <p className="text-xs font-mono text-zinc-300">
                Aponte a câmera do seu smartphone para o QR Code abaixo para abrir a SPA no celular:
              </p>
            </div>

            {/* QR Code Container */}
            <div className="bg-white p-3 border-2 border-yellow-400 mx-auto w-56 h-56 flex items-center justify-center mb-4 shadow-lg">
              <img
                src="qr_code.svg"
                alt="QR Code para acesso mobile"
                className="w-full h-full object-contain"
              />
            </div>

            {/* Direct URL */}
            <div className="bg-black border border-yellow-400/60 p-2.5 mb-3 text-center">
              <div className="text-[10px] font-mono text-zinc-400 uppercase tracking-wider mb-1">
                Ou digite no navegador do celular:
              </div>
              <a
                href={mobileUrl}
                target="_blank"
                rel="noreferrer"
                className="font-mono text-sm sm:text-base font-bold text-yellow-400 hover:underline break-all"
              >
                {mobileUrl}
              </a>
            </div>

            {/* Instructions */}
            <div className="space-y-1.5 text-[11px] font-mono text-zinc-300 border-t border-zinc-800 pt-3 mb-4">
              <div className="flex items-start gap-2">
                <span className="text-yellow-400 font-bold">1.</span>
                <span>O celular e o PC devem estar conectados no <strong>mesmo Wi-Fi</strong>.</span>
              </div>
              <div className="flex items-start gap-2">
                <span className="text-yellow-400 font-bold">2.</span>
                <span>Todas as mecânicas táticas (DNA 3D, Pareamento por toque, Pipeline de 5 fases e Minigame) são 100% responsivas para touch.</span>
              </div>
            </div>

            <div className="flex gap-2">
              <button
                type="button"
                onClick={handleCopy}
                className="flex-1 py-2 bg-yellow-400 text-black font-mono font-bold text-xs uppercase hover:bg-yellow-300 transition"
              >
                {copied ? '✓ LINK COPIADO!' : 'COPIAR LINK'}
              </button>
              <button
                type="button"
                onClick={() => {
                  soundEngine.playClick();
                  onClose();
                }}
                className="px-4 py-2 border border-zinc-700 hover:border-yellow-400 text-zinc-300 hover:text-yellow-400 font-mono text-xs uppercase transition"
              >
                FECHAR
              </button>
            </div>
          </div>
        </div>
      );
    }

                  <a
                    href="#hero"
                    className="px-3 py-1.5 rounded-none bg-yellow-400 hover:bg-yellow-300 text-xs font-mono font-bold text-black transition"
                  >
                    TOPO ↑
                  </a>
                </div>
              </div>
            </div>
          </footer>

          <PosterModal open={posterOpen} onClose={() => setPosterOpen(false)} />
          <MobileConnectModal open={mobileModalOpen} onClose={() => setMobileModalOpen(false)} />
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
