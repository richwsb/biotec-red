    /* ============================================================================
     * 9. SEÇÃO DE DESFECHO: CARROSSEL DE PASTAS CONFIDENCIAIS ("CASOS SOLUCIONADOS")
     * ============================================================================ */
    function SolvedCasesCarousel() {
      const [filter, setFilter] = useState('all');
      const [activeIdx, setActiveIdx] = useState(0);
      const [expandedCaseId, setExpandedCaseId] = useState(SOLVED_CASES[0].id);

      const visibleCases = useMemo(() => {
        if (filter === 'all') return SOLVED_CASES;
        return SOLVED_CASES.filter((c) => c.domain === filter);
      }, [filter]);

      const currentCase = visibleCases[activeIdx] || visibleCases[0];

      const goPrev = () => {
        soundEngine.playClick();
        const nextIdx = (activeIdx - 1 + visibleCases.length) % visibleCases.length;
        setActiveIdx(nextIdx);
        if (visibleCases[nextIdx]) setExpandedCaseId(visibleCases[nextIdx].id);
      };

      const goNext = () => {
        soundEngine.playClick();
        const nextIdx = (activeIdx + 1) % visibleCases.length;
        setActiveIdx(nextIdx);
        if (visibleCases[nextIdx]) setExpandedCaseId(visibleCases[nextIdx].id);
      };

      const filterTestIds = {
        all: 'cases-filter-all',
        'Genética Forense': 'cases-filter-forense',
        'Biotecnologia Vermelha': 'cases-filter-biotech',
      };

      return (
        <section
          id="casos"
          data-testid="cases-section"
          className="py-16 sm:py-24 px-4 sm:px-6 max-w-7xl mx-auto"
        >
          <SectionHeader
            eyebrow="Desfecho // Arquivo Policial & Médico"
            title="Casos Solucionados: Dossiês Confidenciais"
            accent="cyan"
            subtitle="Navegue pelo carrossel de pastas confidenciais encerradas pela Biotecnologia Vermelha e Genética Forense. Clique em qualquer arquivo para abrir o relatório técnico completo."
          />

          {/* Filter & Carousel Controls */}
          <div className="flex flex-wrap items-center justify-between gap-4 mb-6">
            <div className="flex flex-wrap gap-2">
              {['all', 'Genética Forense', 'Biotecnologia Vermelha'].map((f) => (
                <button
                  key={f}
                  type="button"
                  data-testid={filterTestIds[f]}
                  onClick={() => {
                    soundEngine.playClick();
                    setFilter(f);
                    setActiveIdx(0);
                    const nextList = f === 'all' ? SOLVED_CASES : SOLVED_CASES.filter((c) => c.domain === f);
                    if (nextList[0]) setExpandedCaseId(nextList[0].id);
                  }}
                  className={`px-3.5 py-2 text-[11px] font-mono uppercase tracking-[0.1em] border transition-[background-color,border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] ${
                    filter === f
                      ? 'bg-yellow-400 border-yellow-400 text-black font-bold'
                      : 'bg-black border-zinc-800 text-zinc-400 hover:border-zinc-600 hover:text-zinc-100'
                  }`}
                >
                  {f === 'all' ? 'TODOS OS DOSSIÊS' : f.toUpperCase()}
                </button>
              ))}
            </div>

            <div className="flex items-center gap-2">
              <button
                type="button"
                data-testid="cases-prev"
                onClick={goPrev}
                aria-label="Caso anterior"
                className="w-9 h-9 bg-black border border-zinc-800 hover:border-yellow-400 hover:text-yellow-400 text-zinc-300 font-mono flex items-center justify-center transition-[border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
              >
                ←
              </button>
              <span className="text-xs font-mono text-yellow-400 px-2 tabular-nums">
                {activeIdx + 1} / {visibleCases.length}
              </span>
              <button
                type="button"
                data-testid="cases-next"
                onClick={goNext}
                aria-label="Próximo caso"
                className="w-9 h-9 bg-black border border-zinc-800 hover:border-yellow-400 hover:text-yellow-400 text-zinc-300 font-mono flex items-center justify-center transition-[border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
              >
                →
              </button>
            </div>
          </div>

          {/* Horizontal Confidential Folder Selector Strip */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
            {visibleCases.map((item, idx) => {
              const isSelected = currentCase.id === item.id;
              return (
                <button
                  key={item.id}
                  type="button"
                  data-testid={`case-folder-${item.id}`}
                  onClick={() => {
                    soundEngine.playClick();
                    setActiveIdx(idx);
                    setExpandedCaseId(item.id);
                  }}
                  className={`text-left p-5 border transition-[background-color,border-color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] relative overflow-hidden group ${
                    isSelected
                      ? 'bg-zinc-950 border-yellow-400'
                      : 'bg-black border-zinc-800 hover:border-zinc-600'
                  }`}
                >
                  {isSelected && <span className="absolute top-0 inset-x-0 h-0.5 bg-yellow-400" aria-hidden="true"></span>}

                  {/* Folder Tab Top */}
                  <div className="flex items-center justify-between gap-2 mb-3">
                    <span
                      className={`text-[10px] font-mono px-2 py-0.5 border tabular-nums ${
                        isSelected
                          ? 'bg-black border-yellow-400/60 text-yellow-400'
                          : 'bg-zinc-950 border-zinc-800 text-zinc-400'
                      }`}
                    >
                      {item.code}
                    </span>
                    <span
                      className={`text-[10px] font-mono px-2 py-0.5 font-bold ${
                        isSelected ? 'bg-yellow-400 text-black' : 'bg-zinc-900 text-zinc-300'
                      }`}
                    >
                      SOLUCIONADO
                    </span>
                  </div>

                  <div className="text-[10px] font-mono text-zinc-500 uppercase tracking-[0.14em] mb-1">
                    {item.domain}
                  </div>
                  <h3 className="font-display font-semibold text-zinc-100 text-base leading-snug mb-2 group-hover:text-yellow-400 transition-[color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]">
                    {item.title}
                  </h3>
                  <p className="text-xs font-sans text-zinc-400 line-clamp-2 leading-relaxed">{item.summary}</p>

                  <div className="mt-4 pt-3 border-t border-zinc-800/80 flex items-center justify-between text-[11px] font-mono">
                    <span className={isSelected ? 'text-yellow-400' : 'text-zinc-500'}>
                      {expandedCaseId === item.id ? 'PASTA ABERTA ▼' : 'ABRIR DOSSIÊ →'}
                    </span>
                    <span className="text-zinc-200 font-semibold tabular-nums">{Object.values(item.metrics)[1]}</span>
                  </div>
                </button>
              );
            })}
          </div>

          {/* Expanded Confidential Case Dossier Panel */}
          {currentCase && (
            <article
              key={currentCase.id}
              data-testid="case-dossier-panel"
              className="bg-zinc-950 border border-zinc-800 p-6 sm:p-8 relative overflow-hidden animate-tactical-in"
            >
              <span className="absolute top-0 inset-x-0 h-0.5 bg-yellow-400" aria-hidden="true"></span>

              <div className="hidden sm:block absolute top-8 right-8 border border-yellow-400/70 text-yellow-400 px-3 py-1 font-mono text-[10px] tracking-[0.18em] pointer-events-none uppercase">
                CONFIDENCIAL // RESOLVIDO
              </div>

              <div className="flex flex-wrap items-center gap-3 mb-4">
                <span className="text-[11px] font-mono px-2.5 py-1 bg-yellow-400 text-black font-bold uppercase tracking-[0.1em] tabular-nums">
                  {currentCase.domain.toUpperCase()} // <ScrambleText text={currentCase.code} />
                </span>
              </div>

              <h3 className="text-xl sm:text-3xl font-display font-semibold tracking-[-0.02em] text-zinc-100 mb-3 sm:pr-52">
                {currentCase.title}
              </h3>

              <p className="text-sm font-sans text-zinc-300 leading-relaxed mb-6 max-w-[68ch]">
                {currentCase.summary}
              </p>

              <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-px bg-zinc-800 border border-zinc-800 text-left">
                <div className="bg-black p-5">
                  <div className="text-[10px] font-mono text-yellow-400 font-semibold uppercase tracking-[0.14em] mb-2">
                    01. AMOSTRA COLETADA
                  </div>
                  <p className="text-xs sm:text-sm font-sans text-zinc-300 leading-relaxed">{currentCase.sample}</p>
                </div>
                <div className="bg-black p-5">
                  <div className="text-[10px] font-mono text-yellow-400 font-semibold uppercase tracking-[0.14em] mb-2">
                    02. PROTOCOLO MOLECULAR
                  </div>
                  <p className="text-xs sm:text-sm font-sans text-zinc-300 leading-relaxed">{currentCase.technique}</p>
                </div>
                <div className="bg-black p-5">
                  <div className="text-[10px] font-mono text-yellow-400 font-semibold uppercase tracking-[0.14em] mb-2">
                    03. RESULTADO PERICIAL
                  </div>
                  <p className="text-xs sm:text-sm font-sans text-zinc-300 leading-relaxed">{currentCase.outcome}</p>
                </div>
                <div className="bg-zinc-950 p-5">
                  <div className="text-[10px] font-mono text-yellow-400 font-semibold uppercase tracking-[0.14em] mb-2">
                    04. IMPACTO &amp; VEREDITO
                  </div>
                  <p className="text-xs sm:text-sm font-sans text-zinc-100 leading-relaxed mb-4">{currentCase.impact}</p>
                  <div className="flex flex-wrap gap-1.5">
                    {Object.entries(currentCase.metrics).map(([k, v]) => (
                      <span
                        key={k}
                        className="text-[10px] font-mono px-2 py-0.5 bg-yellow-400 text-black font-bold tabular-nums"
                      >
                        {v}
                      </span>
                    ))}
                  </div>
                </div>
              </div>
            </article>
          )}
        </section>
      );
    }

    /* ============================================================================
     * 10. MODAL DO PÔSTER OFICIAL UFPA / FABIOTEC (NATIVE HTML5 <dialog>)
     * ============================================================================ */
    function PosterModal({ open, onClose }) {
      const dialogRef = useRef(null);

      useEffect(() => {
        const dialog = dialogRef.current;
        if (!dialog) return;
        if (open && !dialog.open) {
          if (typeof dialog.showModal === 'function') {
            dialog.showModal();
          } else {
            dialog.setAttribute('open', '');
          }
        } else if (!open && dialog.open) {
          if (typeof dialog.close === 'function') {
            dialog.close();
          } else {
            dialog.removeAttribute('open');
          }
        }
      }, [open]);

      return (
        <dialog
          ref={dialogRef}
          data-testid="poster-modal"
          aria-label="Pôster Científico Oficial UFPA FABIOTEC"
          onCancel={(e) => {
            e.preventDefault();
            onClose();
          }}
          onClick={(e) => {
            if (e.target === e.currentTarget) onClose();
          }}
          className="tactical-dialog overflow-visible"
        >
          <div className="bg-zinc-950 w-full max-h-[90vh] overflow-y-auto border border-zinc-700 p-6 sm:p-8 relative">
            <span className="absolute top-0 inset-x-0 h-0.5 bg-yellow-400" aria-hidden="true"></span>
            <div className="flex items-start justify-between gap-4 border-b border-zinc-800 pb-4 mb-5">
              <div>
                <span className="text-[11px] font-mono text-yellow-400 uppercase tracking-[0.14em]">
                  Universidade Federal do Pará (UFPA) • ICB • FABIOTEC
                </span>
                <h3 className="text-lg sm:text-xl font-display font-semibold text-zinc-100 mt-1">
                  Arquivo Base: Biotecnologia Vermelha — DNA e Diagnóstico
                </h3>
              </div>
              <button
                type="button"
                data-testid="poster-modal-close"
                onClick={onClose}
                className="px-3 py-1.5 bg-yellow-400 hover:bg-yellow-300 text-xs font-mono font-bold text-black transition-[background-color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
              >
                FECHAR [ESC]
              </button>
            </div>

            <div className="overflow-hidden border border-zinc-800 bg-black mb-5 flex justify-center">
              <img
                src={POSTER_IMAGE_PATH}
                alt="Pôster acadêmico Biotecnologia Vermelha - DNA e Diagnóstico da UFPA FABIOTEC"
                className="max-h-[60vh] w-auto object-contain"
              />
            </div>

            <div className="text-xs font-sans text-zinc-300 space-y-2 leading-relaxed">
              <p>
                <strong className="font-mono text-yellow-400 uppercase tracking-[0.08em] mr-1">
                  Extensão Biotecnologia Vermelha — Autores:
                </strong>{' '}
                Hanna Gabrielle Tavares Favacho, Jéssica Larissa Valle de Souza, Julliany Christinny Girard Carneiro, Kayllane Cristine Bezerra Carvalho, Maria Kailane da Silva de Souza e Richard Wesley da Silva Barbosa.
              </p>
              <p className="text-zinc-500 font-mono text-[11px]">
                Referências: National Human Genome Research Institute (NHGRI), National Institute of Justice (NIJ) e Nelson &amp; Cox — Princípios de Bioquímica de Lehninger.
              </p>
            </div>
          </div>
        </dialog>
      );
    }

    /* ============================================================================

     * ============================================================================ */
    function App() {
      const [audioEnabled, setAudioEnabled] = useState(true);
      const [posterOpen, setPosterOpen] = useState(false);
      const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
      const [badges, setBadges] = useState({
        pairing: false,
        pipeline: false,
        memory: false,
      });

      const toggleAudio = () => {
        const next = !audioEnabled;
        soundEngine.enabled = next;
        setAudioEnabled(next);
        if (next) soundEngine.playClick();
      };

      const markBadge = useCallback((key) => {
        setBadges((prev) => (prev[key] ? prev : { ...prev, [key]: true }));
      }, []);

      const unlockedCount = Object.values(badges).filter(Boolean).length;

        { href: '#hero', label: 'HÉLICE 3D' },

                <div className="lg:col-span-6 space-y-6">
                  <div className="inline-flex items-center gap-2.5 px-3 py-1.5 bg-zinc-950 border border-yellow-400/60 text-yellow-400 text-[11px] font-mono uppercase tracking-[0.16em]">
                    <span className="w-1.5 h-1.5 bg-yellow-400 terminal-cursor"></span>
                    <ScrambleText text="[!] ALERTA DE SISTEMA // PROTOCOLO DNA-CSI" />
                  </div>

                  <div>
                    <div className="text-[11px] font-mono uppercase tracking-[0.16em] text-zinc-500 mb-3">
                      &gt;&gt;&gt; TRANSMISSÃO PRIORITÁRIA // BIOTECNOLOGIA &amp; PERÍCIA
                    </div>
                    <h1 className="text-4xl sm:text-5xl xl:text-6xl font-display font-bold tracking-[-0.03em] leading-[1.05] text-zinc-100">
                      ALERTA:{' '}
                      <span className="text-yellow-400">SEGREDOS DO DNA</span>{' '}
                      NA CENA DO CRIME E NA MEDICINA
                      <span className="text-yellow-400 terminal-cursor">_</span>
                    </h1>
                  </div>

                  <p className="text-sm sm:text-base font-sans text-zinc-400 leading-relaxed max-w-[60ch]">
                    Explore a interseção crítica entre a{' '}
                    <strong className="text-zinc-100 font-medium">Biotecnologia Vermelha</strong> (diagnóstico precoce de doenças genéticas, terapias gênicas e medicina personalizada) e a{' '}
                    <strong className="text-zinc-100 font-medium">Genética Forense</strong> (resolução de crimes, identificação de vítimas e vínculos biológicos) em um terminal interativo de bancada.
                  </p>

                  {/* Action CTAs */}
                  <div className="flex flex-wrap gap-3 pt-1">
                    <a
                      href="#pareamento"
                      data-testid="cta-start-pairing"
                      onClick={() => soundEngine.playClick()}
                      className="px-6 py-3.5 bg-yellow-400 hover:bg-yellow-300 text-black font-mono uppercase font-bold text-xs tracking-[0.12em] border border-yellow-400 transition-[background-color,transform] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] active:scale-[0.98] inline-flex items-center gap-2"
                    >
                      INICIAR PAREAMENTO MOLECULAR →
                    </a>
                    <a
                      href="#pipeline"
                      data-testid="cta-start-pipeline"
                      onClick={() => soundEngine.playClick()}
                      className="px-6 py-3.5 bg-zinc-950 hover:border-yellow-400 hover:text-yellow-400 border border-zinc-800 text-zinc-200 font-mono uppercase font-semibold text-xs tracking-[0.12em] transition-[border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)] inline-flex items-center"
                    >
                      PROTOCOLO DE 5 FASES
                    </a>
                  </div>

                  {/* Telemetria Estrutural em Grade 1px */}
                  <div className="grid grid-cols-3 border border-zinc-800 divide-x divide-zinc-800 bg-zinc-950/90 tabular-nums">
                    <div className="p-4">
                      <div className="text-xl sm:text-2xl font-display font-bold text-yellow-400">4 BASES</div>
                      <div className="text-[10px] font-mono uppercase tracking-[0.12em] text-zinc-500 mt-1">
                        A, T, C, G EM HÉLICE
                      </div>
                    </div>
                    <div className="p-4">
                      <div className="text-xl sm:text-2xl font-display font-bold text-zinc-100">5 FASES</div>
                      <div className="text-[10px] font-mono uppercase tracking-[0.12em] text-zinc-500 mt-1">
                        COLETA ATÉ MATCH
                      </div>
                    </div>
                    <div className="p-4">
                      <div className="text-xl sm:text-2xl font-display font-bold text-zinc-100">99.99%</div>
                      <div className="text-[10px] font-mono uppercase tracking-[0.12em] text-zinc-500 mt-1">
                        PRECISÃO STR &amp; CLÍNICA
                      </div>
                    </div>
                  </div>
                </div>

                {/* Right 3D DNA Model */}
                <div className="lg:col-span-6">
                  <DNA3DViewer />
                </div>
              </div>
            </section>

            {/* 2. SEÇÃO TEÓRICA */}
            <TheorySection />

            {/* 3. INTERAÇÃO 1: PAREAMENTO MOLECULAR */}
            <MolecularPairingLab onCompleteMission={() => markBadge('pairing')} />

            {/* 4. INTERAÇÃO 2: PIPELINE DE 5 FASES */}
            <LaboratoryPipelineStepper onCompletePipeline={() => markBadge('pipeline')} />

            {/* 5. INTERAÇÃO 3: JOGO DA MEMÓRIA */}
            <GeneticMemoryGame onWinGame={() => markBadge('memory')} />

            {/* 6. SEÇÃO DE DESFECHO: CASOS SOLUCIONADOS */}
            <SolvedCasesCarousel />
          </main>

          {/* Footer */}
          <footer className="relative z-10 border-t border-zinc-800 bg-black mt-16">
            <div className="max-w-7xl mx-auto py-12 px-4 sm:px-6 grid md:grid-cols-2 gap-8 items-center">
              <div>
                <div className="font-mono uppercase tracking-[0.14em] text-yellow-400 text-xs font-semibold mb-2">
                  Universidade Federal do Pará (UFPA) • ICB • FABIOTEC
                </div>
                <p className="text-xs font-sans text-zinc-400 leading-relaxed max-w-[65ch]">
                  Projeto de Extensão <strong className="text-zinc-200 font-medium">Biotecnologia Vermelha: DNA e Diagnóstico</strong> — Equipe: Hanna Gabrielle Tavares Favacho, Jéssica Larissa Valle de Souza, Julliany Christinny Girard Carneiro, Kayllane Cristine Bezerra Carvalho, Maria Kailane da Silva de Souza e Richard Wesley da Silva Barbosa.
                </p>
              </div>
              <div className="md:text-right space-y-3">
                <div className="text-[11px] font-mono text-zinc-500">
                  Referências: NHGRI (DNA Fact Sheet) • NIJ (DNA Evidence) • Lehninger (Princípios de Bioquímica)
                </div>
                <div className="flex md:justify-end gap-2">
                  <button
                    type="button"
                    onClick={() => setPosterOpen(true)}
                    className="px-3.5 py-2 bg-zinc-950 hover:border-yellow-400 hover:text-yellow-400 border border-zinc-800 text-[11px] font-mono font-semibold uppercase tracking-[0.1em] text-zinc-300 transition-[border-color,color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
                  >
                    ABRIR PÔSTER ORIGINAL
                  </button>
                  <a
                    href="#hero"
                    className="px-3.5 py-2 bg-yellow-400 hover:bg-yellow-300 text-[11px] font-mono font-bold uppercase tracking-[0.1em] text-black transition-[background-color] duration-200 ease-[cubic-bezier(0.16,1,0.3,1)]"
                  >
                    TOPO ↑
                  </a>
                </div>
              </div>
            </div>
          </footer>

          <PosterModal open={posterOpen} onClose={() => setPosterOpen(false)} />
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
